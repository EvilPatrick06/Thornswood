<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thornswood</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* The same palette and the same faces as the public site. Two halves of one
   thing should not look like two different products. */
:root{
  --ink:#0B0E0A; --panel:#14180F; --raised:#1D2318; --line:#2B3323; --line2:#3D4733;
  --text:#E4E7DA; --dim:#96A084; --faint:#616B53;
  --gold:#C9A24B; --gold-dim:#8A6F33;
  --pass:#6FA05A; --fail:#C05A4E; --skip:#7C8493; --blurple:#5865F2;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --carve:Cinzel,Spectral,Georgia,serif;
}
*{box-sizing:border-box}
/* Without this, hiding anything that sets its own display (the Discord button
   is inline-flex) does nothing at all, which is how both halves of the sign in
   ended up on screen at once. */
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow-x:hidden}
img{max-width:100%;height:auto}
body{background:var(--ink);color:var(--text);font:15px/1.65 var(--sans)}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold-dim);outline-offset:2px}

/* ------------------------------------------------------------- sign in -- */
#gate{position:fixed;inset:0;display:none;place-items:center;background:var(--ink);z-index:50;
  padding:20px}
#gate .box{width:min(92vw,370px);text-align:center}
#gate h1{font:600 30px/1.1 var(--carve);letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold);margin:0 0 6px}
#gate p{color:var(--dim);margin:0 0 22px;font-size:14px}
#gate input{width:100%;padding:11px 13px;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:7px;font:15px var(--sans)}
#gate input:focus{outline:none;border-color:var(--gold-dim)}
#gate button.enter{width:100%;margin-top:10px;padding:11px;background:var(--gold);color:#17190F;
  border:0;border-radius:7px;font:600 15px var(--sans);cursor:pointer}
#gate .err{color:var(--fail);font-size:13px;margin-top:12px;min-height:18px}
.discord.big{width:100%;justify-content:center;padding:14px;font-size:15px}
#gate #pwbox{margin-top:10px}
#gate .backhome{margin-top:26px;font-size:13px}
#gate .backhome a{color:var(--faint);text-decoration:none}
#gate .backhome a:hover{color:var(--gold)}
.discord{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:7px;
  background:var(--blurple);color:#fff;text-decoration:none;font:600 14px var(--sans);
  border:0;cursor:pointer}
.discord.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.discord.ghost:hover{color:#fff;background:var(--blurple);border-color:var(--blurple)}
#gate .or{color:var(--faint);font-size:12px;margin:18px 0 12px;letter-spacing:.06em}

/* ---------------------------------------------------------------- shell -- */
/*
  Five shapes to hold: a phone, a tablet, a laptop, a wide desktop, and a
  monitor stood on its end beside another one. The last is the awkward one,
  because it is narrow like a phone but as tall as a desk, so it wants the
  phone's single column and the desktop's density at once. So the column
  breaks on width alone and nothing keys off orientation.
*/
#shell{display:none;height:100%;grid-template-columns:238px minmax(0,1fr)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:22px 0 18px;
  display:flex;flex-direction:column;overflow-y:auto}
nav .brand{display:flex;align-items:center;gap:9px;font:600 17px/1 var(--carve);
  color:var(--text);padding:0 20px 16px;letter-spacing:.13em;text-transform:uppercase;
  white-space:nowrap;text-decoration:none}
nav .brand img{border-radius:5px}
nav a.tab{display:flex;align-items:center;gap:8px;padding:9px 20px;color:var(--dim);
  text-decoration:none;font-size:14px;border-left:2px solid transparent;white-space:nowrap}
nav a.tab:hover{color:var(--text);background:var(--raised)}
nav a.tab.on{color:var(--text);border-left-color:var(--gold);background:var(--raised)}
nav a.tab .key{margin-left:auto;font:600 9px var(--sans);letter-spacing:.1em;color:var(--gold-dim);
  border:1px solid var(--gold-dim);border-radius:3px;padding:1px 4px}
nav .group{font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);padding:20px 20px 6px}
nav .backout{display:block;padding:0 20px 16px;margin-top:-8px;font:400 12px var(--sans);
  color:var(--faint);text-decoration:none}
nav .backout:hover{color:var(--gold)}
@media(max-width:900px){ nav .backout{display:none} }
nav .sep{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:9px;align-items:flex-start}
nav .me{font-size:12px;color:var(--dim);line-height:1.4}
nav .me b{color:var(--gold);font-weight:600}
nav .out{font-size:12px;color:var(--faint);cursor:pointer;background:none;border:0;padding:0}
nav .out:hover{color:var(--text)}

main{overflow-y:auto;padding:34px 40px 90px;min-width:0}
.wrap{max-width:860px;margin:0 auto}
.wide .wrap{max-width:1280px}

@media(min-width:1500px){
  .wrap{max-width:920px}
  .wide .wrap{max-width:1500px}
  main{padding:44px 56px 110px}
  nav{width:266px}
  #shell{grid-template-columns:266px minmax(0,1fr)}
}
@media(min-width:2200px){
  #shell{max-width:2100px;margin:0 auto;border-right:1px solid var(--line)}
}
@media(max-width:1180px){
  #shell{grid-template-columns:200px minmax(0,1fr)}
  main{padding:30px 26px 80px}
}
@media(max-width:900px){
  html,body{height:auto}
  main{overflow-y:visible}
  #shell{grid-template-columns:1fr;height:auto;min-height:100%}
  nav{border-right:0;border-bottom:1px solid var(--line);padding:12px 0 0;
    flex-direction:row;flex-wrap:wrap;align-items:center;
    position:sticky;top:0;z-index:20;
    padding-top:calc(12px + env(safe-area-inset-top,0px))}
  nav .brand{padding:0 16px 10px;font-size:19px;flex:1 0 auto}
  nav .group{display:none}
  nav .sep{margin:0;padding:0 16px 10px;border-top:0;order:3;flex-direction:row;
    align-items:center;gap:12px}
  #tabs{order:4;flex:1 0 100%;display:flex;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line)}
  #tabs::-webkit-scrollbar{display:none}
  nav a.tab{border-left:0;border-bottom:2px solid transparent;padding:11px 14px;flex:0 0 auto}
  nav a.tab.on{border-left-color:transparent;border-bottom-color:var(--gold)}
  nav a.tab .key{display:none}
  main{padding:24px 16px 70px}
}
@media(max-width:560px){
  main{padding:20px 14px 60px}
  .wrap,.wide .wrap{max-width:100%}
}

/* ---------------------------------------------------------------- home -- */
.hero{display:flex;align-items:center;gap:20px;margin-bottom:6px}
.hero img{width:74px;height:74px;border-radius:16px;flex:0 0 auto}
.hero h1{font:600 40px/1.05 Spectral,Georgia,serif;margin:0;color:var(--text);text-wrap:balance}
.hero .sub{color:var(--dim);font-size:15px;margin-top:6px;max-width:52ch}
@media(max-width:560px){
  .hero{gap:14px}
  .hero img{width:56px;height:56px;border-radius:12px}
  .hero h1{font-size:30px}
}
.rule{height:1px;background:var(--line);margin:26px 0 24px}
.cards{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(244px,1fr))}
.card{display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:17px 17px 15px;
  transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--gold-dim);transform:translateY(-1px)}
.card .t{font:600 17px var(--carve);letter-spacing:.02em;color:var(--text);display:flex;align-items:baseline;gap:8px;
  flex-wrap:wrap}
.card .t .mark{font:600 10px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold-dim);border-radius:3px;padding:1px 5px}
.card .d{color:var(--dim);font-size:13.5px;margin-top:5px;line-height:1.55}
.card .n{margin-top:12px;font:600 12px var(--sans);letter-spacing:.05em;color:var(--faint);
  text-transform:uppercase}
.card.lead{background:linear-gradient(160deg,#242A1D,#1B1F17);border-color:var(--gold-dim)}
.card.lead .t{color:var(--gold)}
.section-label{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin:30px 0 12px}
.latest{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:9px;padding:15px 17px;margin-bottom:22px}
.latest .when{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint)}
.latest .what{font:600 16px var(--sans);margin-top:3px}
.latest a{font-size:13px}

/* ------------------------------------------------------------- toolbar -- */
.crumb{font-size:13px;color:var(--faint);margin-bottom:10px}
.crumb a{color:var(--dim);text-decoration:none}
.crumb a:hover{color:var(--gold)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.bar h2{font:600 30px/1.2 var(--carve);letter-spacing:.035em;margin:0;flex:1 1 200px;
  color:var(--text);text-wrap:balance}
@media(max-width:560px){.bar h2{font-size:24px}}
.btn{padding:7px 13px;background:var(--raised);color:var(--text);border:1px solid var(--line);
  border-radius:6px;font:14px var(--sans);cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--gold-dim)}
.btn.key{background:var(--gold);color:#17190F;border-color:var(--gold);font-weight:600}
.btn.small{min-height:0;padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.said{font-size:13px;color:var(--dim)}
.lede{color:var(--dim);font-size:14px;margin:6px 0 26px;max-width:66ch}
.tagline{display:inline-block;font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold-dim);border-radius:3px;padding:2px 6px;
  vertical-align:3px}

/* ------------------------------------------------------------- content -- */
.doc h1{font:600 30px/1.2 var(--carve);letter-spacing:.03em;margin:34px 0 12px;color:var(--text)}
.doc h2{font:600 22px/1.25 var(--carve);letter-spacing:.03em;margin:34px 0 10px;
  padding-bottom:7px;border-bottom:1px solid var(--line);color:var(--text)}
.doc h3{font:600 17px var(--sans);margin:24px 0 8px;color:var(--gold)}
.doc p,.doc li{color:var(--text)}
.doc ol,.doc ul{padding-left:22px}
.doc li{margin:4px 0}
.doc hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.doc strong{color:#F0F4E8}
.doc table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px;display:block;
  overflow-x:auto}
.doc th{text-align:left;padding:8px 11px;background:var(--raised);color:var(--gold);
  font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
.doc td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.doc blockquote{margin:16px 0;padding:8px 16px;border-left:3px solid var(--gold-dim);color:var(--dim)}
.doc code,.mdc code{font:13px var(--mono);background:var(--raised);padding:2px 5px;border-radius:4px;
  color:var(--gold)}
.mdc p{margin:0 0 6px}
.mdc p:last-child{margin:0}
/* Lists inside a cell are a few short lines, not a document. Marked makes
   them loose when the source has blank lines, which leaves a paragraph inside
   every item and a gap you could park a cart in. */
.mdc ol,.mdc ul{margin:6px 0;padding-left:20px}
.mdc li{margin:2px 0}
.mdc li p{margin:0}
.mdc h1,.mdc h2,.mdc h3{font:600 15px var(--sans);margin:8px 0 4px;color:var(--gold)}
/* The first column is the name of the thing, so it gets room to be a name
   rather than one word per line. */
table.board th:nth-child(2),table.board td:nth-child(2){min-width:168px}
.cmd{position:relative;margin:14px 0;background:#0D100B;border:1px solid var(--line);
  border-radius:8px;overflow:hidden}
.cmd pre{margin:0;padding:14px 52px 14px 15px;overflow-x:auto}
.cmd code{background:none;padding:0;color:#CFE0BE;font:13px/1.6 var(--mono)}
.cmd .copy{position:absolute;top:8px;right:8px;padding:4px 9px;background:var(--raised);
  border:1px solid var(--line);border-radius:5px;color:var(--dim);font:11px var(--sans);
  cursor:pointer}
.cmd .copy:hover{color:var(--text);border-color:var(--gold-dim)}
.cmd .copy.done{color:var(--pass);border-color:var(--pass)}
textarea.md{width:100%;min-height:62vh;padding:17px;background:#0D100B;color:var(--text);
  border:1px solid var(--line);border-radius:8px;font:13px/1.7 var(--mono);resize:vertical}
textarea.md:focus{outline:none;border-color:var(--gold-dim)}

/* --------------------------------------------------------------- board -- */
.sec{margin:26px 0 34px}
.sechead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.sechead h3{font:600 19px/1.3 var(--carve);letter-spacing:.03em;margin:0;color:var(--gold);
  padding:2px 4px;border-radius:5px;min-width:60px}
.sechead h3[contenteditable]:focus{outline:none;background:var(--raised);color:var(--text)}
.sechead .count{font:600 11px var(--sans);letter-spacing:.06em;color:var(--faint)}
.sechead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.secnote{color:var(--dim);font-size:13.5px;margin:0 0 10px;max-width:70ch}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.board{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
table.board th{text-align:left;padding:9px 12px;background:var(--raised);color:var(--gold);
  font:600 12.5px var(--sans);letter-spacing:.03em;border-bottom:1px solid var(--line);
  white-space:nowrap;position:relative}
table.board th span.nm{display:inline-block;padding:1px 3px;border-radius:4px;min-width:30px}
table.board th span.nm:focus{outline:none;background:var(--panel);color:var(--text)}
table.board th .x{margin-left:6px;color:var(--faint);background:none;border:0;cursor:pointer;
  font-size:14px;line-height:1;padding:0 2px}
table.board th .x:hover{color:var(--fail)}
table.board td{padding:0;border-bottom:1px solid var(--line);vertical-align:top}
table.board tr:last-child td{border-bottom:0}
table.board tr.done .cell{color:var(--faint);text-decoration:line-through}
table.board tr:hover td{background:rgba(255,255,255,.012)}
td.tick,th.tick{width:38px;text-align:center;padding:10px 0 0;vertical-align:top}
td.tick input{width:16px;height:16px;accent-color:var(--pass);cursor:pointer}
.cell{padding:9px 12px;min-height:38px;word-break:break-word;cursor:text;border-radius:5px}
/* Markdown brings its own line breaks. Leaving pre-wrap on turns every
   newline BETWEEN tags into a blank line, which is what a three item list
   rendering two hundred pixels tall actually was. */
.mdc{white-space:normal}
.ro .cell{cursor:default}
.cell:hover{background:rgba(201,162,75,.05)}
.ro .cell:hover{background:none}
.cell:empty::after{content:'\00a0'}
td textarea{width:100%;min-height:38px;padding:8px 11px;background:#0D100B;color:var(--text);
  border:1px solid var(--gold-dim);border-radius:5px;font:14px/1.5 var(--sans);resize:vertical;
  display:block}
td textarea:focus{outline:none}
td.rowacts{width:1%;white-space:nowrap;padding:7px 9px 7px 0;text-align:right}
td.rowacts button{background:none;border:1px solid transparent;color:var(--faint);
  border-radius:5px;cursor:pointer;font:12px var(--sans);padding:3px 7px}
td.rowacts button:hover{color:var(--text);border-color:var(--line2);background:var(--raised)}
td.rowacts button.del:hover{color:var(--fail);border-color:var(--fail)}
tr.adder td{background:rgba(255,255,255,.015)}
tr.adder input{width:100%;padding:9px 12px;background:none;border:0;color:var(--text);
  font:14px var(--sans)}
tr.adder input::placeholder{color:var(--faint)}
tr.adder input:focus{outline:none;background:#0D100B}
tr.adder .plus{color:var(--faint);font-size:16px;line-height:38px}

/* Phone and narrow: the table becomes stacked cards, because nine columns of
   Skyrim bug notes on a 380 pixel screen is a horizontal scroll nobody uses. */
@media(max-width:640px){
  .tablewrap{border:0;background:none;overflow:visible}
  table.board,table.board tbody,table.board tr,table.board td{display:block;width:auto}
  table.board{min-width:0;max-width:100%}
  table.board thead{display:none}
  table.board tr{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    margin-bottom:10px;padding:6px 4px;position:relative}
  table.board td{border-bottom:0;padding:0}
  table.board td[data-label]::before{content:attr(data-label);display:block;
    font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    padding:7px 12px 0}
  td.tick,th.tick{width:auto;text-align:left;padding:8px 12px 0}
  td.tick input{width:20px;height:20px}
  .cell{min-height:0;padding:3px 12px 9px}
  td.rowacts{width:auto;text-align:left;padding:2px 9px 8px}
  tr.adder input{padding:10px 12px}
}

/* --------------------------------------------------------------- tests -- */
.res{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0 4px;
  padding:11px 13px;background:var(--raised);border:1px solid var(--line);border-radius:8px}
.res .mark{padding:5px 13px;border-radius:5px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font:600 12px var(--sans);letter-spacing:.06em;cursor:pointer}
.res .mark:hover{color:var(--text)}
.res .mark.on[data-v=pass]{background:var(--pass);border-color:var(--pass);color:#10170C}
.res .mark.on[data-v=fail]{background:var(--fail);border-color:var(--fail);color:#1A0E0C}
.res .mark.on[data-v=skip]{background:var(--skip);border-color:var(--skip);color:#12150F}
.res input{flex:1;min-width:170px;padding:6px 10px;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:5px;font:13px var(--sans)}
.res input:focus{outline:none;border-color:var(--gold-dim)}
.res input.who{flex:0 0 118px;min-width:0}
.res .when{font-size:11px;color:var(--faint);white-space:nowrap}
@media(max-width:620px){
  .res .mark{flex:1 1 0;min-height:42px;padding:5px 6px;text-align:center}
  .res input,.res input.who{flex:1 1 100%;min-height:40px}
  .res .when{flex:1 1 100%}
}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font:600 11px var(--sans);
  letter-spacing:.05em}
.pill.pass{background:rgba(111,160,90,.18);color:var(--pass)}
.pill.fail{background:rgba(192,90,78,.18);color:var(--fail)}
.pill.skip{background:rgba(124,132,147,.18);color:var(--skip)}
.pill.left{background:rgba(141,150,130,.15);color:var(--dim)}
.tally{display:flex;gap:9px;margin-bottom:22px;flex-wrap:wrap}

/* ------------------------------------------------- files and downloads -- */
.file{display:flex;align-items:center;gap:15px;padding:15px 17px;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;margin-bottom:11px;flex-wrap:wrap}
.file .who{flex:1;min-width:180px}
.file .nm{font:600 16px var(--sans);color:var(--text);word-break:break-word}
.file .meta{font-size:13px;color:var(--dim);margin-top:3px}
.file a.get{padding:9px 17px;background:var(--gold);color:#17190F;border-radius:6px;
  text-decoration:none;font:600 14px var(--sans)}
.file a.get.ghost{background:none;color:var(--dim);border:1px solid var(--line)}
.file a.get.ghost:hover{color:var(--text);border-color:var(--gold-dim)}
.thumb{flex:0 0 auto;width:74px;height:60px;border-radius:7px;overflow:hidden;background:#0D100B;
  border:1px solid var(--line);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.kind{font:600 12px var(--mono);color:var(--dim);letter-spacing:.06em}
.empty{color:var(--dim);padding:26px;border:1px dashed var(--line);border-radius:9px;
  text-align:center}
.drop{border:1.5px dashed var(--line2);border-radius:11px;padding:26px 20px;text-align:center;
  background:var(--panel);margin-bottom:16px}
.drop.over{border-color:var(--gold);background:#1F2519}
.drop .big{font:600 18px var(--sans);margin-bottom:4px}
.drop .link{color:var(--gold);cursor:pointer;text-decoration:underline}
.who-row{display:flex;gap:9px;justify-content:center;margin-top:15px;flex-wrap:wrap}
.who-row input{flex:0 1 220px;padding:8px 11px;background:var(--ink);color:var(--text);
  border:1px solid var(--line);border-radius:6px;font:13.5px var(--sans)}
.who-row input:focus{outline:none;border-color:var(--gold-dim)}
#queue .row{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;
  background:var(--raised);border:1px solid var(--line);border-radius:7px;margin-bottom:6px;
  font-size:13px}

/* -------------------------------------------------------------- report -- */
.form{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:20px}
.form label{display:block;font:600 12px var(--sans);letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin:16px 0 6px}
.form label:first-of-type{margin-top:0}
.form input,.form textarea{width:100%;padding:10px 12px;background:var(--ink);color:var(--text);
  border:1px solid var(--line);border-radius:7px;font:15px var(--sans)}
.form textarea{min-height:170px;resize:vertical;line-height:1.6}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--gold-dim)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{flex:1 1 150px;padding:11px;background:var(--ink);color:var(--dim);
  border:1px solid var(--line);border-radius:8px;font:600 14px var(--sans);cursor:pointer}
.pick button.on{background:var(--raised);color:var(--text);border-color:var(--gold)}
.formfoot{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}

/* ---------------------------------------------------------------- news -- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:17px 19px;
  margin-bottom:12px}
.entry .when{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint)}
.entry h3{font:600 18px/1.3 var(--carve);letter-spacing:.02em;margin:4px 0 8px;color:var(--text);
  text-wrap:balance}
.entry .det{color:var(--dim);font-size:13.5px}
.entry .det span{display:inline-block;margin-right:14px}
.entry details{margin-top:9px}
.entry summary{cursor:pointer;color:var(--dim);font-size:13px}
.entry details ul{margin:8px 0 0;padding-left:20px;color:var(--faint);font:12.5px var(--mono)}


/* --------------------------------------------------------------- inbox -- */
.note{display:flex;gap:14px;align-items:flex-start;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:11px}
.note.done{opacity:.55}
.note .kind{flex:0 0 auto;font:600 10px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;margin-top:2px}
.note .kind.bug{background:rgba(192,90,78,.16);color:var(--fail)}
.note .kind.idea{background:rgba(201,162,75,.16);color:var(--gold)}
.note .mid{flex:1;min-width:0}
.note .t{font:600 16px var(--sans);word-break:break-word}
.note .d{color:var(--dim);font-size:13.5px;margin-top:4px;white-space:pre-wrap}
.note .m{color:var(--faint);font-size:12px;margin-top:7px}
.note .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
@media(max-width:560px){.note{flex-direction:column;gap:8px}}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <img src="/logo.png" alt="" width="82" height="82" style="display:block;margin:0 auto 14px;border-radius:14px">
    <h1>The Works</h1>
    <p>Discord decides who gets in here, the same as it decides who gets into
      the game. No second password to pass around.</p>
    <a class="discord big" id="gatediscord" href="/auth/discord">Sign in with Discord</a>
    <!--
      There is no password on this door any more. Discord roles decide who gets
      in here exactly as they decide who gets into the game, so a second secret
      that has to be passed around by hand is one more thing to leak.

      The box below exists only until Discord is configured, because otherwise
      the one person who could configure it cannot get in to do it.
    -->
    <div id="pwbox" hidden>
      <p class="said" style="margin:0 0 12px">Discord sign in is not set up on
        this server yet.</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="server password">
      <button class="enter" id="go">Enter</button>
    </div>
    <div class="err" id="err"></div>
    <p class="backhome"><a href="/">Back to thornswood.net</a></p>
  </div>
</div>

<div id="shell">
  <nav>
    <a class="brand" href="/hub"><img src="/logo.png" alt="" width="22" height="22">Thornswood</a>
    <a class="backout" href="/">&larr; the public site</a>
    <div id="tabs"></div>
    <div class="sep" id="whoami"></div>
  </nav>
  <main><div class="wrap" id="page"></div></main>
</div>

<script>
/*
  One page, real addresses. Every section is its own URL, so /downloads can be
  sent to somebody and it opens the downloads page, the back button works, and
  a link inside a document can point at /help rather than "third thing on the
  left". The server hands the same file to every address and this reads the
  address and draws that section.

  Two tiers. The password gets you in; Discord makes you an admin. The server
  decides which is which and simply does not send what you may not see, so the
  page only has to decide what to draw, never what to hide.
*/

/* ---------------------------------------------------------------- state -- */
var S = {
  me:{member:false,admin:false,name:''}, titles:{}, level:{},
  docs:{}, boards:{}, results:{}, files:[], uploads:[], inbox:[], linked:[],
  sessions:[],
  news:{news:[]}, invite:'', at:'home', editing:false, discord:false
};

var ROUTES = {
  '/hub':'home', '/hub/help':'help', '/news':'news', '/hub/known':'known', '/roadmap':'roadmap',
  '/suggestions':'suggestions', '/testthese':'tests',
  '/uploads':'uploads', '/link':'link', '/linked':'linked', '/sessions':'sessions',
  '/active':'active', '/patrick':'todo', '/archive':'archive', '/inbox':'inbox'
};
var PATHS = {};
Object.keys(ROUTES).forEach(function (u) { PATHS[ROUTES[u]] = u; });

var BOARDKEYS = ['active','known','roadmap','suggestions','archive','todo'];
var isBoard = function (k) { return BOARDKEYS.indexOf(k) >= 0; };

var ABOUT = {
  news:        'Every release, newest first. The same list the launcher shows.',
  tests:       'Numbered steps for the build that is out now. Mark each one and say what happened.',
  known:       'Broken on purpose, or a limit of how the server works. Check here before reporting.',
  roadmap:     'What is being worked on and roughly in what order.',
  suggestions: 'Mods and features people have asked for. Nothing here is committed.',
  uploads:     'Screenshots, crash logs, papyrus logs. Anything that helps somebody see what you saw.',
  help:        'Installing, joining, and the fixes for the usual problems.',
  active:      'Every open bug and where it stands.',
  archive:     'Fixed and confirmed, kept so the same wrong turn is not taken twice.',
  todo:        'Your own list, in the order it wants doing.',
  inbox:       'Bugs and ideas sent in from the public report page.',
  link:        'How getting in works, and what to do when the launcher says you are not linked.',
  linked:      'Everybody who has linked a Discord account to a copy of the game.',
  sessions:    'Every play session the launcher has reported, newest first. ' +
               'Write down what was tested in the note beside it.'
};

/*
  Only what is actually work. The news, the world, the rules, how to join and
  the report form all live on the public site, and a second copy of them behind
  a password is just somewhere for them to go stale.

  Known Issues, the Roadmap and Suggestions ARE public, but somebody has to be
  able to edit them, so they sit in a group that says exactly that.
*/
var GROUPS = [
  { label:'',            keys:['home'] },
  { label:'Work',        keys:['patrick','inbox','active','testthese'] },
  { label:'Files',       keys:['uploads'] },
  { label:'On the site', keys:['roadmap','known','suggestions','help'] },
  { label:'Records',     keys:['archive','linked','sessions'] }
];

var el = function (id) { return document.getElementById(id); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
};
function label(k) {
  if (k === 'home') return 'Home';
  if (k === 'uploads') return 'Uploads';
  if (k === 'report') return 'Report something';
  if (k === 'inbox') return 'Inbox';
  if (k === 'news') return 'News';
  if (k === 'link') return 'Getting in';
  if (k === 'linked') return 'Linked accounts';
  if (k === 'sessions') return 'Play sessions';
  return S.titles[k] || k;
}
function maySee(k) {
  if (k === 'home') return true;
  return S.level[k] === 'admin' ? S.me.admin : true;
}

function api(path, opts) {
  opts = opts || {};
  opts.credentials = 'same-origin';
  return fetch(path, opts);
}

function remember(k, v) {
  try {
    if (v === undefined) return localStorage.getItem('tw:' + k) || '';
    localStorage.setItem('tw:' + k, v);
  } catch (e) { return ''; }
  return v;
}

/* Markdown inside a table cell. Short things stay on one line; anything with a
   fenced block or a line break is a small document. */
function cellHtml(v) {
  var s = String(v == null ? '' : v);
  if (!s) return '';
  // breaks on, for cells only: somebody typing two lines into a box means two
  // lines, and asking them for a blank line between every one is a rule nobody
  // will remember.
  if (/```|\n/.test(s)) return '<div class="mdc">' + marked.parse(s, { breaks: true }) + '</div>';
  return '<div class="mdc">' + marked.parseInline(s) + '</div>';
}

/* ------------------------------------------------------------- sign in -- */
el('go').onclick = signIn;
el('pw').onkeydown = function (e) { if (e.key === 'Enter') signIn(); };


function signIn() {
  var pw = el('pw').value;
  el('err').textContent = '';
  api('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: pw })
  }).then(function (r) {
    if (!r.ok) { el('err').textContent = 'Not that one.'; return; }
    start();
  }).catch(function () { el('err').textContent = 'Could not reach the server.'; });
}

/* --------------------------------------------------------------- route -- */
function keyFor(pathname) {
  var clean = String(pathname || '/').replace(/\/+$/, '').toLowerCase() || '/';
  return ROUTES[clean] || 'home';
}

function go(key, push) {
  if (!maySee(key)) key = 'home';
  S.at = key;
  S.editing = false;
  if (push !== false && PATHS[key]) history.pushState({}, '', PATHS[key]);
  document.title = key === 'home' ? 'Thornswood' : label(key) + ' · Thornswood';
  draw();
  var m = document.querySelector('main');
  if (m) m.scrollTop = 0;
}

window.onpopstate = function () { go(keyFor(location.pathname), false); };

document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('a') : null;
  if (!a || a.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey) return;
  var href = a.getAttribute('href') || '';
  if (!/^\//.test(href) || /^\/(file|up|api|auth)\//.test(href)) return;
  var clean = href.split('?')[0].replace(/\/+$/, '').toLowerCase() || '/';
  if (!ROUTES[clean]) return;
  e.preventDefault();
  go(ROUTES[clean]);
});

/* ---------------------------------------------------------------- boot -- */
function start() {
  api('/api/all').then(function (r) {
    if (!r.ok) throw 0;
    return r.json();
  }).then(function (d) {
    S.me = d.me || S.me;
    S.titles = d.titles; S.level = d.level || {};
    S.docs = d.docs || {}; S.boards = d.boards || {};
    S.results = d.results || {}; S.files = d.files || [];
    S.uploads = d.uploads || []; S.inbox = d.inbox || [];
    S.linked = d.linked || []; S.invite = d.invite || '';
    S.sessions = d.sessions || [];
    S.news = d.news || { news: [] };
    el('gate').style.display = 'none';
    el('shell').style.display = 'grid';
    chrome();
    go(keyFor(location.pathname), false);
  }).catch(function () { el('gate').style.display = 'grid'; });
}

function refresh() {
  return api('/api/all').then(function (r) { return r.json(); }).then(function (d) {
    S.docs = d.docs || {}; S.boards = d.boards || {};
    S.results = d.results || {}; S.files = d.files || [];
    S.uploads = d.uploads || []; S.inbox = d.inbox || [];
    S.linked = d.linked || []; S.sessions = d.sessions || [];
  }).catch(function () { });
}

function chrome() {
  var out = '';
  GROUPS.forEach(function (g) {
    var keys = g.keys.map(function (u) { return ROUTES['/' + u] || u; })
                     .filter(function (k) { return maySee(k); });
    if (!keys.length) return;
    if (g.label) out += '<div class="group">' + esc(g.label) + '</div>';
    keys.forEach(function (k) {
      out += '<a class="tab" data-k="' + k + '" href="' + PATHS[k] + '">' + esc(label(k)) +
             (S.level[k] === 'admin' ? '<span class="key">admin</span>' : '') + '</a>';
    });
  });
  el('tabs').innerHTML = out;

  el('whoami').innerHTML = S.me.admin
    ? '<div class="me">Signed in as <b>' + esc(S.me.name || 'admin') + '</b><br>admin</div>' +
      '<button class="out" id="out">sign out</button>'
    : '<a class="discord ghost" href="/auth/discord?back=' +
      encodeURIComponent(location.pathname) + '">Sign in with Discord</a>' +
      '<button class="out" id="out">sign out</button>';
  if (S.invite) {
    el('whoami').insertAdjacentHTML('afterbegin',
      '<a class="discord" href="' + esc(S.invite) + '" target="_blank" ' +
      'style="font-size:13px;padding:7px 12px">Thornswood Discord</a>');
  }
  el('out').onclick = function () {
    api('/api/logout', { method:'POST' }).then(function () { location.href = '/'; });
  };
}

/* ------------------------------------------------------------ getting in -- */
/* These two lived inside the <style> block, which meant the browser read them
   as broken CSS and threw them away. drawLink and drawLinked did not exist at
   all, so clicking either tab left whatever was already on the screen there. */
function drawLink() {
  el('page').innerHTML = head() +
    '<div class="doc">' + marked.parse(
      'Getting into Thornswood goes through Discord. Not for the sake of ' +
      'another login: it means one list decides who is allowed in, and that ' +
      'list is the Discord server everybody is already in.\n\n' +
      '## How it works\n\n' +
      '1. Open the launcher and press **Connect Discord** on the main page.\n' +
      '2. Your browser opens, you say yes, and it closes itself.\n' +
      '3. The launcher remembers. You do not do this again.\n\n' +
      'From then on every time you press Play, the launcher checks with the ' +
      'site that your Discord account is still in the server and still allowed ' +
      'in, and only then gets what it needs to connect you.\n\n' +
      '## What that means\n\n' +
      '- The server password is not written down anywhere on your machine any ' +
      'more. Nobody can pass it on, because nobody has it.\n' +
      '- Leaving the Discord, or being banned in it, stops the next launch. ' +
      'There is no second list to remember to update.\n' +
      '- A ban is a ban everywhere at once: the game, this site, and the chat.\n\n' +
      '## If the launcher says you are not linked\n\n' +
      'Press Connect Discord again. If it says you are not in the Discord, ' +
      (S.invite ? '[join it](' + S.invite + ') and try again.'
                : 'ask somebody for an invite and try again.') + '\n\n' +
      'If it says you have no role yet, say so in the Discord and somebody ' +
      'will sort it. It takes a moment.\n\n' +
      'If it says you are banned, you know why.'
    ) + '</div>' +
    (S.invite ? '<div style="margin-top:22px"><a class="discord" href="' +
      esc(S.invite) + '" target="_blank">Open the Thornswood Discord</a></div>' : '');
  dressCode();
}

/* ------------------------------------------------------ linked accounts -- */
function drawLinked() {
  var list = S.linked.slice().sort(function (a, b) { return (b.seen || 0) - (a.seen || 0); });
  var out = head();
  if (!list.length) {
    out += '<div class="empty">Nobody has linked a Discord account yet.</div>';
  } else {
    out += '<div class="tablewrap"><table class="board"><thead><tr>' +
      '<th>Name</th><th>Discord id</th><th>Roles</th><th>First linked</th>' +
      '<th>Last played</th></tr></thead><tbody>';
    list.forEach(function (u) {
      out += '<tr>' +
        '<td data-label="Name"><div class="cell">' + esc(u.name || u.handle || '') + '</div></td>' +
        '<td data-label="Discord id"><div class="cell"><code>' + esc(u.id) + '</code></div></td>' +
        '<td data-label="Roles"><div class="cell">' + esc((u.roles || []).join(', ')) + '</div></td>' +
        '<td data-label="First linked"><div class="cell">' +
          (u.first ? new Date(u.first).toLocaleDateString() : '') + '</div></td>' +
        '<td data-label="Last played"><div class="cell">' +
          (u.played ? new Date(u.played).toLocaleString() : 'never') + '</div></td>' +
      '</tr>';
    });
    out += '</tbody></table></div>';
  }
  out += '<p class="lede" style="margin-top:20px">Banning somebody is a Discord ' +
    'job, not a job here. Give them the <b>Banned</b> role, or remove them from ' +
    'the server, and the next time they press Play they are turned away. Nothing ' +
    'on this page needs touching.</p>';
  el('page').innerHTML = out;
}

/* ------------------------------------------------------- play sessions -- */
/*
  One row a session, as the launcher reported it: a start when the game was
  started and an end when it closed. A row with no end is somebody still
  playing, or a machine that never got the end out. That is open, not broken,
  and the page says so in those words.

  The note is the sheet part. A staff member types what was tested against the
  session it happened in, and it saves on its own.
*/
function forMins(m) {
  var n = Number(m) || 0;
  if (n < 1) return 'under a minute';
  if (n < 60) return Math.round(n) + ' min';
  var h = n / 60;
  return (h < 10 ? h.toFixed(1) : String(Math.round(h))) + ' hours';
}
function sessionAt(s) { return s.start || s.end || 0; }
/* No end means the game has not closed, or the closing word never reached the
   site. Either way the session is open and the page says open. */
function sessionOpen(s) { return !s.end; }

/*
  The week's totals, counting only the sessions that reported an end.

  A row with no end carries no minutes, so counting it raised the session and
  the people counts while the hours stayed where they were, and the three
  numbers on one screen disagreed with each other. Open rows are counted on
  their own and said separately, which is the honest shape: this is what was
  played, and this many rows never reported an end.
*/
function sessionTotals(list) {
  var week = Date.now() - 7 * 86400000;
  var n = 0, mins = 0, open = 0, who = {};
  list.forEach(function (s) {
    if (sessionAt(s) < week) return;
    if (sessionOpen(s)) { open++; return; }
    n++;
    mins += Number(s.minutes) || 0;
    if (s.who) who[s.who] = true;
  });
  return { n:n, mins:mins, open:open, people:Object.keys(who).length };
}

function saveNote(box) {
  saidNow('saving');
  api('/api/session-note', {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ session: box.dataset.s, who: box.dataset.w, note: box.value })
  }).then(function (r) {
    saidNow(r.ok ? 'saved' : 'did not save');
    if (!r.ok) return;
    S.sessions.forEach(function (s) {
      if (s.session === box.dataset.s && String(s.who) === String(box.dataset.w)) s.note = box.value;
    });
  }).catch(function () { saidNow('did not save'); });
}

function drawSessions() {
  var list = S.sessions.slice().sort(function (a, b) { return sessionAt(b) - sessionAt(a); });
  var t = sessionTotals(list);
  var out = head() +
    '<div class="tally">' +
      '<span class="pill pass">' + t.n + (t.n === 1 ? ' session' : ' sessions') +
        ' in the last seven days</span>' +
      '<span class="pill skip">' + (t.mins < 1 ? 'no time yet' : esc(forMins(t.mins)) + ' of it') + '</span>' +
      (t.open ? '<span class="pill left">' + t.open + ' with no end reported</span>' : '') +
      '<span class="pill left">' + t.people + (t.people === 1 ? ' person' : ' people') + '</span>' +
    '</div>';

  if (!list.length) {
    out += '<div class="empty">Nobody has played yet. A row lands here the ' +
      'moment somebody presses Play, and fills in when they stop.</div>';
  } else {
    out += '<div class="tablewrap"><table class="board"><thead><tr>' +
      '<th>Who</th><th>Character</th><th>Build</th><th>Started</th>' +
      '<th>Stopped</th><th>For</th><th>Note</th></tr></thead><tbody>';
    list.forEach(function (s) {
      var open = sessionOpen(s);
      out += '<tr>' +
        '<td data-label="Who"><div class="cell">' + esc(s.name || s.who || '') +
          (s.channel === 'dev' ? ' <span class="pill left">dev</span>' : '') + '</div></td>' +
        '<td data-label="Character"><div class="cell">' +
          (s.profile ? '<code>' + esc(s.profile) + '</code>' : 'none picked') + '</div></td>' +
        '<td data-label="Build"><div class="cell">' + esc(s.version || 'not said') + '</div></td>' +
        '<td data-label="Started"><div class="cell">' +
          (s.start
            ? esc(new Date(s.start).toLocaleString())
            : '<span class="pill left">start never seen</span>' +
              '<div class="said">the launcher was replaced or restarted while ' +
              'they were playing, so only the end reached us</div>') + '</div></td>' +
        '<td data-label="Stopped"><div class="cell">' +
          (open
            ? '<span class="pill left">no end reported</span>'
            : esc(new Date(s.end).toLocaleString()) +
              (s.why === 'update' ? '<div class="said">closed for an update</div>' : '')) +
          '</div></td>' +
        '<td data-label="For"><div class="cell">' +
          (open ? 'open' : esc(forMins(s.minutes))) + '</div></td>' +
        '<td data-label="Note"><textarea data-s="' + esc(s.session) + '" data-w="' + esc(s.who) +
          '" placeholder="what they tested, what broke">' + esc(s.note || '') + '</textarea>' +
          (s.noteBy ? '<div class="said" style="padding:0 2px 7px">written by ' +
            esc(s.noteBy) + '</div>' : '') +
        '</td>' +
      '</tr>';
    });
    out += '</tbody></table></div>';
  }

  out += '<p class="lede" style="margin-top:20px">The launcher sends both ends ' +
    'of every session, so a row appears as somebody starts and fills in when ' +
    'they stop. One still open is somebody playing right now, or a machine ' +
    'that never got the closing word out. Nothing here is typed by the person ' +
    'playing.</p>';
  el('page').innerHTML = out;

  each(el('page'), 'textarea[data-s]', function (box) {
    box.onchange = function () { saveNote(box); };
  });
}

/* ---------------------------------------------------------------- draw -- */
function draw() {
  Array.prototype.forEach.call(el('tabs').querySelectorAll('a.tab'), function (a) {
    a.className = 'tab' + (a.dataset.k === S.at ? ' on' : '');
  });
  document.body.className = isBoard(S.at) ? 'wide' : '';
  if (S.at === 'home')    return drawHome();
  if (S.at === 'news')    return drawNews();
  if (S.at === 'uploads') return drawUploads();
  if (S.at === 'report')  return drawReport();
  if (S.at === 'inbox')   return drawInbox();
  if (S.at === 'link')    return drawLink();
  if (S.at === 'linked')  return drawLinked();
  if (S.at === 'sessions') return drawSessions();
  if (isBoard(S.at))      return drawBoard();
  if (S.editing)          return drawEdit();

}

/* ---------------------------------------------------------------- home -- */
function tallyOf() {
  var n = { pass:0, fail:0, skip:0 };
  Object.keys(S.results).forEach(function (k) {
    var s = (S.results[k] || {}).status;
    if (n[s] !== undefined) n[s]++;
  });
  return n;
}
function rowCount(k) {
  var b = S.boards[k];
  if (!b) return 0;
  var n = 0;
  (b.sections || []).forEach(function (s) { n += (s.rows || []).length; });
  return n;
}
function countFor(k) {
  if (k === 'tests') {
    var t = tallyOf(), done = t.pass + t.fail + t.skip;
    var total = (S.docs.tests || '').split('\n')
      .filter(function (l) { return /^##\s+test\b/i.test(l); }).length;
    return total ? done + ' of ' + total + ' marked' : 'nothing to test yet';
  }
  if (k === 'uploads') return S.uploads.length ? S.uploads.length + ' files' : 'nothing yet';
  if (k === 'news')    return (S.news.news || []).length + ' releases';
  if (k === 'report')  return 'takes a minute';
  if (k === 'help')    return 'read me first';
  if (k === 'inbox') {
    var open = S.inbox.filter(function (i) { return i.state === 'new'; }).length;
    return open ? open + ' waiting' : 'nothing waiting';
  }
  if (k === 'link')   return 'Discord decides';
  if (k === 'linked') return S.linked.length + ' linked';
  if (k === 'sessions') {
    var w = sessionTotals(S.sessions);
    return w.n ? w.n + ' in the last seven days' : 'nobody yet';
  }
  var n = rowCount(k);
  return n === 1 ? '1 entry' : n + ' entries';
}
function card(k, lead) {

    '<div class="t">' + esc(label(k)) +

/* --------------------------------------------------------------- board -- */
/*
  A board is sections, each section a table with its own columns. That is the
  shape the notes were already in, and it means a column added to Open does not
  appear on Shipped where it would be empty.

  Editing is a click on the cell. No edit mode, no form, no save button: the
  cell becomes a box, Enter puts it back, and the board is saved half a second
  later. Adding is a row that is always sitting at the bottom waiting to be
  typed in, so putting something down is one click and one Enter.
*/
var pending = {};
function saveBoard(k) {
  saidNow('saving');
  clearTimeout(pending[k]);
  pending[k] = setTimeout(function () {
    api('/api/board/' + k, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(S.boards[k])
    }).then(function (r) {
      if (r.ok) { saidNow('saved'); return; }
      // "did not save" on its own sends somebody looking in the wrong place.
      // Say which of the three it was.
      r.json().then(function (j) {
        saidNow(r.status === 401 ? 'not saved: signed out, reload the page'
              : r.status === 403 ? 'not saved: you are not an admin here'
              : 'not saved: ' + (j && j.error ? j.error : r.status));
      }).catch(function () { saidNow('not saved: ' + r.status); });
    }).catch(function () { saidNow('not saved: could not reach the server'); });
  }, 500);
}

var newId = function (p) {
  return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
};
var sectionOf = function (k, sid) {
  return (S.boards[k].sections || []).filter(function (s) { return s.id === sid; })[0];
};
var rowOf = function (sec, rid) {
  return (sec.rows || []).filter(function (r) { return r.id === rid; })[0];
};

function drawBoard() {
  var k = S.at, admin = S.me.admin;
  var b = S.boards[k] || { intro:'', sections:[] };
  S.boards[k] = b;
  b.sections = b.sections || [];

  var out = head(admin
    ? '<button class="btn small" id="addsec">Add section</button>' +
      (k !== 'archive' ? '<button class="btn small" id="archall">Archive everything ticked</button>' : '')
    : '', !!b.intro);

  if (b.intro) out += '<div class="doc" style="margin:-10px 0 4px">' + marked.parse(b.intro) + '</div>';

  if (!b.sections.length) {
    out += '<div class="empty">Nothing here yet.' +
      (admin ? ' Add a section to start.' : '') + '</div>';
  }

  b.sections.forEach(function (sec) {
    var cols = sec.columns || (sec.columns = []);
    var rows = sec.rows || (sec.rows = []);
    out += '<div class="sec" data-s="' + sec.id + '">' +
      '<div class="sechead">' +
        '<h3' + (admin ? ' contenteditable="plaintext-only" data-secname="1"' : '') + '>' +
          esc(sec.name || 'Untitled') + '</h3>' +
        '<span class="count">' + rows.length + '</span>' +
        (admin ? '<div class="acts">' +
          '<button class="btn small" data-addcol="' + sec.id + '">Add column</button>' +
          '<button class="btn small" data-delsec="' + sec.id + '">Remove section</button>' +
        '</div>' : '') +
      '</div>';
    if (sec.note) out += '<p class="secnote">' + esc(sec.note) + '</p>';

    out += '<div class="tablewrap' + (admin ? '' : ' ro') + '"><table class="board"><thead><tr>' +
      '<th class="tick"></th>';
    cols.forEach(function (c) {
      out += '<th data-c="' + c.id + '"><span class="nm"' +
        (admin ? ' contenteditable="plaintext-only" data-colname="' + sec.id + '|' + c.id + '"' : '') +
        '>' + esc(c.name) + '</span>' +
        (admin && cols.length > 1 ? '<button class="x" data-delcol="' + sec.id + '|' + c.id +
          '" title="Remove this column">&times;</button>' : '') + '</th>';
    });
    if (admin) out += '<th class="rowacts"></th>';
    out += '</tr></thead><tbody>';

    rows.forEach(function (r) {
      out += '<tr data-r="' + r.id + '" class="' + (r.done ? 'done' : '') + '">' +
        '<td class="tick"><input type="checkbox"' + (r.done ? ' checked' : '') +
          (admin ? '' : ' disabled') + ' data-tick="' + sec.id + '|' + r.id + '"></td>';
      cols.forEach(function (c) {
        out += '<td data-label="' + esc(c.name) + '" data-cell="' + sec.id + '|' + r.id + '|' + c.id + '">' +
          '<div class="cell">' + cellHtml(r.cells ? r.cells[c.id] : '') + '</div></td>';
      });
      if (admin) {
        out += '<td class="rowacts">' +
          (k !== 'archive'
            ? '<button data-arch="' + sec.id + '|' + r.id + '" title="Move to the archive">Archive</button>'
            : '') +
          '<button class="del" data-delrow="' + sec.id + '|' + r.id + '" title="Delete">&times;</button>' +
        '</td>';
      }
      out += '</tr>';
    });

    if (admin) {
      out += '<tr class="adder"><td class="tick"><span class="plus">+</span></td>' +
        '<td colspan="' + (cols.length + 1) + '">' +
        '<input placeholder="Add to ' + esc(sec.name || 'this') + ', then Enter" ' +
        'data-add="' + sec.id + '"></td></tr>';
    }
    out += '</tbody></table></div></div>';
  });

  el('page').innerHTML = out;
  wireBoard(k);
}

function wireBoard(k) {
  var page = el('page'), admin = S.me.admin;
  var b = S.boards[k];

  if (!admin) { dressCode(); return; }

  var add = el('addsec');
  if (add) add.onclick = function () {
    b.sections.push({ id:newId('s'), name:'New section', note:'',
      columns:[{id:newId('c'),name:'Item'},{id:newId('c'),name:'Notes'}], rows:[] });
    saveBoard(k); draw();
  };
  var archall = el('archall');
  if (archall) archall.onclick = function () {
    var n = 0;
    b.sections.forEach(function (sec) {
      (sec.rows || []).slice().forEach(function (r) {
        if (r.done) { moveToArchive(k, sec, r, true); n++; }
      });
    });
    if (!n) { saidNow('nothing is ticked'); return; }
    saveBoard(k); saveBoard('archive'); draw();
  };

  each(page, '[data-secname]', function (h) {
    h.onblur = function () {
      var sec = sectionOf(k, h.closest('.sec').dataset.s);
      if (!sec) return;
      var v = h.textContent.trim();
      if (v !== sec.name) { sec.name = v; saveBoard(k); }
    };
    h.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); h.blur(); } };
  });

  each(page, '[data-colname]', function (sp) {
    sp.onblur = function () {
      var parts = sp.dataset.colname.split('|');
      var sec = sectionOf(k, parts[0]); if (!sec) return;
      var col = sec.columns.filter(function (c) { return c.id === parts[1]; })[0];
      if (col && col.name !== sp.textContent.trim()) { col.name = sp.textContent.trim(); saveBoard(k); }
    };
    sp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); sp.blur(); } };
  });

  each(page, '[data-addcol]', function (btn) {
    btn.onclick = function () {
      var sec = sectionOf(k, btn.dataset.addcol); if (!sec) return;
      sec.columns.push({ id:newId('c'), name:'New column' });
      saveBoard(k); draw();
      var last = page.querySelector('.sec[data-s="' + sec.id + '"] th:nth-last-child(2) .nm');
      if (last) { last.focus(); document.execCommand && document.execCommand('selectAll', false, null); }
    };
  });

  each(page, '[data-delcol]', function (btn) {
    btn.onclick = function () {
      var parts = btn.dataset.delcol.split('|');
      var sec = sectionOf(k, parts[0]); if (!sec) return;
      var col = sec.columns.filter(function (c) { return c.id === parts[1]; })[0];
      if (!confirm('Remove the column "' + (col ? col.name : '') + '" and everything in it?')) return;
      sec.columns = sec.columns.filter(function (c) { return c.id !== parts[1]; });
      sec.rows.forEach(function (r) { if (r.cells) delete r.cells[parts[1]]; });
      saveBoard(k); draw();
    };
  });

  each(page, '[data-delsec]', function (btn) {
    btn.onclick = function () {
      var sec = sectionOf(k, btn.dataset.delsec); if (!sec) return;
      if (!confirm('Remove "' + sec.name + '" and its ' + sec.rows.length + ' rows?')) return;
      b.sections = b.sections.filter(function (s) { return s.id !== sec.id; });
      saveBoard(k); draw();
    };
  });

  each(page, '[data-tick]', function (box) {
    box.onchange = function () {
      var parts = box.dataset.tick.split('|');
      var sec = sectionOf(k, parts[0]); if (!sec) return;
      var r = rowOf(sec, parts[1]); if (!r) return;
      r.done = box.checked;
      r.at = Date.now();
      box.closest('tr').className = r.done ? 'done' : '';
      saveBoard(k);
    };
  });

  each(page, '[data-arch]', function (btn) {
    btn.onclick = function () {
      var parts = btn.dataset.arch.split('|');
      var sec = sectionOf(k, parts[0]); if (!sec) return;
      var r = rowOf(sec, parts[1]); if (!r) return;
      moveToArchive(k, sec, r, true);
      saveBoard(k); saveBoard('archive'); draw();
    };
  });

  each(page, '[data-delrow]', function (btn) {
    btn.onclick = function () {
      var parts = btn.dataset.delrow.split('|');
      var sec = sectionOf(k, parts[0]); if (!sec) return;
      if (!confirm('Delete this row? Archive keeps it, this does not.')) return;
      sec.rows = sec.rows.filter(function (r) { return r.id !== parts[1]; });
      saveBoard(k); draw();
    };
  });

  each(page, '[data-add]', function (inp) {
    inp.onkeydown = function (e) {
      if (e.key !== 'Enter') return;
      var v = inp.value.trim();
      if (!v) return;
      var sec = sectionOf(k, inp.dataset.add); if (!sec) return;
      var cells = {};
      cells[sec.columns[0].id] = v;
      sec.rows.push({ id:newId('r'), done:false, at:Date.now(), by:S.me.name, cells:cells });
      saveBoard(k);
      inp.value = '';
      var keep = sec.id;
      draw();
      var again = el('page').querySelector('[data-add="' + keep + '"]');
      if (again) again.focus();
    };
  });

  each(page, '[data-cell] .cell', function (div) {
    div.onclick = function () { openCell(k, div.parentNode); };
  });

  dressCode();
}

function each(root, sel, fn) {
  Array.prototype.forEach.call(root.querySelectorAll(sel), fn);
}

/* A cell becomes a box, and putting it back saves it. Enter commits because
   most of these are one line; shift and Enter when a line break is wanted. */
function openCell(k, td) {
  if (td.querySelector('textarea')) return;
  var parts = td.dataset.cell.split('|');
  var sec = sectionOf(k, parts[0]); if (!sec) return;
  var row = rowOf(sec, parts[1]); if (!row) return;
  row.cells = row.cells || {};
  var was = row.cells[parts[2]] || '';

  var ta = document.createElement('textarea');
  ta.value = was;
  td.innerHTML = '';
  td.appendChild(ta);
  var grow = function () { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; };
  grow();
  ta.oninput = grow;
  ta.focus();
  ta.setSelectionRange(was.length, was.length);

  var close = function (commit) {
    var v = commit ? ta.value : was;
    row.cells[parts[2]] = v;
    td.innerHTML = '<div class="cell">' + cellHtml(v) + '</div>';
    td.querySelector('.cell').onclick = function () { openCell(k, td); };
    dressCode();
    if (commit && v !== was) { row.at = Date.now(); saveBoard(k); }
  };
  ta.onblur = function () { close(true); };
  ta.onkeydown = function (e) {
    if (e.key === 'Escape') { e.preventDefault(); ta.onblur = null; close(false); }
    else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); }
    else if (e.key === 'Tab') {
      e.preventDefault();
      var tds = Array.prototype.slice.call(el('page').querySelectorAll('[data-cell]'));
      var i = tds.indexOf(td);
      ta.blur();
      var nxt = tds[i + (e.shiftKey ? -1 : 1)];
      if (nxt) openCell(k, nxt);
    }
  };
}

function moveToArchive(from, sec, row, tick) {
  var arch = S.boards.archive;
  if (!arch) return;
  arch.sections = arch.sections || [];
  var name = label(from) + ' · ' + (sec.name || '');
  var tgt = arch.sections.filter(function (s) { return s.name === name; })[0];
  if (!tgt) {
    tgt = { id:newId('s'), name:name, note:'',
            columns:[{ id:newId('c'), name:'When' }], rows:[] };
    arch.sections.unshift(tgt);
  }
  var cells = {};
  cells[tgt.columns[0].id] = new Date().toLocaleDateString();
  (sec.columns || []).forEach(function (c) {
    var m = tgt.columns.filter(function (x) { return x.name === c.name; })[0];
    if (!m) { m = { id:newId('c'), name:c.name }; tgt.columns.push(m); }
    cells[m.id] = (row.cells || {})[c.id] || '';
  });
  tgt.rows.unshift({ id:newId('r'), done:false, at:Date.now(), by:S.me.name, cells:cells });
  sec.rows = sec.rows.filter(function (r) { return r.id !== row.id; });
}

/* ------------------------------------------------------------ document -- */
function drawDoc() {
  var md = S.docs[S.at] || '';
  el('page').innerHTML = head(S.me.admin ? '<button class="btn" id="edit">Edit</button>' : '') +
    (S.at === 'tests' ? '<div class="tally" id="tally"></div>' : '') +
    '<div class="doc" id="body">' + marked.parse(md) + '</div>';
  var e = el('edit');
  if (e) e.onclick = function () { S.editing = true; draw(); };
  dressCode();
  if (S.at === 'tests') { dressTests(); tally(); }
}

function drawEdit() {
  el('page').innerHTML = head(
      '<button class="btn" id="cancel">Cancel</button>' +
      '<button class="btn key" id="save">Save</button>') +
    '<textarea class="md" id="ta"></textarea>' +
    '<p class="said" style="margin-top:12px">Markdown. Three backticks make a ' +
    'command block with a copy button. A heading that starts with the word ' +
    'Test gets the pass, fail and skip buttons under it.</p>';
  el('ta').value = S.docs[S.at] || '';
  el('cancel').onclick = function () { S.editing = false; draw(); };
  el('save').onclick = function () {
    var text = el('ta').value;
    saidNow('saving');
    api('/api/doc/' + S.at, { method:'PUT', body:text }).then(function (r) {
      if (!r.ok) throw 0;
      S.docs[S.at] = text; S.editing = false; draw(); saidNow('saved');
    }).catch(function () { saidNow('did not save'); });
  };
}

function dressCode() {
  each(el('page'), 'pre', function (pre) {
    if (pre.parentNode.classList.contains('cmd')) return;
    var box = document.createElement('div');
    box.className = 'cmd';
    pre.parentNode.insertBefore(box, pre);
    box.appendChild(pre);
    var b = document.createElement('button');
    b.className = 'copy'; b.textContent = 'copy';
    b.onclick = function (e) {
      e.stopPropagation();
      navigator.clipboard.writeText(pre.innerText).then(function () {
        b.textContent = 'copied'; b.classList.add('done');
        setTimeout(function () { b.textContent = 'copy'; b.classList.remove('done'); }, 1400);
      });
    };
    box.appendChild(b);
  });
}

/* --------------------------------------------------------------- tests -- */
function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function dressTests() {
  each(el('body'), 'h2', function (h) {
    if (!/^test\b/i.test(h.textContent.trim())) return;
    var id = slug(h.textContent);
    var r = S.results[id] || {};
    var bar = document.createElement('div');
    bar.className = 'res';
    bar.innerHTML =
      ['pass','fail','skip'].map(function (v) {
        return '<button class="mark' + (r.status === v ? ' on' : '') +
               '" data-v="' + v + '">' + v.toUpperCase() + '</button>';
      }).join('') +
      '<input class="note" placeholder="what happened" value="' + esc(r.notes || '') + '">' +
      '<input class="who" placeholder="you" value="' + esc(r.by || remember('who')) + '">' +
      '<span class="when">' + (r.at ? new Date(r.at).toLocaleDateString() : '') + '</span>';
    h.parentNode.insertBefore(bar, h.nextSibling);

    var note = bar.querySelector('.note'), whoIn = bar.querySelector('.who');
    each(bar, '.mark', function (b) {
      b.onclick = function () {
        var cur = S.results[id] || {};
        cur.status = (cur.status === b.dataset.v) ? '' : b.dataset.v;
        cur.by = whoIn.value || cur.by || remember('who');
        cur.notes = note.value;
        if (whoIn.value) remember('who', whoIn.value);
        saveResult(id, cur, bar);
      };
    });
    var push = function () {
      var cur = S.results[id] || {};
      cur.notes = note.value; cur.by = whoIn.value;
      if (whoIn.value) remember('who', whoIn.value);
      saveResult(id, cur, bar);
    };
    note.onchange = push; whoIn.onchange = push;
  });
}

function saveResult(id, rec, bar) {
  rec.at = Date.now();
  S.results[id] = rec;
  api('/api/results', {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(S.results)
  }).then(function () {
    if (bar) {
      each(bar, '.mark', function (b) {
        b.className = 'mark' + (rec.status === b.dataset.v ? ' on' : '');
      });
      bar.querySelector('.when').textContent = new Date(rec.at).toLocaleDateString();
    }
    tally();
  });
}

function tally() {
  var box = el('tally');
  if (!box) return;
  var n = tallyOf();
  box.innerHTML =
    '<span class="pill pass">' + n.pass + ' passed</span>' +
    '<span class="pill fail">' + n.fail + ' failed</span>' +
    '<span class="pill skip">' + n.skip + ' skipped</span>';
}

/* ---------------------------------------------------------------- news -- */
function drawNews() {
  var list = S.news.news || [];
  var out = head();
  if (!list.length) {
    out += '<div class="empty">No releases recorded yet.</div>';
  }
  list.forEach(function (n) {
    out += '<div class="entry">' +
      '<div class="when">' + esc(n.date || '') + '</div>' +
      '<h3>' + esc(n.title || '') + '</h3>' +
      (n.body ? '<p class="det">' + esc(n.body) + '</p>' : '') +
      ((n.details && n.details.length)
        ? '<div class="det">' + n.details.map(function (d) {
            return '<span>' + esc(d) + '</span>'; }).join('') + '</div>'
        : '') +
      ((n.files && n.files.length)
        ? '<details><summary>' + n.files.length + ' files</summary><ul>' +
          n.files.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') +
          '</ul></details>'
        : '') +
    '</div>';
  });
  el('page').innerHTML = out;
}

/* ----------------------------------------------------------- downloads -- */
function size(b) {
  if (b > 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
  if (b > 1048576) return (b / 1048576).toFixed(0) + ' MB';
  if (b > 1024) return (b / 1024).toFixed(0) + ' KB';
  return b + ' B';
}

/*
  The downloads page used to live here too, behind the sign in, which was
  backwards: the installer is the one thing on this site that has to be
  reachable by somebody who has never been here before. It is /downloads on the
  public front now. Nothing in the panel links to it, and nothing here draws it.
*/

/* ------------------------------------------------------------- uploads -- */
/*
  Sent raw with the name in the address rather than as a form, because a form
  means writing a multipart parser and this needs no dependencies.
*/
function drawUploads() {
  var out = head() +
    '<div class="drop" id="drop">' +
      '<div class="big">Drop files here</div>' +
      '<div class="said">or <span class="link" id="pick">choose them</span>. ' +
      'Up to 200 MB each.</div>' +
      '<input type="file" id="fileinput" multiple hidden>' +
      '<div class="who-row">' +
        '<input id="upwho" placeholder="your name" value="' + esc(remember('who')) + '">' +
        '<input id="upnote" placeholder="what is it (optional)">' +
      '</div>' +
    '</div><div id="queue"></div>';

  if (!S.uploads.length) {
    out += '<div class="empty">Nothing uploaded yet.</div>';
  } else {
    out += '<div class="section-label">' + S.uploads.length + ' file' +
           (S.uploads.length === 1 ? '' : 's') + '</div>';
    S.uploads.forEach(function (u) {
      var href = '/up/' + encodeURIComponent(u.name);
      out += '<div class="file">' +
        (u.image
          ? '<a class="thumb" href="' + href + '" target="_blank"><img src="' + href +
            '" alt="" loading="lazy"></a>'
          : '<div class="thumb kind">' +
            esc((u.orig.split('.').pop() || '?').slice(0, 4).toUpperCase()) + '</div>') +
        '<div class="who"><div class="nm">' + esc(u.orig) + '</div>' +
        '<div class="meta">' + (u.by ? esc(u.by) + '  &middot;  ' : '') + size(u.size) +
          '  &middot;  ' + new Date(u.at).toLocaleString() +
          (u.note ? '<br>' + esc(u.note) : '') + '</div></div>' +
        '<a class="get ghost" href="' + href + '" target="_blank">Open</a>' +
        '<a class="get" href="' + href + '?dl=1">Download</a>' +
        (S.me.admin ? '<button class="btn" data-drop="' + esc(u.name) + '">Remove</button>' : '') +
      '</div>';
    });
  }
  el('page').innerHTML = out;

  var input = el('fileinput'), drop = el('drop');
  el('pick').onclick = function () { input.click(); };
  input.onchange = function () { sendAll(input.files); input.value = ''; };
  ['dragenter','dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files) sendAll(e.dataTransfer.files);
  });
  each(el('page'), '[data-drop]', function (b) {
    b.onclick = function () {
      if (!confirm('Remove ' + b.dataset.drop + ' for good?')) return;
      b.disabled = true; b.textContent = 'removing';
      api('/api/upload/' + encodeURIComponent(b.dataset.drop), { method:'DELETE' })
        .then(refresh).then(draw);
    };
  });
}

function sendAll(list) {
  var files = Array.prototype.slice.call(list || []);
  if (!files.length) return;
  var whoName = (el('upwho') || {}).value || '';
  var note = (el('upnote') || {}).value || '';
  if (whoName) remember('who', whoName);

  el('queue').innerHTML = files.map(function (f, i) {
    return '<div class="row"><span>' + esc(f.name) + '</span>' +
           '<span class="said" id="qs' + i + '">waiting</span></div>';
  }).join('');

  var next = function (i) {
    if (i >= files.length) return refresh().then(draw);
    var f = files[i], tag = el('qs' + i);
    tag.textContent = 'sending ' + size(f.size);
    api('/api/upload?name=' + encodeURIComponent(f.name) +
        '&by=' + encodeURIComponent(whoName) + '&note=' + encodeURIComponent(note),
        { method:'POST', body:f })
      .then(function (r) {
        tag.textContent = r.ok ? 'done' : 'failed';
        if (!r.ok) tag.style.color = 'var(--fail)';
        next(i + 1);
      })
      .catch(function () { tag.textContent = 'failed'; next(i + 1); });
  };
  next(0);
}

/* -------------------------------------------------------------- report -- */
var reportKind = 'bug';
function drawReport() {
  el('page').innerHTML = head() +
    '<div class="form">' +
      '<div class="pick">' +
        '<button data-kind="bug" class="' + (reportKind === 'bug' ? 'on' : '') + '">Something is broken</button>' +
        '<button data-kind="idea" class="' + (reportKind === 'idea' ? 'on' : '') + '">I have an idea</button>' +
      '</div>' +
      '<label for="rt">In one line</label>' +
      '<input id="rt" placeholder="' + (reportKind === 'bug'
        ? 'Doors in Whiterun will not open' : 'Add Cloaks of Skyrim') + '">' +
      '<label for="rd">What happened, and what you were doing</label>' +
      '<textarea id="rd" placeholder="' + (reportKind === 'bug'
        ? 'Where you were, what you pressed, what you expected, what happened instead. If you have a screenshot or a log, put it on the Uploads page and say so here.'
        : 'What it would add, and a Nexus link if it is a mod.') + '"></textarea>' +
      '<label for="rw">Your name</label>' +
      '<input id="rw" value="' + esc(remember('who')) + '" placeholder="so we know who to ask">' +
      '<div class="formfoot">' +
        '<button class="btn key" id="rsend">Send it</button>' +
        '<span class="said" id="rsaid"></span>' +
      '</div>' +
    '</div>' +
    '<p class="lede" style="margin-top:18px">Check <a href="/hub/known">Known Issues</a> ' +
    'first. A lot of what looks broken is a limit of how the server works and is ' +
    'already written down there.</p>';

  each(el('page'), '[data-kind]', function (b) {
    b.onclick = function () { reportKind = b.dataset.kind; drawReport(); };
  });
  el('rsend').onclick = function () {
    var title = el('rt').value.trim();
    if (!title) { el('rsaid').textContent = 'say what it is first'; el('rt').focus(); return; }
    var byName = el('rw').value.trim();
    if (byName) remember('who', byName);
    el('rsend').disabled = true;
    el('rsaid').textContent = 'sending';
    api('/api/report', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ kind:reportKind, title:title,
        detail:el('rd').value, by:byName })
    }).then(function (r) {
      if (!r.ok) throw 0;
      el('page').innerHTML = head() +
        '<div class="form" style="text-align:center">' +
        '<h3 style="font:600 20px Spectral,Georgia,serif;margin:6px 0 8px;color:var(--gold)">Sent</h3>' +
        '<p class="said">It is in front of whoever is fixing things. If you have a ' +
        'screenshot or a log, the <a href="/uploads">Uploads</a> page takes those.</p>' +
        '<div class="formfoot" style="justify-content:center">' +
        '<button class="btn" id="another">Send another</button></div></div>';
      el('another').onclick = function () { drawReport(); };
    }).catch(function () {
      el('rsend').disabled = false;
      el('rsaid').textContent = 'did not send, try again';
    });
  };
}

/* --------------------------------------------------------------- inbox -- */
function saveInbox() {
  saidNow('saving');
  api('/api/inbox', {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(S.inbox)
  }).then(function (r) { saidNow(r.ok ? 'saved' : 'did not save'); })
    .catch(function () { saidNow('did not save'); });
}

function drawInbox() {
  var out = head();
  if (!S.inbox.length) {
    out += '<div class="empty">Nothing sent in yet.</div>';
  }
  S.inbox.forEach(function (n) {
    out += '<div class="note' + (n.state !== 'new' ? ' done' : '') + '" data-i="' + n.id + '">' +
      '<span class="kind ' + (n.kind === 'idea' ? 'idea' : 'bug') + '">' +
        (n.kind === 'idea' ? 'idea' : 'bug') + '</span>' +
      '<div class="mid">' +
        '<div class="t">' + esc(n.title) + '</div>' +
        (n.detail ? '<div class="d">' + esc(n.detail) + '</div>' : '') +
        '<div class="m">' + (n.by ? esc(n.by) + '  &middot;  ' : '') +
          new Date(n.at).toLocaleString() +
          (n.state !== 'new' ? '  &middot;  ' + esc(n.state) : '') + '</div>' +
        (n.state === 'new' ? '<div class="acts">' +
          '<button class="btn small" data-to="active|' + n.id + '">Into Active Issues</button>' +
          '<button class="btn small" data-to="suggestions|' + n.id + '">Into Suggestions</button>' +
          '<button class="btn small" data-to="known|' + n.id + '">Into Known Issues</button>' +
          '<button class="btn small" data-dismiss="' + n.id + '">Not doing this</button>' +
        '</div>' : '<div class="acts">' +
          '<button class="btn small" data-reopen="' + n.id + '">Put it back</button>' +
          '<button class="btn small" data-forget="' + n.id + '">Delete</button></div>') +
      '</div></div>';
  });
  el('page').innerHTML = out;

  var find = function (id) {
    return S.inbox.filter(function (x) { return x.id === id; })[0];
  };

  each(el('page'), '[data-to]', function (b) {
    b.onclick = function () {
      var parts = b.dataset.to.split('|');
      var board = parts[0], item = find(parts[1]);
      if (!item || !S.boards[board]) { saidNow('that board is not loaded'); return; }
      var bd = S.boards[board];
      bd.sections = bd.sections || [];
      var sec = bd.sections.filter(function (s) { return /^(new|sent in|open)/i.test(s.name); })[0];
      if (!sec) {
        sec = { id:newId('s'), name:'Sent in', note:'',
                columns:[{id:newId('c'),name:'Item'},{id:newId('c'),name:'Detail'},
                         {id:newId('c'),name:'From'}], rows:[] };
        bd.sections.unshift(sec);
      }
      var cells = {};
      cells[sec.columns[0].id] = item.title;
      if (sec.columns[1]) cells[sec.columns[1].id] = item.detail || '';
      if (sec.columns[2]) cells[sec.columns[2].id] = item.by || '';
      sec.rows.unshift({ id:newId('r'), done:false, at:Date.now(), by:item.by || '', cells:cells });
      item.state = 'moved to ' + label(board);
      saveBoard(board);
      saveInbox();
      draw();
    };
  });
  each(el('page'), '[data-dismiss]', function (b) {
    b.onclick = function () {
      var item = find(b.dataset.dismiss);
      if (item) { item.state = 'not doing this'; saveInbox(); draw(); }
    };
  });
  each(el('page'), '[data-reopen]', function (b) {
    b.onclick = function () {
      var item = find(b.dataset.reopen);
      if (item) { item.state = 'new'; saveInbox(); draw(); }
    };
  });
  each(el('page'), '[data-forget]', function (b) {
    b.onclick = function () {
      if (!confirm('Delete this for good?')) return;
      S.inbox = S.inbox.filter(function (x) { return x.id !== b.dataset.forget; });
      saveInbox(); draw();
    };
  });
}

/* ---------------------------------------------------------------- open -- */
marked.setOptions({ breaks:false, gfm:true });

// Discord sends people back here with a word about how it went.
(function () {
  var q = new URLSearchParams(location.search).get('discord');
  if (!q) return;
  history.replaceState({}, '', location.pathname);
  setTimeout(function () {
    var s = el('said');
    if (s) s.textContent = q === 'cancelled' ? 'Discord sign in cancelled' : 'Discord sign in failed';
  }, 400);
})();

api('/api/hello').then(function (r) {
  return r.json().then(function (d) { return { ok:r.ok, d:d }; });
}).then(function (x) {
  S.discord = !!(x.d && x.d.discord);
  if (!S.discord) {
    el('gatediscord').hidden = true;
    el('pwbox').hidden = false;
  }
  if (x.ok) start(); else showGate();
}).catch(function () { showGate(); });

// The sign in button on the gate had a bare /auth/discord with no back, so
// everybody who signed in from here landed on the public front page and had to
// find their way to the panel a second time. Send them back to the page they
// were already trying to open.
function showGate() {
  var a = el('gatediscord');
  if (a) {
    var back = location.pathname;
    if (!/^\/[A-Za-z0-9\/_-]*$/.test(back) || back === '/') back = '/hub';
    a.href = '/auth/discord?back=' + encodeURIComponent(back);
  }
  el('gate').style.display = 'grid';
}
</script>
