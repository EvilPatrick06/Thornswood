<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thornswood emotes</title>
<style>
  /* The CEF overlay composites this straight over the game, so everything that
     is not the wheel has to be genuinely transparent, not dark. */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    user-select: none; cursor: default;
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  svg { overflow: visible; }
  /* Not the hidden attribute: `hidden` is an HTML IDL property and setting it on
     an SVG element quietly writes an expando that changes nothing. */
  .gone { display: none; }

  .seg {
    fill: rgba(14, 13, 11, 0.72);
    stroke: rgba(198, 170, 109, 0.28);
    stroke-width: 1;
    transition: fill 90ms linear;
  }
  .seg.hot { fill: rgba(120, 94, 44, 0.88); stroke: rgba(233, 209, 155, 0.9); }

  .label {
    fill: #d9cfb4; font-size: 14px; text-anchor: middle;
    dominant-baseline: middle; pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
  .label.hot { fill: #f6e9c8; }
  .num {
    fill: rgba(198, 170, 109, 0.5); font-size: 10px; text-anchor: middle;
    dominant-baseline: middle; pointer-events: none;
  }

  #hub {
    fill: rgba(14, 13, 11, 0.86);
    stroke: rgba(198, 170, 109, 0.45); stroke-width: 1.5;
    transition: fill 90ms linear;
  }
  #hub.hot { fill: rgba(120, 44, 44, 0.9); stroke: rgba(233, 170, 155, 0.9); }
  #hubtext {
    fill: #c6aa6d; font-size: 15px; text-anchor: middle;
    dominant-baseline: middle; pointer-events: none; letter-spacing: .08em;
  }

  #ringname {
    fill: #c6aa6d; font-size: 13px; text-anchor: middle;
    letter-spacing: .22em; text-transform: uppercase; pointer-events: none;
  }
  #hint {
    fill: rgba(217, 207, 180, .55); font-size: 11.5px; text-anchor: middle;
    pointer-events: none; letter-spacing: .04em;
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="wheel" width="520" height="560" viewBox="-260 -270 520 560" aria-label="Emote wheel" class="gone">
    <text id="ringname" x="0" y="-238">Thornswood</text>
    <g id="segments"></g>
    <circle id="hub" cx="0" cy="0" r="54"></circle>
    <text id="hubtext" x="0" y="0">STOP</text>
    <text id="hint" x="0" y="258">click, or press 1&ndash;9 and 0 &middot; Tab for the next ring &middot; Esc to close</text>
  </svg>
</div>

<script>
(function () {
  'use strict';

  var R_IN = 62, R_OUT = 232, R_LABEL = 152;
  var segs = document.getElementById('segments');
  var hub = document.getElementById('hub');
  var ringName = document.getElementById('ringname');

  var items = [];
  var RING_TITLES = ['Gestures', 'Business'];

  function polar(r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return [r * Math.cos(a), r * Math.sin(a)];
  }

  function wedge(from, to) {
    var a = polar(R_OUT, from), b = polar(R_OUT, to);
    var c = polar(R_IN, to),   d = polar(R_IN, from);
    var big = (to - from) > 180 ? 1 : 0;
    return 'M' + a[0] + ',' + a[1] +
           'A' + R_OUT + ',' + R_OUT + ' 0 ' + big + ' 1 ' + b[0] + ',' + b[1] +
           'L' + c[0] + ',' + c[1] +
           'A' + R_IN + ',' + R_IN + ' 0 ' + big + ' 0 ' + d[0] + ',' + d[1] + 'Z';
  }

  function say(what) {
    try {
      window.skyrimPlatform.sendMessage('thornswood-emote', what);
    } catch (e) {
      try { console.log('[emotes] sendMessage failed: ' + e); } catch (e2) {}
    }
  }

  function draw(list) {
    while (segs.firstChild) { segs.removeChild(segs.firstChild); }
    var n = list.length;
    if (!n) { return; }
    var step = 360 / n;

    for (var i = 0; i < n; i++) {
      (function (i) {
        var item = list[i];
        // The first wedge is centred on straight up, so the label positions
        // match the order people read them in.
        var from = i * step - step / 2;
        var to   = from + step;

        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', 'seg');
        path.setAttribute('d', wedge(from, to));

        var mid = polar(R_LABEL, from + step / 2);
        var label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('class', 'label');
        label.setAttribute('x', mid[0]);
        label.setAttribute('y', mid[1]);
        label.textContent = item.name;

        // Directly under the label rather than further out along the radius:
        // on the horizontal wedges a radial offset lands the digit right beside
        // the word and the two read as one string.
        var num = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        num.setAttribute('class', 'num');
        num.setAttribute('x', mid[0]);
        num.setAttribute('y', mid[1] + 15);
        num.textContent = i < 9 ? String(i + 1) : (i === 9 ? '0' : '');

        function hot(on) {
          path.setAttribute('class', on ? 'seg hot' : 'seg');
          label.setAttribute('class', on ? 'label hot' : 'label');
        }
        path.addEventListener('mouseenter', function () { hot(true); });
        path.addEventListener('mouseleave', function () { hot(false); });
        path.addEventListener('click', function () { say(item.event); });

        segs.appendChild(path);
        segs.appendChild(label);
        segs.appendChild(num);
      })(i);
    }
  }

  hub.addEventListener('mouseenter', function () { hub.setAttribute('class', 'hot'); });
  hub.addEventListener('mouseleave', function () { hub.setAttribute('class', ''); });
  hub.addEventListener('click', function () { say('IdleForceDefaultState'); });

  // Right-click anywhere turns the ring, same as Tab.
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    say('__page');
  });

  // The plugin calls this every time it shows the wheel or turns the ring.
  window.thornswoodSetRing = function (list, index, count) {
    items = list || [];
    // Until the plugin sends a ring there is nothing to show, and a bare hub
    // floating over a loading screen is worse than nothing.
    document.getElementById('wheel').classList.toggle('gone', !items.length);
    ringName.textContent = (RING_TITLES[index] || 'Emotes') +
                           (count > 1 ? '  ' + (index + 1) + ' / ' + count : '');
    draw(items);
  };

  // Tell the plugin the page is parsed and thornswoodSetRing exists. Without
  // this the first open can push a ring into a page that has not loaded yet and
  // the wheel comes up empty.
  say('__ready');

  // Something to look at if the page is opened outside the game.
  if (!window.skyrimPlatform) {
    window.thornswoodSetRing([
      { name: 'Wave', event: 'IdleWave' }, { name: 'Applaud', event: 'IdleApplaud2' },
      { name: 'Salute', event: 'IdleSalute' }, { name: 'Laugh', event: 'IdleLaugh' },
      { name: 'Cheer', event: 'IdleCivilWarCheer' }, { name: 'Point', event: 'IdlePointClose' },
      { name: 'Come here', event: 'IdleComeThisWay' }, { name: 'Pray', event: 'IdlePray' },
      { name: 'Warm hands', event: 'IdleWarmHandsStanding' }, { name: 'Examine', event: 'IdleExamine' },
      { name: 'Surrender', event: 'IdleSurrender' }, { name: 'Dance', event: 'IdleCiceroDance1' }
    ], 0, 2);
  }
})();
</script>
</body>
</html>
