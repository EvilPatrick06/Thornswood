; Thornswood
;
; Keys for the pieces this server adds. Values are DirectInput scan codes, the
; same numbering SkyrimPlatform's buttonEvent reports and the same one Trade
; Together, SkyUI and True Directional Movement use, so the launcher's Controls
; page can read and rebind them alongside everything else.
;
; Common ones: A-Z are 30,48,46,32,18,33,34,35,23,36,37,38,50,49,24,25,16,19,
; 31,20,22,47,17,45,21,44 for A..Z.  1-9 are 2..10 and 0 is 11.
; Tab 15, Escape 1, Space 57, Enter 28, Left Shift 42, Left Ctrl 29, Left Alt 56.
; F1-F12 are 59..68, 87, 88.
;
; Rebind from the launcher rather than here if you can: it checks the key is not
; already doing something else in the same file.

[Emotes]

; Opens and closes the emote wheel. G.
WheelKey = 34

; Turns to the other ring while the wheel is open. Tab.
PageKey = 15

; Closes the wheel. Escape.
CloseKey = 1

; Breaks you out of an idle you are stuck in. Works any time, which is the
; point: the usual reason you want it is that the wheel is not open. N.
StopKey = 49

[Chat]

; Hands the keyboard to the chat box and puts the cursor in it. Escape gives it
; back to the game. Enter, because Skyrim uses it for nothing while you are
; playing and it is what anybody expects a chat to open on.
;
; The browser drawing the chat does not hold the keyboard while you play, which
; is deliberate: if it did, every letter you pressed would go to the chat box
; instead of the game. So talking is a thing you turn on.
ChatKey = 28

; The chat and the voice service live on the same port on the game server. The
; plugin reads the address itself out of skymp5-client-settings.txt, so only the
; port is here.
VoicePort = 7778

[Creation]

; Opens the trade or town menu by hand, if the automatic one has not appeared.
; Does nothing once creation is finished. M.
MenuKey = 50

[Voice]

; Hold to talk. Everyone near you hears you, and the further away they are
; standing the quieter you get. V.
PushToTalk = 47

; The plugin reads this and forwards it into the overlay that runs voice.
; It has to work that way round: voice needs a browser, and the game's own
; browser does not hold the keyboard while you are playing, so a key pressed in
; the game would otherwise never reach it.
;
; There is no separate voice window. There cannot be: served from a plain http
; address, Chromium does not expose a microphone at all, on any flag. It is an
; origin rule rather than a permission, which is why that window could never
; have worked however it was launched. The page inside the game is loaded from
; file://, which Chromium counts as trustworthy, so the microphone exists
; there.

; Opens the microphone. 1 on, 0 off.
;
; Granting the permission and opening the device are two different acts.
; SkyrimPlatform appends --enable-media-stream now, in
; MyChromiumApp::OnBeforeCommandLineProcessing, so CEF says yes to a capture
; request instead of refusing it the way Alloy does with no permission
; handler. But nothing is opened until the page calls getUserMedia, and this
; is what decides whether it does.
;
; It is at 0 while we work out whether a live capture is what leaves the
; keyboard dead in character creation. Set it to 1 and play, set it to 0 and
; play, and the difference between the two runs is exactly one microphone.
; That is a test. Swapping a 15 MB DLL each time is not.
;
; The launcher passes nothing on the command line and cannot: skse64_loader
; parses its own arguments and answers an unknown one with "Couldn't read
; arguments." and no game at all.
Microphone = 0

[Tools]

; Marks where you are standing, for the launcher's starting locations. Walk
; into an inn, stand where somebody should arrive, face the way they should
; face, and press this. The cell, the position and the angle are written to
; Data\Platform\thornswood-spots.txt, which Mark-Spot.ps1 reads.
;
; The nine arrival points were written by hand and some of them are wrong.
; Morthal and Dawnstar are two units apart, which is two different inns in two
; different holds sharing a position, so at least one of them puts you in a
; wall. F8.
MarkKey = 66
