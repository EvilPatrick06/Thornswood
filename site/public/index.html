<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thornswood</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-192.png">
<!-- Both from this site since entry 247, the same files the public front uses,
     rather than from Google and Cloudflare's library CDN. -->
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/hub.css">
<script src="/marked-12.0.2.min.js"></script>
</head>
<body>

<div id="gate">
  <div class="box">
    <img src="/logo.png" alt="Thornswood" width="82" height="82" class="gate-logo">
    <h1>The Works</h1>
    <p>Discord decides who gets in here, the same as it decides who gets into
      the game. No second password to pass around.</p>
    <a class="discord big" id="gatediscord" href="/auth/discord">Sign in with Discord</a>
    <!--
      There is no password on this door any more. Discord roles decide who gets
      in here exactly as they decide who gets into the game, so a second secret
      that has to be passed around by hand is one more thing to leak.

      The box below exists only until Discord is configured, because otherwise
      the one person who could configure it cannot get in to do it.
    -->
    <div id="pwbox" hidden>
      <p class="said said-gate">Discord sign in is not set up on
        this server yet.</p>
      <label for="pw">Server password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="server password">
      <button class="enter" id="go">Enter</button>
    </div>
    <div class="err" id="err"></div>
    <p class="backhome"><a href="/">Back to thornswood.net</a></p>
  </div>
</div>

<div id="shell">
  <nav>
    <a class="brand" href="/hub"><img src="/logo-28.webp" srcset="/logo-28.webp 1x, /logo-56.webp 2x, /logo-84.webp 3x" alt="" width="22" height="22">Thornswood</a>
    <a class="backout" href="/">&larr; the public site</a>
    <div id="tabs"></div>
    <div class="sep" id="whoami"></div>
  </nav>
  <main><div class="wrap" id="page"></div></main>
</div>

<script src="/copies.js"></script>
<script src="/hub.js"></script>
</body>
</html>
