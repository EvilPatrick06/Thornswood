<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thornswood</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-192.png">
<!-- Both from this site since entry 247, the same files the public front uses,
     rather than from Google and Cloudflare's library CDN. -->
<link rel="stylesheet" href="/fonts.css">
<script src="/marked-12.0.2.min.js"></script>
<style>
/* The same palette and the same faces as the public site. Two halves of one
   thing should not look like two different products. */
:root{
  --ink:#0B0E0A; --panel:#14180F; --raised:#1D2318; --line:#2B3323; --line2:#3D4733;
  --text:#E4E7DA; --dim:#96A084; --faint:#616B53;
  --gold:#C9A24B; --gold-dim:#8A6F33;
  --pass:#6FA05A; --fail:#C05A4E; --skip:#7C8493; --blurple:#5865F2;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --carve:Cinzel,Spectral,Georgia,serif;
}
*{box-sizing:border-box}
/* Without this, hiding anything that sets its own display (the Discord button
   is inline-flex) does nothing at all, which is how both halves of the sign in
   ended up on screen at once. */
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow-x:hidden}
img{max-width:100%;height:auto}
body{background:var(--ink);color:var(--text);font:15px/1.65 var(--sans)}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold-dim);outline-offset:2px}

/* ------------------------------------------------------------- sign in -- */
#gate{position:fixed;inset:0;display:none;place-items:center;background:var(--ink);z-index:50;
  padding:20px}
#gate .box{width:min(92vw,370px);text-align:center}
#gate h1{font:600 30px/1.1 var(--carve);letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold);margin:0 0 6px}
#gate p{color:var(--dim);margin:0 0 22px;font-size:14px}
#gate input{width:100%;padding:11px 13px;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:7px;font:15px var(--sans)}
#gate input:focus{outline:none;border-color:var(--gold-dim)}
#gate button.enter{width:100%;margin-top:10px;padding:11px;background:var(--gold);color:#17190F;
  border:0;border-radius:7px;font:600 15px var(--sans);cursor:pointer}
#gate .err{color:var(--fail);font-size:13px;margin-top:12px;min-height:18px}
.discord.big{width:100%;justify-content:center;padding:14px;font-size:15px}
#gate #pwbox{margin-top:10px}
#gate .backhome{margin-top:26px;font-size:13px}
#gate .backhome a{color:var(--faint);text-decoration:none}
#gate .backhome a:hover{color:var(--gold)}
.discord{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:7px;
  background:var(--blurple);color:#fff;text-decoration:none;font:600 14px var(--sans);
  border:0;cursor:pointer}
.discord.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.discord.ghost:hover{color:#fff;background:var(--blurple);border-color:var(--blurple)}
#gate .or{color:var(--faint);font-size:12px;margin:18px 0 12px;letter-spacing:.06em}

/* ---------------------------------------------------------------- shell -- */
/*
  Five shapes to hold: a phone, a tablet, a laptop, a wide desktop, and a
  monitor stood on its end beside another one. The last is the awkward one,
  because it is narrow like a phone but as tall as a desk, so it wants the
  phone's single column and the desktop's density at once. So the column
  breaks on width alone and nothing keys off orientation.
*/
#shell{display:none;height:100%;grid-template-columns:238px minmax(0,1fr)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:22px 0 18px;
  display:flex;flex-direction:column;overflow-y:auto;gap:2px}
nav .brand{display:flex;align-items:center;gap:9px;font:600 17px/1 var(--carve);
  color:var(--text);padding:0 20px 16px;letter-spacing:.13em;text-transform:uppercase;
  white-space:nowrap;text-decoration:none}
nav .brand img{border-radius:5px}
nav a.tab{display:flex;align-items:center;gap:8px;padding:11px 20px;margin:0 10px;color:var(--dim);
  text-decoration:none;font-size:14px;border-left:2px solid transparent;border-radius:8px;white-space:nowrap}
nav a.tab:hover{color:var(--text);background:var(--raised)}
nav a.tab.on{color:var(--text);border-left-color:var(--gold);background:var(--raised);font-weight:600}
nav a.tab .key{margin-left:auto;font:600 9px var(--sans);letter-spacing:.1em;color:var(--gold-dim);
  border:1px solid var(--gold-dim);border-radius:3px;padding:1px 4px}
nav .group{font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);padding:20px 20px 6px}
nav .backout{display:block;padding:0 20px 16px;margin-top:-8px;font:400 12px var(--sans);
  color:var(--faint);text-decoration:none}
nav .backout:hover{color:var(--gold)}
@media(max-width:900px){ nav .backout{display:none} }
nav .sep{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:9px;align-items:flex-start}
nav .me{font-size:12px;color:var(--dim);line-height:1.4}
nav .me b{color:var(--gold);font-weight:600}
nav .out{font-size:12px;color:var(--faint);cursor:pointer;background:none;border:0;padding:0}
nav .out:hover{color:var(--text)}

main{overflow-y:auto;padding:34px 40px 90px;min-width:0}
.wrap{max-width:860px;margin:0 auto}
.wide .wrap{max-width:1280px}

@media(min-width:1500px){
  .wrap{max-width:920px}
  .wide .wrap{max-width:1500px}
  main{padding:44px 56px 110px}
  nav{width:266px}
  #shell{grid-template-columns:266px minmax(0,1fr)}
}
@media(min-width:2200px){
  #shell{max-width:2100px;margin:0 auto;border-right:1px solid var(--line)}
}
@media(max-width:1180px){
  #shell{grid-template-columns:200px minmax(0,1fr)}
  main{padding:30px 26px 80px}
}
@media(max-width:900px){
  html,body{height:auto}
  main{overflow-y:visible}
  #shell{grid-template-columns:1fr;height:auto;min-height:100%}
  nav{border-right:0;border-bottom:1px solid var(--line);padding:12px 0 0;
    flex-direction:row;flex-wrap:wrap;align-items:center;
    position:sticky;top:0;z-index:20;
    padding-top:calc(12px + env(safe-area-inset-top,0px))}
  nav .brand{padding:0 16px 10px;font-size:19px;flex:1 0 auto}
  nav .group{display:none}
  nav .sep{margin:0;padding:0 16px 10px;border-top:0;order:3;flex-direction:row;
    align-items:center;gap:12px}
  #tabs{order:4;flex:1 0 100%;display:flex;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line)}
  #tabs::-webkit-scrollbar{display:none}
  nav a.tab{border-left:0;border-bottom:2px solid transparent;padding:11px 14px;margin:0;border-radius:0;flex:0 0 auto}
  nav a.tab.on{border-left-color:transparent;border-bottom-color:var(--gold)}
  nav a.tab .key{display:none}
  main{padding:24px 16px 70px}
}
@media(max-width:560px){
  main{padding:20px 14px 60px}
  .wrap,.wide .wrap{max-width:100%}
}

/* ---------------------------------------------------------------- home -- */
.hero{display:flex;align-items:center;gap:20px;margin-bottom:6px}
.hero img{width:74px;height:74px;border-radius:16px;flex:0 0 auto}
.hero h1{font:600 40px/1.05 Spectral,Georgia,serif;margin:0;color:var(--text);text-wrap:balance}
.hero .sub{color:var(--dim);font-size:15px;margin-top:6px;max-width:52ch}
@media(max-width:560px){
  .hero{gap:14px}
  .hero img{width:56px;height:56px;border-radius:12px}
  .hero h1{font-size:30px}
}
.rule{height:1px;background:var(--line);margin:26px 0 24px}
.cards{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(244px,1fr))}
.card{display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:17px 17px 15px;
  transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--gold-dim);transform:translateY(-1px)}
.card .t{font:600 17px var(--carve);letter-spacing:.02em;color:var(--text);display:flex;align-items:baseline;gap:8px;
  flex-wrap:wrap}
.card .t .mark{font:600 10px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold-dim);border-radius:3px;padding:1px 5px}
.card .d{color:var(--dim);font-size:13.5px;margin-top:5px;line-height:1.55}
.card .n{margin-top:12px;font:600 12px var(--sans);letter-spacing:.05em;color:var(--faint);
  text-transform:uppercase}
.card.lead{background:linear-gradient(160deg,#242A1D,#1B1F17);border-color:var(--gold-dim)}
.card.lead .t{color:var(--gold)}
.section-label{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin:30px 0 12px}
.latest{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:9px;padding:15px 17px;margin-bottom:22px}
.latest .when{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint)}
.latest .what{font:600 16px var(--sans);margin-top:3px}
.latest a{font-size:13px}

/* ------------------------------------------------- people and sessions -- */
/*
  One card a person, not one row a session. Closed it answers the four things
  asked of this page at a glance: who they are, their id, how long they have
  played in total, and when they last did. Open it is the table that used to
  be the whole page.

  details and summary rather than a button and a handler: the browser gives
  keyboard and screen reader behaviour for free, and the open state survives a
  redraw without anything here having to remember it.
*/
/*
  Built out of what the rest of the site already uses, which the first version
  of this was not: .entry for a panel, .btn for a button, .pill for a tag,
  --carve for a name and the uppercase letterspaced label that .entry .when
  established. The search boxes were left on the browser's own styling, white
  on a dark page, which was most of what looked wrong.
*/
.people{display:grid;gap:11px}
.person{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  transition:border-color .12s}
.person[open],.person:hover{border-color:var(--gold-dim)}
.person>summary{cursor:pointer;padding:15px 19px;display:grid;gap:6px 22px;align-items:start;
  grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto auto 12px;list-style:none}
.person>summary::-webkit-details-marker{display:none}
.person>summary::marker{content:''}
.person>summary:focus-visible{outline:2px solid var(--gold-dim);outline-offset:-2px}
.pf{min-width:0}
/* The same label as .entry .when, because it is the same kind of label. */
.pf .lab{display:block;font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-bottom:4px}
.pf .val{display:block;font-size:14px;color:var(--text);word-break:break-word}
.pf .val.nm{font:600 18px/1.3 var(--carve);letter-spacing:.02em}
.pf .val.id{font:12.5px var(--mono);color:var(--dim)}
.pf .val.hrs{font:600 15px var(--sans);color:var(--gold);white-space:nowrap}
.pf .val.when{white-space:nowrap;color:var(--dim);font-size:13.5px}
.person .chev{align-self:center;color:var(--faint);transition:transform .12s,color .12s;font-size:11px}
.person[open] .chev{transform:rotate(90deg);color:var(--gold)}
.pbody{border-top:1px solid var(--line);background:var(--ink)}
.pbody .tablewrap{border:0;border-radius:0;background:none}
.pbody table.board{min-width:0}
.pbody .bar{padding:13px 19px 0;margin-bottom:0}
.pbody .tally{padding:13px 19px 0;margin-bottom:0}

/* ------------------------------------------------ one session's logs -- */
.moreWrap{padding:11px 19px 15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.keptBy{font:11.5px var(--mono);color:var(--faint)}
.logs{flex:1 1 100%;display:grid;gap:7px;margin-top:4px}
.logs .none{font-size:13.5px;color:var(--dim);padding:10px 13px;
  border:1px dashed var(--line);border-radius:8px}
.prov{font-size:13px;color:var(--dim);padding:10px 13px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;line-height:1.7;word-break:break-word}
.prov b{color:var(--faint);font-weight:600;font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;margin-right:3px}
.prov .warn{color:var(--fail)}
.logf{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;
  transition:border-color .12s}
.logf:hover{border-color:var(--line2)}
.logf[open]{border-color:var(--gold-dim)}
.logf>summary{cursor:pointer;list-style:none;padding:9px 13px;display:flex;align-items:center;gap:11px}
.logf>summary::-webkit-details-marker{display:none}
.logf>summary::marker{content:''}
.logf>summary:focus-visible{outline:2px solid var(--gold-dim);outline-offset:-2px}
.logf .nm{font:600 13px var(--mono);color:var(--text);flex:1;min-width:0;word-break:break-all}
.logf .sz{font:11.5px var(--mono);color:var(--faint);white-space:nowrap}
.logf .chev{color:var(--faint);font-size:10px;transition:transform .12s,color .12s}
.logf[open] .chev{transform:rotate(90deg);color:var(--gold)}
.logf pre{margin:0;padding:12px 13px;border-top:1px solid var(--line);background:var(--ink);
  font:12px/1.6 var(--mono);color:var(--dim);white-space:pre-wrap;word-break:break-word;
  max-height:440px;overflow:auto}
@media(max-width:760px){
  .person>summary{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 12px;padding:14px 16px}
  .pf .val.hrs,.pf .val.when{white-space:normal}
  .moreWrap,.pbody .bar,.pbody .tally{padding-inline:16px}
}

/* ------------------------------------------------------------- toolbar -- */
.crumb{font-size:13px;color:var(--faint);margin-bottom:10px}
.crumb a{color:var(--dim);text-decoration:none}
.crumb a:hover{color:var(--gold)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.bar h2{font:600 30px/1.2 var(--carve);letter-spacing:.035em;margin:0;flex:1 1 200px;
  color:var(--text);text-wrap:balance}
@media(max-width:560px){.bar h2{font-size:24px}}
.btn{padding:7px 13px;background:var(--raised);color:var(--text);border:1px solid var(--line);
  border-radius:6px;font:14px var(--sans);cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--gold-dim)}
.btn.key{background:var(--gold);color:#17190F;border-color:var(--gold);font-weight:600}
.btn.small{min-height:0;padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn.on{border-color:var(--gold);color:var(--gold);background:rgba(201,162,75,.09)}

/* Search boxes and pickers, matching .btn.
 *
 * There was no site-wide rule for these at all: every input outside .form and
 * .res took the browser's own styling, which on a dark page is a white box
 * with a system font, and that was most of what made the sessions controls
 * look bolted on rather than built in. */
input[type=search],input[type=text],input[type=date],select{
  padding:7px 11px;background:var(--raised);color:var(--text);
  border:1px solid var(--line);border-radius:6px;font:14px var(--sans);min-height:36px}
input[type=search]:hover,input[type=text]:hover,input[type=date]:hover,select:hover{
  border-color:var(--line2)}
input[type=search]:focus,input[type=text]:focus,input[type=date]:focus,select:focus{
  outline:none;border-color:var(--gold-dim)}
input[type=search]::placeholder,input[type=text]::placeholder{color:var(--faint)}
select{cursor:pointer;padding-right:26px}
.bar input[type=search]{flex:1 1 220px;min-width:0}
.said{font-size:13px;color:var(--dim)}
.lede{color:var(--dim);font-size:14px;margin:6px 0 26px;max-width:66ch}
.tagline{display:inline-block;font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold-dim);border-radius:3px;padding:2px 6px;
  vertical-align:3px}

/* ------------------------------------------------------------- content -- */
.doc h1{font:600 30px/1.2 var(--carve);letter-spacing:.03em;margin:34px 0 12px;color:var(--text)}
.doc h2{font:600 22px/1.25 var(--carve);letter-spacing:.03em;margin:34px 0 10px;
  padding-bottom:7px;border-bottom:1px solid var(--line);color:var(--text)}
.doc h3{font:600 17px var(--sans);margin:24px 0 8px;color:var(--gold)}
.doc p,.doc li{color:var(--text)}
.doc ol,.doc ul{padding-left:22px}
.doc li{margin:4px 0}
.doc hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.doc strong{color:#F0F4E8}
.doc table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px;display:block;
  overflow-x:auto}
.doc th{text-align:left;padding:8px 11px;background:var(--raised);color:var(--gold);
  font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
.doc td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.doc blockquote{margin:16px 0;padding:8px 16px;border-left:3px solid var(--gold-dim);color:var(--dim)}
.doc code,.mdc code{font:13px var(--mono);background:var(--raised);padding:2px 5px;border-radius:4px;
  color:var(--gold)}
.mdc p{margin:0 0 6px}
.mdc p:last-child{margin:0}
/* Lists inside a cell are a few short lines, not a document. Marked makes
   them loose when the source has blank lines, which leaves a paragraph inside
   every item and a gap you could park a cart in. */
.mdc ol,.mdc ul{margin:6px 0;padding-left:20px}
.mdc li{margin:2px 0}
.mdc li p{margin:0}
.mdc h1,.mdc h2,.mdc h3{font:600 15px var(--sans);margin:8px 0 4px;color:var(--gold)}
/* The first column is the name of the thing, so it gets room to be a name
   rather than one word per line. */
table.board th:nth-child(2),table.board td:nth-child(2){min-width:168px}
.cmd{position:relative;margin:14px 0;background:#0D100B;border:1px solid var(--line);
  border-radius:8px;overflow:hidden}
.cmd pre{margin:0;padding:14px 52px 14px 15px;overflow-x:auto}
.cmd code{background:none;padding:0;color:#CFE0BE;font:13px/1.6 var(--mono)}
.cmd .copy{position:absolute;top:8px;right:8px;padding:4px 9px;background:var(--raised);
  border:1px solid var(--line);border-radius:5px;color:var(--dim);font:11px var(--sans);
  cursor:pointer}
.cmd .copy:hover{color:var(--text);border-color:var(--gold-dim)}
.cmd .copy.done{color:var(--pass);border-color:var(--pass)}
textarea.md{width:100%;min-height:62vh;padding:17px;background:#0D100B;color:var(--text);
  border:1px solid var(--line);border-radius:8px;font:13px/1.7 var(--mono);resize:vertical}
textarea.md:focus{outline:none;border-color:var(--gold-dim)}

/* --------------------------------------------------------------- board -- */
.sec{margin:26px 0 34px}
.sechead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.sechead h3{font:600 19px/1.3 var(--carve);letter-spacing:.03em;margin:0;color:var(--gold);
  padding:2px 4px;border-radius:5px;min-width:60px}
.sechead h3[contenteditable]:focus{outline:none;background:var(--raised);color:var(--text)}
.sechead .count{font:600 11px var(--sans);letter-spacing:.06em;color:var(--faint)}
.sechead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.secnote{color:var(--dim);font-size:13.5px;margin:0 0 10px;max-width:70ch}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.board{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
table.board th{text-align:left;padding:9px 12px;background:var(--raised);color:var(--gold);
  font:600 12.5px var(--sans);letter-spacing:.03em;border-bottom:1px solid var(--line);
  white-space:nowrap;position:relative}
table.board th span.nm{display:inline-block;padding:1px 3px;border-radius:4px;min-width:30px}
table.board th span.nm:focus{outline:none;background:var(--panel);color:var(--text)}
table.board th .x{margin-left:6px;color:var(--faint);background:none;border:0;cursor:pointer;
  font-size:14px;line-height:1;padding:0 2px}
table.board th .x:hover{color:var(--fail)}
table.board td{padding:0;border-bottom:1px solid var(--line);vertical-align:top}
table.board tr:last-child td{border-bottom:0}
table.board tr.done .cell{color:var(--faint);text-decoration:line-through}
/* One session that went wrong, so it can be found in a list of forty. The
   card stays its normal colour: a person who had one bad evening is not a red
   person, and a red card would bury the one session worth reading.

   Red is a crash or a throw, which nobody could have done anything about and
   which the bot also says out loud. Yellow is a session that failed for a
   reason already understood and with a known fix, an update that did not
   install or a load order that did not match, and those say nothing in
   Discord because there are a lot of them. */
table.board tr.bad td{background:rgba(192,90,78,.07)}
table.board tr.bad td:first-child{box-shadow:inset 3px 0 0 var(--fail)}
table.board tr.bad:hover td{background:rgba(192,90,78,.12)}
table.board tr.warn td{background:rgba(201,162,75,.06)}
table.board tr.warn td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
table.board tr.warn:hover td{background:rgba(201,162,75,.11)}
.pill.warn{background:rgba(201,162,75,.18);color:var(--gold)}

/* What the launcher itself was unhappy about, in more detail than its own
   window shows. */
.issues{margin-top:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.issues .ihead{padding:8px 11px;border-bottom:1px solid var(--line);
  font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.issues .i{padding:9px 11px;border-bottom:1px solid var(--line);display:grid;gap:3px}
.issues .i:last-child{border-bottom:0}
.issues .i .t{font-size:13.5px;color:var(--text)}
.issues .i .d{font:11.5px var(--mono);color:var(--faint);word-break:break-word}
.issues .i.blk{box-shadow:inset 3px 0 0 var(--fail)}
.issues .i.wrn{box-shadow:inset 3px 0 0 var(--gold)}
table.board tr:hover td{background:rgba(255,255,255,.012)}
td.tick,th.tick{width:38px;text-align:center;padding:10px 0 0;vertical-align:top}
td.tick input{width:16px;height:16px;accent-color:var(--pass);cursor:pointer}
.cell{padding:9px 12px;min-height:38px;word-break:break-word;cursor:text;border-radius:5px}
/* Markdown brings its own line breaks. Leaving pre-wrap on turns every
   newline BETWEEN tags into a blank line, which is what a three item list
   rendering two hundred pixels tall actually was. */
.mdc{white-space:normal}
.ro .cell{cursor:default}
.cell:hover{background:rgba(201,162,75,.05)}
.ro .cell:hover{background:none}
.cell:empty::after{content:'\00a0'}
td textarea{width:100%;min-height:38px;padding:8px 11px;background:#0D100B;color:var(--text);
  border:1px solid var(--gold-dim);border-radius:5px;font:14px/1.5 var(--sans);resize:vertical;
  display:block}
td textarea:focus{outline:none}
td.rowacts{width:1%;white-space:nowrap;padding:7px 9px 7px 0;text-align:right}
td.rowacts button{background:none;border:1px solid transparent;color:var(--faint);
  border-radius:5px;cursor:pointer;font:12px var(--sans);padding:3px 7px}
td.rowacts button:hover{color:var(--text);border-color:var(--line2);background:var(--raised)}
td.rowacts button.del:hover{color:var(--fail);border-color:var(--fail)}
tr.adder td{background:rgba(255,255,255,.015)}
tr.adder input{width:100%;padding:9px 12px;background:none;border:0;color:var(--text);
  font:14px var(--sans)}
tr.adder input::placeholder{color:var(--faint)}
tr.adder input:focus{outline:none;background:#0D100B}
tr.adder .plus{color:var(--faint);font-size:16px;line-height:38px}

/* Phone and narrow: the table becomes stacked cards, because nine columns of
   Skyrim bug notes on a 380 pixel screen is a horizontal scroll nobody uses. */
@media(max-width:640px){
  .tablewrap{border:0;background:none;overflow:visible}
  table.board,table.board tbody,table.board tr,table.board td{display:block;width:auto}
  table.board{min-width:0;max-width:100%}
  table.board thead{display:none}
  table.board tr{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    margin-bottom:10px;padding:6px 4px;position:relative}
  table.board td{border-bottom:0;padding:0}
  table.board td[data-label]::before{content:attr(data-label);display:block;
    font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    padding:7px 12px 0}
  td.tick,th.tick{width:auto;text-align:left;padding:8px 12px 0}
  td.tick input{width:20px;height:20px}
  .cell{min-height:0;padding:3px 12px 9px}
  td.rowacts{width:auto;text-align:left;padding:2px 9px 8px}
  tr.adder input{padding:10px 12px}
}

/* --------------------------------------------------------------- tests -- */
.res{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0 4px;
  padding:11px 13px;background:var(--raised);border:1px solid var(--line);border-radius:8px}
.res .mark{padding:5px 13px;border-radius:5px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font:600 12px var(--sans);letter-spacing:.06em;cursor:pointer}
.res .mark:hover{color:var(--text)}
.res .mark.on[data-v=pass]{background:var(--pass);border-color:var(--pass);color:#10170C}
.res .mark.on[data-v=fail]{background:var(--fail);border-color:var(--fail);color:#1A0E0C}
.res .mark.on[data-v=skip]{background:var(--skip);border-color:var(--skip);color:#12150F}
.res input{flex:1;min-width:170px;padding:6px 10px;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:5px;font:13px var(--sans)}
.res input:focus{outline:none;border-color:var(--gold-dim)}
.res input.who{flex:0 0 118px;min-width:0}
.res .when{font-size:11px;color:var(--faint);white-space:nowrap}
@media(max-width:620px){
  .res .mark{flex:1 1 0;min-height:42px;padding:5px 6px;text-align:center}
  .res input,.res input.who{flex:1 1 100%;min-height:40px}
  .res .when{flex:1 1 100%}
}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font:600 11px var(--sans);
  letter-spacing:.05em}
.pill.pass{background:rgba(111,160,90,.18);color:var(--pass)}
.pill.fail{background:rgba(192,90,78,.18);color:var(--fail)}
.pill.skip{background:rgba(124,132,147,.18);color:var(--skip)}
.pill.left{background:rgba(141,150,130,.15);color:var(--dim)}
.tally{display:flex;gap:9px;margin-bottom:22px;flex-wrap:wrap}

/* ------------------------------------------------- files and downloads -- */
.file{display:flex;align-items:center;gap:15px;padding:15px 17px;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;margin-bottom:11px;flex-wrap:wrap}
.file .who{flex:1;min-width:180px}
.file .nm{font:600 16px var(--sans);color:var(--text);word-break:break-word}
.file .meta{font-size:13px;color:var(--dim);margin-top:3px}
.file a.get{padding:9px 17px;background:var(--gold);color:#17190F;border-radius:6px;
  text-decoration:none;font:600 14px var(--sans)}
.file a.get.ghost{background:none;color:var(--dim);border:1px solid var(--line)}
.file a.get.ghost:hover{color:var(--text);border-color:var(--gold-dim)}
.thumb{flex:0 0 auto;width:74px;height:60px;border-radius:7px;overflow:hidden;background:#0D100B;
  border:1px solid var(--line);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.kind{font:600 12px var(--mono);color:var(--dim);letter-spacing:.06em}
.file.compact{gap:10px;padding:8px 11px;margin-bottom:7px}
.file.compact .nm{font-size:13px}
.file.compact .meta{font-size:12px;margin-top:1px}
.thumb.sm{width:48px;height:40px;border-radius:5px}
.empty{color:var(--dim);padding:26px;border:1px dashed var(--line);border-radius:9px;
  text-align:center}

/* -------------------------------------------------------------- report -- */
.form{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:20px}
.form label{display:block;font:600 12px var(--sans);letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin:16px 0 6px}
.form label:first-of-type{margin-top:0}
.form input,.form textarea{width:100%;padding:10px 12px;background:var(--ink);color:var(--text);
  border:1px solid var(--line);border-radius:7px;font:15px var(--sans)}
.form textarea{min-height:170px;resize:vertical;line-height:1.6}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--gold-dim)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{flex:1 1 150px;padding:11px;background:var(--ink);color:var(--dim);
  border:1px solid var(--line);border-radius:8px;font:600 14px var(--sans);cursor:pointer}
.pick button.on{background:var(--raised);color:var(--text);border-color:var(--gold)}
.formfoot{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}

/* ---------------------------------------------------------------- news -- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:17px 19px;
  margin-bottom:12px}
.entry .when{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint)}
.entry h3{font:600 18px/1.3 var(--carve);letter-spacing:.02em;margin:4px 0 8px;color:var(--text);
  text-wrap:balance}
.entry .det{color:var(--dim);font-size:13.5px}
.entry .det span{display:inline-block;margin-right:14px}
.entry details{margin-top:9px}
.entry summary{cursor:pointer;color:var(--dim);font-size:13px}
.entry details ul{margin:8px 0 0;padding-left:20px;color:var(--faint);font:12.5px var(--mono)}


/* --------------------------------------------------------------- inbox -- */
.note{display:flex;gap:14px;align-items:flex-start;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:11px}
.note.done{opacity:.55}
.note .kind{flex:0 0 auto;font:600 10px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;margin-top:2px}
.note .kind.bug{background:rgba(192,90,78,.16);color:var(--fail)}
.note .kind.idea{background:rgba(201,162,75,.16);color:var(--gold)}
.note .mid{flex:1;min-width:0}
.note .t{font:600 16px var(--sans);word-break:break-word}
.note .d{color:var(--dim);font-size:13.5px;margin-top:4px;white-space:pre-wrap}
.note .m{color:var(--faint);font-size:12px;margin-top:7px}
.note .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
@media(max-width:560px){.note{flex-direction:column;gap:8px}}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <img src="/logo.png" alt="" width="82" height="82" style="display:block;margin:0 auto 14px;border-radius:14px">
    <h1>The Works</h1>
    <p>Discord decides who gets in here, the same as it decides who gets into
      the game. No second password to pass around.</p>
    <a class="discord big" id="gatediscord" href="/auth/discord">Sign in with Discord</a>
    <!--
      There is no password on this door any more. Discord roles decide who gets
      in here exactly as they decide who gets into the game, so a second secret
      that has to be passed around by hand is one more thing to leak.

      The box below exists only until Discord is configured, because otherwise
      the one person who could configure it cannot get in to do it.
    -->
    <div id="pwbox" hidden>
      <p class="said" style="margin:0 0 12px">Discord sign in is not set up on
        this server yet.</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="server password">
      <button class="enter" id="go">Enter</button>
    </div>
    <div class="err" id="err"></div>
    <p class="backhome"><a href="/">Back to thornswood.net</a></p>
  </div>
</div>

<div id="shell">
  <nav>
    <a class="brand" href="/hub"><img src="/logo.png" alt="" width="22" height="22">Thornswood</a>
    <a class="backout" href="/">&larr; the public site</a>
    <div id="tabs"></div>
    <div class="sep" id="whoami"></div>
  </nav>
  <main><div class="wrap" id="page"></div></main>
</div>

<script>
/*
  One page, real addresses. Every section is its own URL, so /downloads can be
  sent to somebody and it opens the downloads page, the back button works, and
  a link inside a document can point at /help rather than "third thing on the
  left". The server hands the same file to every address and this reads the
  address and draws that section.

  Two tiers. The password gets you in; Discord makes you an admin. The server
  decides which is which and simply does not send what you may not see, so the
  page only has to decide what to draw, never what to hide.
*/

/* ---------------------------------------------------------------- state -- */
var S = {
  me:{member:false,admin:false,name:''}, titles:{}, level:{},
  docs:{}, boards:{}, results:{}, files:[], uploads:[], inbox:[], linked:[],
  sessions:[],
  news:{news:[]}, invite:'', at:'home', editing:false, discord:false
};

var ROUTES = {
  '/hub':'home',
  '/uploads':'uploads', '/linked':'linked', '/sessions':'sessions', '/inbox':'inbox'
};
var PATHS = {};
Object.keys(ROUTES).forEach(function (u) { PATHS[ROUTES[u]] = u; });

var BOARDKEYS = []; /* hub no longer edits issue boards (#433 trim) */
var isBoard = function (k) { return BOARDKEYS.indexOf(k) >= 0; };

var ABOUT = {
  uploads:     'Staff approve the queue and remove live gallery shots. Send and browse pictures on /gallery.',
  inbox:       'Bugs and ideas sent in from the public report page.',
  linked:      'Everybody who has linked a Discord account to a copy of the game.',
  sessions:    'One card a person, newest first by when they last played. ' +
               'Open one for every session they have had, with its logs and ' +
               'what they said in it.'
};

/* Hub trimmed (#433): Gallery, Sessions, Linked Accounts, Inbox only.
   Issue boards and other work pages left the hub. No site theme/appearance prefs. */
var GROUPS = [
  { label:'',     keys:['home'] },
  { label:'Hub',  keys:['uploads','sessions','linked','inbox'] }
];

var el = function (id) { return document.getElementById(id); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
};
function label(k) {
  if (k === 'home') return 'Home';
  if (k === 'uploads') return 'Gallery';
  if (k === 'inbox') return 'Inbox';
  if (k === 'linked') return 'Linked accounts';
  if (k === 'sessions') return 'Play sessions';
  return S.titles[k] || k;
}
function maySee(k) {
  if (k === 'home') return true;
  return S.level[k] === 'admin' ? S.me.admin : true;
}

function api(path, opts) {
  opts = opts || {};
  opts.credentials = 'same-origin';
  return fetch(path, opts);
}

function remember(k, v) {
  try {
    if (v === undefined) return localStorage.getItem('tw:' + k) || '';
    localStorage.setItem('tw:' + k, v);
  } catch (e) { return ''; }
  return v;
}

/* Markdown inside a table cell. Short things stay on one line; anything with a
   fenced block or a line break is a small document. */
function cellHtml(v) {
  var s = String(v == null ? '' : v);
  if (!s) return '';
  // breaks on, for cells only: somebody typing two lines into a box means two
  // lines, and asking them for a blank line between every one is a rule nobody
  // will remember.
  if (/```|\n/.test(s)) return '<div class="mdc">' + marked.parse(s, { breaks: true }) + '</div>';
  return '<div class="mdc">' + marked.parseInline(s) + '</div>';
}

/* ------------------------------------------------------------- sign in -- */
el('go').onclick = signIn;
el('pw').onkeydown = function (e) { if (e.key === 'Enter') signIn(); };


function signIn() {
  var pw = el('pw').value;
  el('err').textContent = '';
  api('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: pw })
  }).then(function (r) {
    if (!r.ok) { el('err').textContent = 'Not that one.'; return; }
    start();
  }).catch(function () { el('err').textContent = 'Could not reach the server.'; });
}

/* --------------------------------------------------------------- route -- */
function keyFor(pathname) {
  var clean = String(pathname || '/').replace(/\/+$/, '').toLowerCase() || '/';
  return ROUTES[clean] || 'home';
}

function go(key, push) {
  if (!maySee(key)) key = 'home';
  S.at = key;
  S.editing = false;
  if (push !== false && PATHS[key]) history.pushState({}, '', PATHS[key]);
  document.title = key === 'home' ? 'Thornswood' : label(key) + ' · Thornswood';
  draw();
  var m = document.querySelector('main');
  if (m) m.scrollTop = 0;
}

window.onpopstate = function () { go(keyFor(location.pathname), false); };

document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('a') : null;
  if (!a || a.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey) return;
  var href = a.getAttribute('href') || '';
  if (!/^\//.test(href) || /^\/(file|up|api|auth)\//.test(href)) return;
  var clean = href.split('?')[0].replace(/\/+$/, '').toLowerCase() || '/';
  if (!ROUTES[clean]) return;
  e.preventDefault();
  go(ROUTES[clean]);
});

/* ---------------------------------------------------------------- boot -- */
function start() {
  api('/api/all').then(function (r) {
    if (!r.ok) throw 0;
    return r.json();
  }).then(function (d) {
    S.me = d.me || S.me;
    S.titles = d.titles; S.level = d.level || {};
    S.docs = d.docs || {}; S.boards = d.boards || {};
    S.results = d.results || {}; S.files = d.files || [];
    S.uploads = d.uploads || []; S.inbox = d.inbox || [];
    S.linked = d.linked || []; S.invite = d.invite || '';
    S.sessions = d.sessions || [];
    S.news = d.news || { news: [] };
    el('gate').style.display = 'none';
    el('shell').style.display = 'grid';
    chrome();
    go(keyFor(location.pathname), false);
  }).catch(function () { el('gate').style.display = 'grid'; });
}

function refresh() {
  return api('/api/all').then(function (r) { return r.json(); }).then(function (d) {
    S.docs = d.docs || {}; S.boards = d.boards || {};
    S.results = d.results || {}; S.files = d.files || [];
    S.uploads = d.uploads || []; S.inbox = d.inbox || [];
    S.linked = d.linked || []; S.sessions = d.sessions || [];
  }).catch(function () { });
}

function chrome() {
  var out = '';
  GROUPS.forEach(function (g) {
    var keys = g.keys.map(function (u) { return ROUTES['/' + u] || u; })
                     .filter(function (k) { return maySee(k); });
    if (!keys.length) return;
    if (g.label) out += '<div class="group">' + esc(g.label) + '</div>';
    keys.forEach(function (k) {
      out += '<a class="tab" data-k="' + k + '" href="' + PATHS[k] + '">' + esc(label(k)) +
             (S.level[k] === 'admin' ? '<span class="key">admin</span>' : '') + '</a>';
    });
  });
  el('tabs').innerHTML = out;

  el('whoami').innerHTML = S.me.admin
    ? '<div class="me">Signed in as <b>' + esc(S.me.name || 'admin') + '</b><br>admin</div>' +
      '<button class="out" id="out">sign out</button>'
    : '<a class="discord ghost" href="/auth/discord?back=' +
      encodeURIComponent(location.pathname) + '">Sign in with Discord</a>' +
      '<button class="out" id="out">sign out</button>';
  if (S.invite) {
    el('whoami').insertAdjacentHTML('afterbegin',
      '<a class="discord" href="' + esc(S.invite) + '" target="_blank" ' +
      'style="font-size:13px;padding:7px 12px">Thornswood Discord</a>');
  }
  el('out').onclick = function () {
    api('/api/logout', { method:'POST' }).then(function () { location.href = '/'; });
  };
}

/* ------------------------------------------------------------ getting in -- */
/* These two lived inside the <style> block, which meant the browser read them
   as broken CSS and threw them away. drawLink and drawLinked did not exist at
   all, so clicking either tab left whatever was already on the screen there. */
function drawLink() {
  el('page').innerHTML = head() +
    '<div class="doc">' + marked.parse(
      'Getting into Thornswood goes through Discord. Not for the sake of ' +
      'another login: it means one list decides who is allowed in, and that ' +
      'list is the Discord server everybody is already in.\n\n' +
      '## How it works\n\n' +
      '1. Open the launcher and press **Connect Discord** on the main page.\n' +
      '2. Your browser opens, you say yes, and it closes itself.\n' +
      '3. The launcher remembers. You do not do this again.\n\n' +
      'From then on every time you press Play, the launcher checks with the ' +
      'site that your Discord account is still in the server and still allowed ' +
      'in, and only then gets what it needs to connect you.\n\n' +
      '## What that means\n\n' +
      '- The server password is not written down anywhere on your machine any ' +
      'more. Nobody can pass it on, because nobody has it.\n' +
      '- Leaving the Discord, or being banned in it, stops the next launch. ' +
      'There is no second list to remember to update.\n' +
      '- A ban is a ban everywhere at once: the game, this site, and the chat.\n\n' +
      '## If the launcher says you are not linked\n\n' +
      'Press Connect Discord again. If it says you are not in the Discord, ' +
      (S.invite ? '[join it](' + S.invite + ') and try again.'
                : 'ask somebody for an invite and try again.') + '\n\n' +
      'If it says you have no role yet, say so in the Discord and somebody ' +
      'will sort it. It takes a moment.\n\n' +
      'If it says you are banned, you know why.'
    ) + '</div>' +
    (S.invite ? '<div style="margin-top:22px"><a class="discord" href="' +
      esc(S.invite) + '" target="_blank">Open the Thornswood Discord</a></div>' : '');
  dressCode();
}

/* ------------------------------------------------------ linked accounts -- */
function drawLinked() {
  var list = S.linked.slice().sort(function (a, b) { return (b.seen || 0) - (a.seen || 0); });
  var out = head();
  if (!list.length) {
    out += '<div class="empty">Nobody has linked a Discord account yet.</div>';
  } else {
    out += '<div class="tablewrap"><table class="board"><thead><tr>' +
      '<th>Name</th><th>Discord id</th><th>Roles</th><th>First linked</th>' +
      '<th>Last played</th></tr></thead><tbody>';
    list.forEach(function (u) {
      out += '<tr>' +
        '<td data-label="Name"><div class="cell">' + esc(u.name || u.handle || '') + '</div></td>' +
        '<td data-label="Discord id"><div class="cell"><code>' + esc(u.id) + '</code></div></td>' +
        '<td data-label="Roles"><div class="cell">' + esc((u.roles || []).join(', ')) + '</div></td>' +
        '<td data-label="First linked"><div class="cell">' +
          (u.first ? new Date(u.first).toLocaleDateString() : '') + '</div></td>' +
        '<td data-label="Last played"><div class="cell">' +
          (u.played ? new Date(u.played).toLocaleString() : 'never') + '</div></td>' +
      '</tr>';
    });
    out += '</tbody></table></div>';
  }
  out += '<p class="lede" style="margin-top:20px">Banning somebody is a Discord ' +
    'job, not a job here. Give them the <b>Banned</b> role, or remove them from ' +
    'the server, and the next time they press Play they are turned away. Nothing ' +
    'on this page needs touching.</p>';
  el('page').innerHTML = out;
}

/* ------------------------------------------------------- play sessions -- */
/*
  One row a session, as the launcher reported it: a start when the game was
  started and an end when it closed. A row with no end is somebody still
  playing, or a machine that never got the end out. That is open, not broken,
  and the page says so in those words.

  The note is the sheet part. A staff member types what was tested against the
  session it happened in, and it saves on its own.
*/
function forMins(m) {
  var n = Number(m) || 0;
  if (n < 1) return 'under a minute';
  if (n < 60) return Math.round(n) + ' min';
  var h = n / 60;
  return (h < 10 ? h.toFixed(1) : String(Math.round(h))) + ' hours';
}
function sessionAt(s) { return s.start || s.end || 0; }
/* No end means the game has not closed, or the closing word never reached the
   site. Either way the session is open and the page says open. */
function sessionOpen(s) { return !s.end; }

/*
  The week's totals, counting only the sessions that reported an end.

  A row with no end carries no minutes, so counting it raised the session and
  the people counts while the hours stayed where they were, and the three
  numbers on one screen disagreed with each other. Open rows are counted on
  their own and said separately, which is the honest shape: this is what was
  played, and this many rows never reported an end.
*/
function sessionTotals(list) {
  var week = Date.now() - 7 * 86400000;
  var n = 0, mins = 0, open = 0, who = {};
  list.forEach(function (s) {
    if (sessionAt(s) < week) return;
    if (sessionOpen(s)) { open++; return; }
    n++;
    mins += Number(s.minutes) || 0;
    if (s.who) who[s.who] = true;
  });
  return { n:n, mins:mins, open:open, people:Object.keys(who).length };
}

/*
  One entry a person, newest first by when they last played.

  Total playtime counts only the sessions that reported an end, for the same
  reason the week's totals do: a row with no end carries no minutes, and
  counting it would make the hours disagree with the session count on the same
  card. Open rows are counted separately and said separately.

  The name is taken from the newest row that carries one. The list is sorted
  newest first before this runs, so the first one wins, and somebody who
  changed their Discord name shows the name they have now rather than the one
  they had on their first session.
*/
function sessionPeople(list) {
  var by = {}, order = [];
  list.forEach(function (s) {
    var k = String(s.who || '');
    if (!k) return;
    if (!by[k]) { by[k] = { who:k, name:'', mins:0, last:0, open:0, rows:[] }; order.push(k); }
    var p = by[k];
    if (!p.name && s.name) p.name = s.name;
    if (sessionOpen(s)) p.open++; else p.mins += Number(s.minutes) || 0;
    var at = sessionAt(s);
    if (at > p.last) p.last = at;
    p.rows.push(s);
  });
  return order.map(function (k) { return by[k]; })
              .sort(function (a, b) { return b.last - a.last; });
}

/*
  One session's logs, behind a button.

  Not fetched with the page. Most sessions are never opened and a log set is
  up to a megabyte, so the page would carry tens of megabytes nobody reads.
  One request per session, when somebody asks for it.
*/
function bytesFor(n) {
  var b = Number(n) || 0;
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

/* Straight to a file on the person's machine, made in the browser out of text
   it already has. No round trip, and it works for the server slice too, which
   was never a file anywhere. */
function downloadText(name, text) {
  try {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      try { URL.revokeObjectURL(a.href); document.body.removeChild(a); } catch (e) { }
    }, 0);
  } catch (e) { saidNow('could not download'); }
}

/* Every log kept for this session, so the download names cannot collide and
   the click handlers have something to read. Keyed by session id. */
var LOGS = {};

function logFileHtml(sid, name, text) {
  return '<details class="logf">' +
    '<summary>' +
      '<span class="chev">&#9654;</span>' +
      '<span class="nm">' + esc(name) + '</span>' +
      '<span class="sz">' + esc(bytesFor(text.length)) + '</span>' +
      '<button class="btn small dl" data-s="' + esc(sid) + '" data-n="' + esc(name) + '">Download</button>' +
    '</summary>' +
    '<pre>' + esc(text) + '</pre>' +
  '</details>';
}

/*
  What the launcher itself was unhappy about, with MORE than its own window
  shows.

  The launcher shows the sentence and a Fix button, which is the right amount
  in front of somebody who just wants to play. The Issue behind it always
  carried more: which plugin, whether the file is absent or merely the wrong
  bytes, and the size, CRC and manifest index the server expected. That detail
  is noise on the launcher and is the whole point here, where the person is
  not in the room to be asked.
*/
function issuesHtml(row) {
  var issues = row.issues || [];
  var checks = row.checks || [];
  if (!issues.length && !checks.length) return '';

  var blocking = issues.filter(function (i) { return i.blocking; }).length;
  var out = '<div class="issues"><div class="ihead">' +
    'The launcher at the end of this session: ' +
    (blocking ? blocking + ' blocker(s)' : 'no blockers') +
    (issues.length - blocking ? ', ' + (issues.length - blocking) + ' warning(s)' : '') +
    (checks.length ? ', ' + checks.length + ' check(s) not passing' : '') +
    '</div>';

  issues.forEach(function (i) {
    var d = [];
    if (i.plugin) d.push(i.plugin);
    if (i.absent) d.push('not in Data at all');
    else if (i.plugin) d.push('the file is there and the bytes are not the server\'s');
    if (i.wantSize) d.push('server wants ' + Number(i.wantSize).toLocaleString() + ' bytes');
    if (i.wantCrc) d.push('crc ' + (i.wantCrc >>> 0).toString(16));
    if (i.wantIndex) d.push('manifest index ' + i.wantIndex);
    out += '<div class="i ' + (i.blocking ? 'blk' : 'wrn') + '">' +
      '<span class="t">' + (i.blocking ? '<span class="pill fail">blocker</span> ' :
                                         '<span class="pill warn">warning</span> ') +
      esc(i.text) + '</span>' +
      (d.length ? '<span class="d">' + esc(d.join('  ')) + '</span>' : '') +
    '</div>';
  });

  checks.forEach(function (c) {
    out += '<div class="i wrn">' +
      '<span class="t"><span class="pill warn">check</span> ' + esc(c.name) + '</span>' +
      (c.detail ? '<span class="d">' + esc(c.detail) + '</span>' : '') +
    '</div>';
  });

  return out + '</div>';
}

function drawLogs(box, sid, d) {
  var out = '';

  /* The row this belongs to, for the launcher's own blockers and warnings,
     which came with the logs and live on the row rather than in the log set. */
  var row = null;
  for (var i = 0; i < S.sessions.length; i++) {
    if (S.sessions[i].session === sid) { row = S.sessions[i]; break; }
  }

  /* The line that decided the colour, first, because it is the reason
     somebody opened this. */
  if (row && row.trouble && row.troubleLine) {
    out += '<div class="issues"><div class="ihead">' +
      (row.troubleAt === 'warn' ? 'Why this session is yellow' : 'Why this session is red') +
      '</div><div class="i ' + (row.troubleAt === 'warn' ? 'wrn' : 'blk') + '">' +
      '<span class="t">' + esc(row.trouble) + '</span>' +
      '<span class="d">' + esc(row.troubleFile || '') + '</span>' +
      '<span class="d">' + esc(row.troubleLine) + '</span>' +
    '</div></div>';
  }

  if (row) out += issuesHtml(row);

  /* Where this came from, because the point of keeping it is to be able to
     say so later. A second set having been tried is worth shouting about. */
  if (d.sent) {
    /*
      WHAT KEEPING IS FOR, WHEN YOU CAN ALREADY DOWNLOAD, which is a fair
      question and the button did not answer it.

      Download gives you a copy on your own machine. That copy is a plain file:
      anybody could have edited it, and it carries nothing that says otherwise.
      Keeping holds the copy ON THE SERVER past the one year everything else
      ages out at, and that is the copy with the checksum, the Discord id taken
      off the signed ticket, and the refusal to be written over. It is the one
      worth pointing at when somebody disputes what happened.

      So: download to read it or send it to somebody. Keep so that in fourteen
      months the authoritative copy is still there to check it against.
    */
    out += '<div class="prov">' +
      '<b>sent by</b> ' + esc(d.sent.who || 'unknown') +
      '  <b>at</b> ' + esc(d.sent.at ? new Date(d.sent.at).toLocaleString() : 'unknown') +
      '  <b>size</b> ' + esc(bytesFor(d.sent.bytes)) +
      (d.sent.resent
        ? '<br><span class="warn">A further set was sent for this session ' +
          esc(d.sent.resent) + ' time(s) and refused. The first set is what is kept.</span>'
        : '') +
      '<br><span class="said">Downloading gives you a copy that anybody could ' +
      'have edited. This one carries a checksum and the id off the signed ticket, ' +
      'and cannot be written over. Everything ages out after a year unless it is held.</span>' +
      '<div style="margin-top:9px">' +
        '<button class="btn small keepBtn' + (d.keep ? ' on' : '') + '" ' +
          'data-s="' + esc(d.session) + '" data-w="' + esc(d.sent.who || '') + '">' +
          (d.keep ? 'Held, stop holding it' : 'Hold this past the year') + '</button>' +
      '</div>' +
      '</div>';
  }

  var names = Object.keys(d.client || {});
  LOGS[sid] = {};
  names.forEach(function (n) { LOGS[sid][n] = d.client[n]; });

  if (names.length) {
    names.forEach(function (n) { out += logFileHtml(sid, n, d.client[n]); });
  } else {
    out += '<div class="none">No logs came from that machine. The launcher sends them ' +
      'as the game closes, so a session from before that was added, or one whose ' +
      'launcher never came back, has none.</div>';
  }

  var srv = (d.server || []).join('\n');
  if (srv) {
    var sn = 'server-' + (d.channel === 'dev' ? 'dev' : 'main') + '.log';
    LOGS[sid][sn] = srv;
    out += logFileHtml(sid, sn, srv);
  } else {
    out += '<div class="none">Nothing in the game server\'s log for that window' +
      (d.serverWhy ? ': ' + esc(d.serverWhy) : '.') + '</div>';
  }

  /*
    WHAT THEY SAID, IN THIS SESSION, here with the rest of it.

    This was a page of its own: the whole chat log, a day at a time, for
    everybody at once. Answering "what did this person do" meant reading a
    session here, working out when it ran, going to that page, picking the
    day, filtering by name, and holding the two together in your head. Patrick
    on 22 September: put it under each person, split per session. The server
    does the splitting, by profile number and this session's own window, so
    what arrives is already only this person in only this session.

    It is a details block like the log files, and it downloads like them, so
    a report is one folder of files from one place. Slash commands are kept
    and marked, because somebody typed those too and nobody else in the room
    saw them. A line marked unproven came from a connection that could not
    show a signed token for the profile it claimed: worth reading, not worth
    hanging anybody on. Voice is not recorded, only text.
  */
  var chat = d.chat || [];
  if (chat.length) {
    /* The same lines as plain text, so Download gives a readable file rather
       than the page's markup. Registered under a name that says whose and
       from when, because it lands in somebody's downloads folder beside the
       logs and has to still make sense there. */
    var cn = 'chat-' + (row && row.profile ? row.profile : 'unknown') + '.txt';
    LOGS[sid][cn] = chat.map(function (l) {
      return new Date(l.at).toLocaleString() +
        (l.kind === 'command' ? '  [command]' : '') +
        (l.proven ? '' : '  [unproven]') +
        (l.mode ? '  [' + l.mode + ']' : '') +
        '  ' + (l.name || '(no name)') + ': ' + (l.text || '');
    }).join('\n');

    out += '<details class="logf">' +
      '<summary>' +
        '<span class="chev">&#9654;</span>' +
        '<span class="nm">What they said</span>' +
        '<span class="sz">' + chat.length + ' line(s)</span>' +
        '<button class="btn small dl" data-s="' + esc(sid) + '" data-n="' + esc(cn) + '">Download</button>' +
      '</summary>' +
      '<div class="tablewrap"><table class="board"><thead><tr>' +
        '<th>When</th><th>Said</th></tr></thead><tbody>';
    chat.forEach(function (l) {
      out += '<tr' + (l.kind === 'command' ? ' class="warn"' : '') + '>' +
        '<td data-label="When"><div class="cell">' +
          esc(new Date(l.at).toLocaleTimeString()) +
          (l.proven ? '' : '<div class="said"><span class="pill fail">unproven</span></div>') +
        '</div></td>' +
        '<td data-label="Said"><div class="cell">' +
          (l.kind === 'command' ? '<span class="pill warn">command</span> ' : '') +
          esc(l.text || '') +
          (l.mode ? '<div class="said">' + esc(l.mode) + '</div>' : '') +
        '</div></td>' +
      '</tr>';
    });
    out += '</tbody></table></div></details>';
  } else {
    out += '<div class="none">' +
      (d.chatWhy
        ? esc(d.chatWhy)
        : 'They said nothing in this session. Voice is not recorded, only text.') +
      '</div>';
  }

  box.innerHTML = out;

  each(box, 'button.dl', function (b) {
    b.onclick = function (ev) {
      /* Inside a summary, so a plain click would also toggle the details. */
      ev.preventDefault();
      ev.stopPropagation();
      var s = b.dataset.s, n = b.dataset.n;
      var text = (LOGS[s] || {})[n];
      if (text == null) { saidNow('nothing to download'); return; }
      downloadText(s.slice(0, 8) + '-' + n, text);
    };
  });

  /* Holding this one past the retention rule. Beside the provenance, because
     that is what it is about: the copy on the server outliving the year, not
     anything to do with the session itself. */
  each(box, 'button.keepBtn', function (b) {
    b.onclick = function () {
      var on = !b.classList.contains('on');
      b.disabled = true;
      saidNow('saving');
      api('/api/session-keep', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: b.dataset.s, who: b.dataset.w, keep: on })
      }).then(function (r) {
        b.disabled = false;
        saidNow(r.ok ? 'saved' : 'did not save');
        if (!r.ok) return;
        b.classList.toggle('on', on);
        b.textContent = on ? 'Held, stop holding it' : 'Hold this past the year';
        S.sessions.forEach(function (s) {
          if (s.session === b.dataset.s) s.keep = on;
        });
      }).catch(function () { b.disabled = false; saidNow('did not save'); });
    };
  });
}

/* The sessions of one person, as the table this page used to be. */
function sessionTable(rows) {
  var out = '<div class="tablewrap"><table class="board"><thead><tr>' +
    '<th>Character</th><th>Build</th><th>Where</th><th>Started</th>' +
    '<th>Stopped</th><th>For</th></tr></thead><tbody>';
  rows.forEach(function (s) {
    var open = sessionOpen(s);
    /*
      One session red, never the whole card. A person who had one bad evening
      out of forty is not a red person, and colouring their card would bury
      the session that actually needs reading among thirty-nine that do not.
      The marker is set once when the logs arrive, by reading them, so nobody
      has to open anything for it to be known.
    */
    out += '<tr' + (s.trouble ? ' class="' + (s.troubleAt === 'warn' ? 'warn' : 'bad') + '"' : '') + '>' +
      '<td data-label="Character"><div class="cell">' +
        (s.trouble
          ? (s.troubleAt === 'warn'
              ? '<span class="pill warn">would not play</span>'
              : '<span class="pill fail">went wrong</span>') +
            '<div class="said">' + esc(s.trouble) + '</div>'
          : '') +
        (s.profile ? '<code>' + esc(s.profile) + '</code>' : 'none picked') + '</div></td>' +
      '<td data-label="Build"><div class="cell">' + esc(s.version || 'not said') + '</div></td>' +
      /*
        Where they actually GOT TO, not which feed the launcher follows, and
        as precisely as the row allows.

        A character is picked at the game's main menu, so a session with no
        character never reached either world: it got no further than the
        launcher and the menu in front of it. Calling that "main" put a session
        on the live server that was never on it, which is exactly the kind of
        thing somebody would later be asked to account for.

        Three answers, most precise first. Reached a world: main or dev.
        Did not, but the build is known: Main Launcher or Dev Launcher. Did
        not and the build is not known either, which is a row from a launcher
        that sent no channel at all: Launcher.
      */
      '<td data-label="Where"><div class="cell">' +
        (s.profile
          ? (s.channel === 'dev'
              ? '<span class="pill left">dev</span>'
              : '<span class="pill pass">main</span>')
          : (s.channel === 'dev'
              ? '<span class="pill skip">Dev Launcher</span>' +
                '<div class="said">never picked a character, so never reached the dev world</div>'
              : s.channel === 'main'
                ? '<span class="pill skip">Main Launcher</span>' +
                  '<div class="said">never picked a character, so never reached the main world</div>'
                : '<span class="pill skip">Launcher</span>' +
                  '<div class="said">never picked a character, and the build was not reported</div>')
          ) + '</div></td>' +
      '<td data-label="Started"><div class="cell">' +
        (s.start
          ? esc(new Date(s.start).toLocaleString())
          : '<span class="pill left">start never seen</span>' +
            '<div class="said">the launcher was replaced or restarted while ' +
            'they were playing, so only the end reached us</div>') + '</div></td>' +
      '<td data-label="Stopped"><div class="cell">' +
        (open
          ? '<span class="pill left">no end reported</span>'
          : esc(new Date(s.end).toLocaleString()) +
            (s.why === 'update' ? '<div class="said">closed for an update</div>' : '')) +
        '</div></td>' +
      '<td data-label="For"><div class="cell">' +
        (open ? 'open' : esc(forMins(s.minutes))) + '</div></td>' +
    '</tr>' +
    /* The logs sit in a row of their own under the session, spanning the
       table, so the columns above stay readable and a long log does not
       stretch a cell. */
    '<tr class="morerow"><td colspan="6">' +
      '<div class="moreWrap">' +
        '<button class="btn small moreBtn" data-s="' + esc(s.session) + '" data-w="' + esc(s.who) + '">More details</button>' +
        /* Kept as evidence moved INSIDE More details, beside the provenance
           it belongs to. It was a second button on every row and it earned
           nothing there: it is not about this session, it is about the copy
           on the server outliving the retention rule, and that only means
           anything once somebody is reading the logs. */
        (s.keep
          ? '<span class="pill warn">held</span>' +
            (s.keptBy ? '<span class="keptBy">by ' + esc(s.keptBy) + '</span>' : '')
          : '') +
        '<div class="logs" hidden></div>' +
      '</div>' +
    '</td></tr>';
  });
  return out + '</tbody></table></div>';
}

/* The More details buttons on whatever is currently drawn. Called after every
   draw, and again each time a card is opened, because a card's table is in
   the page from the start and only hidden by details. */
function wireMore(root) {
  each(root, 'button.moreBtn', function (b) {
    if (b.dataset.wired) return;
    b.dataset.wired = '1';
    b.onclick = function () {
      var box = b.parentNode.querySelector('.logs');
      if (!box) return;
      /* Second press folds it away rather than asking again. */
      if (!box.hidden) { box.hidden = true; b.textContent = 'More details'; return; }
      if (box.dataset.got) { box.hidden = false; b.textContent = 'Hide details'; return; }

      b.disabled = true;
      b.textContent = 'Fetching...';
      api('/api/session-logs?session=' + encodeURIComponent(b.dataset.s) +
          '&who=' + encodeURIComponent(b.dataset.w))
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (d) {
          drawLogs(box, b.dataset.s, d);
          box.dataset.got = '1';
          box.hidden = false;
          b.disabled = false;
          b.textContent = 'Hide details';
        })
        .catch(function (e) {
          box.innerHTML = '<div class="none">Could not fetch the logs' +
            (e === 404 ? ': the site has no record of that session.' : '.') + '</div>';
          box.hidden = false;
          b.disabled = false;
          b.textContent = 'More details';
        });
    };
  });
}

/*
  What the page is filtered to. Held outside the draw so it survives one, and
  so a filter set at the top and a search set inside one person's card are the
  same idea rather than two.

  ONE PERSON'S SEARCH IS ITS OWN. A card search is kept per Discord id in
  `mine`, because looking through one person's forty sessions is a different
  question from looking across everybody, and typing in one should not empty
  somebody else's card.
*/
var SFIND = { q: '', show: 'all', chan: 'all', sort: 'recent', mine: {} };

/* Does this session match what is being asked for? Used by both the global
   filter and a card's own, with the card passing its own text. */
function sessionMatches(s, q, show, chan) {
  if (show === 'bad'   && s.troubleAt !== 'bad')  return false;
  if (show === 'warn'  && s.troubleAt !== 'warn') return false;
  if (show === 'any'   && !s.trouble)             return false;
  if (show === 'clean' && s.trouble)              return false;
  if (show === 'open'  && !sessionOpen(s))        return false;
  if (show === 'kept'  && !s.keep)                return false;

  if (chan === 'main' && !(s.profile && s.channel === 'main')) return false;
  if (chan === 'dev'  && !(s.profile && s.channel === 'dev'))  return false;
  if (chan === 'stuck' && s.profile)                           return false;

  if (q) {
    var hay = [
      s.name, s.who, s.profile, s.version, s.channel,
      s.trouble, s.troubleLine, s.troubleFile,
      s.start ? new Date(s.start).toLocaleString() : '',
      s.end ? new Date(s.end).toLocaleString() : ''
    ].join(' ').toLowerCase();
    if (hay.indexOf(q.toLowerCase()) < 0) return false;
  }
  return true;
}

function drawSessions() {
  var all = S.sessions.slice().sort(function (a, b) { return sessionAt(b) - sessionAt(a); });
  var list = all.filter(function (s) {
    return sessionMatches(s, SFIND.q, SFIND.show, SFIND.chan);
  });
  var t = sessionTotals(list);
  var people0 = sessionPeople(list);

  /*
    The controls, shaped like the questions actually asked of this page:
    who is this, what went wrong, and which build was it on. All three narrow
    the same list, and the count under them says what is being hidden so a
    filter left on is never mistaken for an empty server.
  */
  var out = head() +
    '<div class="bar" style="margin-bottom:16px">' +
      '<input type="search" id="sfind" value="' + esc(SFIND.q) + '" ' +
        'placeholder="A name, an id, a character, a build, anything in a fault">' +
      '<select id="sshow" aria-label="Show">' +
        [['all','Everything'],['any','Anything that went wrong'],['bad','Crashed only'],
         ['warn','Would not play only'],['clean','Nothing wrong'],['open','Never reported an end'],
         ['kept','Kept as evidence']].map(function (o) {
          return '<option value="' + o[0] + '"' + (SFIND.show === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') +
      '</select>' +
      '<select id="schan" aria-label="Where">' +
        [['all','Anywhere'],['main','Reached main'],['dev','Reached dev'],
         ['stuck','Never reached a world']].map(function (o) {
          return '<option value="' + o[0] + '"' + (SFIND.chan === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') +
      '</select>' +
      '<select id="ssort" aria-label="Sort">' +
        [['recent','Last played'],['most','Most played'],['sessions','Most sessions'],
         ['trouble','Most gone wrong'],['name','Name']].map(function (o) {
          return '<option value="' + o[0] + '"' + (SFIND.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') +
      '</select>' +
      ((SFIND.q || SFIND.show !== 'all' || SFIND.chan !== 'all' || SFIND.sort !== 'recent')
        ? '<button class="btn" id="sreset">Reset</button>' : '') +
    '</div>' +
    '<div class="tally">' +
      '<span class="pill pass">' + t.n + (t.n === 1 ? ' session' : ' sessions') +
        ' in the last seven days</span>' +
      '<span class="pill skip">' + (t.mins < 1 ? 'no time yet' : esc(forMins(t.mins)) + ' of it') + '</span>' +
      (t.open ? '<span class="pill left">' + t.open + ' with no end reported</span>' : '') +
      '<span class="pill left">' + t.people + (t.people === 1 ? ' person' : ' people') + '</span>' +
    '</div>';

  /* What is being hidden, always, because a filter left on and an empty
     server look identical and one of them is alarming. */
  if (list.length !== all.length) {
    out += '<div class="said" style="margin:-8px 0 16px">Showing ' + list.length +
      ' of ' + all.length + ' session(s), across ' + people0.length +
      (people0.length === 1 ? ' person' : ' people') + '.</div>';
  }

  if (!all.length) {
    out += '<div class="empty">Nobody has played yet. A card lands here the ' +
      'moment somebody presses Play, and fills in when they stop.</div>';
  } else if (!list.length) {
    out += '<div class="empty">Nothing matches that. ' + all.length +
      ' session(s) are hidden by the filters above.</div>';
  } else {
    var people = people0;

    /* Most played and most gone wrong are what you want when deciding who to
       talk to; last played is what you want the rest of the time, so it is
       the default. */
    if (SFIND.sort === 'most')          people.sort(function (a, b) { return b.mins - a.mins; });
    else if (SFIND.sort === 'sessions') people.sort(function (a, b) { return b.rows.length - a.rows.length; });
    else if (SFIND.sort === 'name')     people.sort(function (a, b) { return String(a.name || a.who).localeCompare(String(b.name || b.who)); });
    else if (SFIND.sort === 'trouble')  people.sort(function (a, b) {
      var c = function (p) { return p.rows.filter(function (s) { return s.trouble; }).length; };
      return c(b) - c(a);
    });

    out += '<div class="people">';
    people.forEach(function (p) {
      /* This person's own search, so forty sessions can be narrowed without
         touching the page filter or anybody else's card. */
      var mq = SFIND.mine[p.who] || '';
      var rows = mq
        ? p.rows.filter(function (s) { return sessionMatches(s, mq, 'all', 'all'); })
        : p.rows;
      var n = p.rows.length;
      var bad = p.rows.filter(function (s) { return s.troubleAt === 'bad'; }).length;
      var warn = p.rows.filter(function (s) { return s.troubleAt === 'warn'; }).length;
      var kept = p.rows.filter(function (s) { return s.keep; }).length;

      out += '<details class="person"' + (mq ? ' open' : '') + '>' +
        '<summary>' +
          '<span class="pf"><span class="lab">Discord name</span>' +
            '<span class="val nm">' + esc(p.name || 'not linked') + '</span></span>' +
          '<span class="pf"><span class="lab">ID</span>' +
            '<span class="val id">' + esc(p.who) + '</span></span>' +
          '<span class="pf"><span class="lab">Total playtime</span>' +
            '<span class="val hrs">' + (p.mins < 1 ? 'none yet' : esc(forMins(p.mins))) + '</span></span>' +
          '<span class="pf"><span class="lab">Last played</span>' +
            '<span class="val when">' +
              (p.last ? esc(new Date(p.last).toLocaleString()) : 'never') + '</span></span>' +
          '<span class="chev">&#9654;</span>' +
        '</summary>' +
        '<div class="pbody">' +
          '<div class="tally" style="padding:11px 16px 0">' +
            '<span class="pill pass">' + n + (n === 1 ? ' session' : ' sessions') + '</span>' +
            (p.open ? '<span class="pill left">' + p.open + ' with no end reported</span>' : '') +
            (bad ? '<span class="pill fail">' + bad + ' went wrong</span>' : '') +
            (warn ? '<span class="pill warn">' + warn + ' would not play</span>' : '') +
            (kept ? '<span class="pill left">' + kept + ' kept as evidence</span>' : '') +
          '</div>' +
          /* Only worth a search box once there is enough to search. */
          (n > 3
            ? '<div class="bar">' +
                '<input type="search" class="findmine" data-w="' + esc(p.who) + '" ' +
                  'value="' + esc(mq) + '" placeholder="Search this person\'s ' + n + ' sessions">' +
                (mq ? '<button class="btn small clearmine" data-w="' + esc(p.who) + '">Clear</button>' : '') +
              '</div>'
            : '') +
          (rows.length
            ? sessionTable(rows)
            : '<div class="empty" style="padding:22px 0">Nothing of theirs matches that.</div>') +
          (mq && rows.length !== n
            ? '<div class="said" style="padding:0 16px 12px">' + rows.length + ' of ' + n + '</div>'
            : '') +
        '</div>' +
      '</details>';
    });
    out += '</div>';
  }

  out += '<p class="lede" style="margin-top:20px">One card a person, newest ' +
    'first by when they last played. Open one for every session they have had: ' +
    'which character, which build, and where they got to. Where reads Launcher ' +
    'when no character was ever picked, which means the session never reached ' +
    'either world. More details under a session fetches the logs from that ' +
    'machine and the game server\'s own lines for that window. ' +
    'The launcher sends both ends of every session, so a session appears as ' +
    'somebody starts and fills in when they stop. One still open is somebody ' +
    'playing right now, or a machine that never got the closing word out. ' +
    'Total playtime counts only the sessions that reported an end. Nothing ' +
    'here is typed by the person playing.</p>';
  el('page').innerHTML = out;
  wireMore(el('page'));

  /* Redrawn on every keystroke, which is fine: this is a few hundred rows in
     memory and no request goes anywhere. The caret is put back afterwards or
     typing a second letter would jump to the start. */
  var refind = function (id, set) {
    var box = el(id);
    if (!box) return;
    box.oninput = function () {
      var at = box.selectionStart;
      set(box.value);
      drawSessions();
      var again = el(id);
      if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch (e) { } }
    };
  };
  refind('sfind', function (v) { SFIND.q = v; });
  if (el('sshow')) el('sshow').onchange = function () { SFIND.show = this.value; drawSessions(); };
  if (el('schan')) el('schan').onchange = function () { SFIND.chan = this.value; drawSessions(); };
  if (el('ssort')) el('ssort').onchange = function () { SFIND.sort = this.value; drawSessions(); };
  if (el('sreset')) el('sreset').onclick = function () {
    SFIND.q = ''; SFIND.show = 'all'; SFIND.chan = 'all'; SFIND.sort = 'recent';
    drawSessions();
  };

  /* One person's own search. Same shape, kept per Discord id, and the card it
     belongs to is reopened after the redraw because a details element closes
     when its HTML is replaced. */
  each(el('page'), 'input.findmine', function (box) {
    box.oninput = function () {
      var at = box.selectionStart, who = box.dataset.w;
      SFIND.mine[who] = box.value;
      if (!box.value) delete SFIND.mine[who];
      drawSessions();
      each(el('page'), 'input.findmine', function (b2) {
        if (b2.dataset.w !== who) return;
        b2.focus();
        try { b2.setSelectionRange(at, at); } catch (e) { }
      });
    };
  });
  each(el('page'), 'button.clearmine', function (b) {
    b.onclick = function () { delete SFIND.mine[b.dataset.w]; drawSessions(); };
  });
}

/* -------------------------------------------------------- what was said -- */
/*
  There was a page here: the whole chat log, a day at a time, for everybody at
  once, with a day picker, a person box and a words box.

  It is gone. Answering "what did this person do" meant reading a session on
  /sessions, working out when it ran, coming here, picking the day, filtering
  by name, and holding the two together in your head. What people said now
  lives under the person who said it, inside the session they said it in, in
  More details beside that session's own logs, and it downloads with them.
  Decided by Patrick on 22 September.

  The splitting is the server's: chatSlice in site\server.js matches the
  session's profile number and its own window, and /api/session-logs hands
  the lines back with the rest of that session. drawLogs draws them.
*/

/* ---------------------------------------------------------------- draw -- */
function draw() {
  Array.prototype.forEach.call(el('tabs').querySelectorAll('a.tab'), function (a) {
    a.className = 'tab' + (a.dataset.k === S.at ? ' on' : '');
  });
  document.body.className = isBoard(S.at) ? 'wide' : '';
  if (S.at === 'home')    return drawHome();
  if (S.at === 'news')    return drawNews();
  if (S.at === 'uploads') return drawUploads();
  if (S.at === 'report')  return drawReport();
  if (S.at === 'inbox')   return drawInbox();
  if (S.at === 'link')    return drawLink();
  if (S.at === 'linked')  return drawLinked();
  if (S.at === 'sessions') return drawSessions();
  if (isBoard(S.at))      return drawBoard();
  if (S.editing)          return drawEdit();
  drawDoc();
}

function crumb() {
  return '<div class="crumb"><a href="/hub">Thornswood</a> / ' + esc(label(S.at)) +
         ' <span style="float:right"><a href="/">the public site</a></span></div>';
}
function head(extra, noLede) {
  return crumb() +
    '<div class="bar"><h2>' + esc(label(S.at)) +
    (S.level[S.at] === 'admin' ? ' <span class="tagline">admin</span>' : '') + '</h2>' +
    '<span class="said" id="said"></span>' + (extra || '') + '</div>' +
    (ABOUT[S.at] && !noLede ? '<p class="lede">' + esc(ABOUT[S.at]) + '</p>' : '');
}
function saidNow(t) {
  var s = el('said');
  if (!s) return;
  s.textContent = t;
  if (t === 'saved') setTimeout(function () { if (el('said') === s) s.textContent = ''; }, 1600);
}

/* ---------------------------------------------------------------- home -- */
function tallyOf() {
  var n = { pass:0, fail:0, skip:0 };
  Object.keys(S.results).forEach(function (k) {
    var s = (S.results[k] || {}).status;
    if (n[s] !== undefined) n[s]++;
  });
  return n;
}
function rowCount(k) {
  var b = S.boards[k];
  if (!b) return 0;
  var n = 0;
  (b.sections || []).forEach(function (s) { n += (s.rows || []).length; });
  return n;
}
function countFor(k) {
  if (k === 'tests') {
    var t = tallyOf(), done = t.pass + t.fail + t.skip;
    var total = (S.docs.tests || '').split('\n')
      .filter(function (l) { return /^##\s+test\b/i.test(l); }).length;
    return total ? done + ' of ' + total + ' marked' : 'nothing to test yet';
  }
  if (k === 'uploads') return 'see /gallery';
  if (k === 'news')    return (S.news.news || []).length + ' releases';
  if (k === 'report')  return 'takes a minute';
  if (k === 'help')    return 'read me first';
  if (k === 'inbox') {
    var open = S.inbox.filter(function (i) { return i.state === 'new'; }).length;
    return open ? open + ' waiting' : 'nothing waiting';
  }
  if (k === 'link')   return 'Discord decides';
  if (k === 'linked') return S.linked.length + ' linked';
  if (k === 'sessions') {
    var w = sessionTotals(S.sessions);
    return w.n ? w.n + ' in the last seven days' : 'nobody yet';
  }
  var n = rowCount(k);
  return n === 1 ? '1 entry' : n + ' entries';
}
function card(k, lead) {
  if (!maySee(k)) return '';
  return '<a class="card' + (lead ? ' lead' : '') + '" href="' + PATHS[k] + '">' +
    '<div class="t">' + esc(label(k)) +
      (lead ? ' <span class="mark">start here</span>' : '') +
      (S.level[k] === 'admin' ? ' <span class="mark">admin</span>' : '') + '</div>' +
