# GitHub turns off a public repository's scheduled workflows after 60 days
# with no activity in it, and nothing else is ever pushed here. So once a
# month this writes the month into alive.txt and commits it. Written by
# Watch-Outside.ps1 -Export; change it there, not here.
name: Keep the watch scheduled

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Write the month and commit it
        shell: bash
        run: |
          month="$(date -u +%Y-%m)"
          echo "$month" > alive.txt
          git add alive.txt
          if git diff --cached --quiet; then
            echo "alive.txt already says $month"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Still watching, $month"
          git push
