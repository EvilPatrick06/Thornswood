; Thornswood
;
; Keys for the pieces this server adds. Values are DirectInput scan codes, the
; same numbering SkyrimPlatform's buttonEvent reports and the same one SkyUI
; and True Directional Movement use.
;
; Common ones: A-Z are 30,48,46,32,18,33,34,35,23,36,37,38,50,49,24,25,16,19,
; 31,20,22,47,17,45,21,44 for A..Z.  1-9 are 2..10 and 0 is 11.
; Tab 15, Escape 1, Space 57, Enter 28, Left Shift 42, Left Ctrl 29, Left Alt 56.
; F1-F12 are 59..68, 87, 88.
;
; Rebind on Settings in the game rather than here if you can: on the help panel
; (F7) and the K, P and J panels. It checks the key is not already one of
; Thornswood's or the game's, and it applies at once.

[Emotes]

; Opens and closes the emote wheel. G.
WheelKey = 34

; Turns to the other ring while the wheel is open. Tab.
PageKey = 15

; Closes the wheel. Escape.
CloseKey = 1

; Breaks you out of an idle you are stuck in. Works any time, which is the
; point: the usual reason you want it is that the wheel is not open. N.
StopKey = 49

[Chat]

; Hands the keyboard to the chat box and puts the cursor in it. Escape gives it
; back to the game. Enter, because Skyrim uses it for nothing while you are
; playing and it is what anybody expects a chat to open on.
;
; The browser drawing the chat does not hold the keyboard while you play, which
; is deliberate: if it did, every letter you pressed would go to the chat box
; instead of the game. So talking is a thing you turn on.
ChatKey = 28

; Opens the chat with a slash already typed, for what is still typed there:
; /stuck, /helpme and /report, how a line is said (/me, /do, /w, /s, /y and
; /ooc), /roll, /needs for the needs bars as text, and staff and dev
; commands. The game's skill tree, which is also on /, is shut if it opens. /.
CommandKey = 53

; Opens the help panel: talking, people, living, work, land and getting help,
; with every key named as it is bound in this file. Help on the K, P and J
; panels opens it too, and this key or Escape closes it. F7, because every
; letter is already Skyrim's or ours, and nothing else answers to F7.
HelpKey = 65

; The chat and the voice service live on the same port on the game server. The
; plugin reads the address itself out of skymp5-client-settings.txt, so only the
; port is here.
VoicePort = 7778

[People]

; Friends and your party. P.
PartyKey = 25

; Your journals. J.
JournalKey = 36

; The next three only work while somebody is under your crosshair.
;
; Asks them to be friends, or takes them off your list. Y, because G is the
; emote wheel.
FriendKey = 21

; Offers them a trade. H.
;
; The same key, in your inventory while you have a wound to tend, shuts the
; inventory and opens the panel that tends it.
TradeWithKey = 35

; Stops you hearing them, for you only. L.
MuteThemKey = 38

[Creation]

; Profession, class and the skill tree. K.
;
; K was the minimap's own settings panel until 20 September. That moved to F10
; in Keys.cs, because a panel somebody opens once to set the fog of war is
; worth less than the menu the progression system lives in.
;
; The panel does not pause the world. It claims the keyboard while it is up and
; gives it back when it closes, and it reports both, so a claim cannot be left
; standing. Escape closes it as well as the key. A Master looking at somebody
; they could take on as an apprentice sees this key named under the crosshair,
; and it opens the panel's Masters and apprentices page on that person.
SkillsKey = 37

; Closes Skyrim while your face and body are being made, pressed twice within
; five seconds. A line at the top of the screen says so. It does nothing
; anywhere else, so it cannot end a session in the world. F10, which nothing
; else here uses since the minimap and its settings panel left the build.
CloseGameKey = 68

[Property]

; Presses a blank key mold into the lock of the door you are looking at, so it
; becomes the mold for that building. Only while you are looking at a door and
; carrying a key mold, and a line under the crosshair says so. The holder of
; the building has to be you or be standing there. Not E, because E opens the
; door. The same key, while you look at somebody inside a building you hold,
; lets them sleep there for a night, or ends their night. U.
;
; The same key, in your inventory while you carry a repair kit, shuts the
; inventory and opens the repair panel. None of the lines it answers are up
; together.
MoldKey = 22

; At a door of the building you just opened, a line names what this key does
; there: claims the building when nobody holds it, locks or unlocks it when it
; is yours. At a forge, carrying a key mold that has been pressed into a door,
; it cuts a key from the mold. At a crop, it claims the farm around it when the
; line says so. X.
;
; The same key, while you look at somebody with a wound to tend, opens the
; panel that tends it. None of the lines it answers are up together.
LockKey = 45

[Combat]

; A warrior's maneuvers. Opens a small panel with the ones you hold; a number
; or a click starts one, and this key or Escape closes it. 9, because 1 to 8
; are Skyrim's favourites hotkeys and every letter is already taken.
ManeuverKey = 10

[Voice]

; Hold to talk. Everyone near you hears you, and the further away they are
; standing the quieter you get. V.
PushToTalk = 47

; Steps your voice from a whisper to your normal voice to a yell and round
; again. B.
VoiceModeKey = 48

; Locks the microphone open until it is pressed again, for a song or a long
; speech without holding the talk key. O.
VoiceLockKey = 24

; The plugin reads this and forwards it into the overlay that runs voice.
; It has to work that way round: voice needs a browser, and the game's own
; browser does not hold the keyboard while you are playing, so a key pressed in
; the game would otherwise never reach it.
;
; There is no separate voice window. There cannot be: served from a plain http
; address, Chromium does not expose a microphone at all, on any flag. It is an
; origin rule rather than a permission, which is why that window could never
; have worked however it was launched. The page inside the game is loaded from
; file://, which Chromium counts as trustworthy, so the microphone exists
; there.

; Opens the microphone. 1 on, 0 off.
;
; Granting the permission and opening the device are two different acts.
; SkyrimPlatform appends --enable-media-stream now, in
; MyChromiumApp::OnBeforeCommandLineProcessing, so CEF says yes to a capture
; request instead of refusing it the way Alloy does with no permission
; handler. But nothing is opened until the page calls getUserMedia, and this
; is what decides whether it does.
;
; It was left at 0 on 18 September while we worked out whether a live capture
; was what left the keyboard dead in character creation. Set it to 1 and play,
; set it to 0 and play, and the difference between the two runs is exactly one
; microphone. That is a test. Swapping a 15 MB DLL each time is not.
;
; THE TEST SHIPPED. This file is embedded into Thornswood.exe by
; Build-Launcher.ps1, so a debugging state left in it is not a state on one
; machine, it is every install with no microphone and no reason given. It is
; back at 1, which is the shipping value.
;
; If it has to go to 0 again to measure something, put it back before the
; release. A release that carries a 0 here is a release where nobody can talk.
;
; The launcher passes nothing on the command line and cannot: skse64_loader
; parses its own arguments and answers an unknown one with "Couldn't read
; arguments." and no game at all.
Microphone = 1

[Tools]

; Marks where you are standing, for the launcher's starting locations. Walk
; into an inn, stand where somebody should arrive, face the way they should
; face, and press this. The cell, the position and the angle are written to
; Data\Platform\thornswood-spots.txt, which Mark-Spot.ps1 reads.
;
; The arrival points were first written by hand, each one the inn's front door
; moved 110 units, and most of them were not in the room. Five were walked in
; 1.1.41, and Solitude, Falkreath and Dawnstar are now the spot the game itself
; puts you on when you walk in the front door. Mark one to pick a better spot
; than the doorway. F8.
MarkKey = 66
