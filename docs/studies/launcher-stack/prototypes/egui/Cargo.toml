[package]
name = "proto-egui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "proto-egui"
path = "main.rs"

[dependencies]
eframe = "0.37"
egui_extras = { version = "0.37", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
