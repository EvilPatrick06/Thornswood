[package]
name = "proto-tauri"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "proto-tauri"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
