# Hands One's clone report to anybody with gh, through this run's log
# (#3534).
#
# WHY. The weekly review could not read One's worktrees and stashes: a cloud
# thread cannot reach One, and nothing on One said what its clone held. So
# scripts/dev/Report-Clone.ps1 on One (every morning, as a scheduled task of
# the account that runs it) lists them and starts this run on main with the
# report as its one input, and Report-Clone.ps1 -Read, from anywhere with gh,
# reads it back out of the newest run that ended well.
#
# THE HAND-BACK IS THE LOG, the way board-read.yml hands the board back
# (#3410): artifact storage is capped for the whole repository and filled on
# 25 Oct 2026, and a log takes none of it. GitHub keeps a log 90 days. The
# input is the report gzipped and in base64; this run checks that it opens to
# a clone report, then prints the report's JSON in base64 between a
# CLONE-JSON begin line (its length and sha256) and a CLONE-JSON end line,
# 4000 characters a line. A run given anything else fails and prints nothing
# of it.
#
# WHAT IT HOLDS. Branch names, commit ids, worktree paths inside the clone,
# the names of folders in worktrees and times from One's clone. The log is
# public with the repository (#3721), so the report names no machine and no
# path on One, and leaves stash messages and the names in temp out. No secret:
# Report-Clone.ps1 reads git, never a file.
#
# THE TOKEN. None. The run's own token is given no permissions, and the
# report comes in through the environment, never pasted into the script.
#
# WHERE IT RUNS. On GitHub's Windows runner once the repository is public
# (#4013), where the box's runners are not registered; on any VPS runner only
# while it is private, the way #3792 gates the others. A few seconds either
# way. It checks nothing out and runs no action, so there is nothing in it to
# pin.
name: Clone report
run-name: Clone report from ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      report:
        description: 'The clone report, gzipped and in base64 (scripts/dev/Report-Clone.ps1 writes it)'
        required: true
        type: string
permissions: {}
jobs:
  report:
    name: Hand the report back
    # Main only (#3550): while the repository is private runner 3 signs
    # release launchers and takes any job that asks for thornswood-vps alone,
    # so a job on that label never runs a branch's code. Report-Clone.ps1
    # starts it on main; a start on a branch skips it.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Windows", "thornswood-vps"]') || 'windows-latest' }}
    # One small decode. Past this it is stuck, not slow.
    timeout-minutes: 5
    steps:
      - name: Check the report and print it
        shell: pwsh
        env:
          CLONE_REPORT: ${{ inputs.report }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CLONE_REPORT) { throw 'the run was given no report' }
          if ($env:CLONE_REPORT -notmatch '^[A-Za-z0-9+/=]+$') { throw 'the report is not base64' }
          $in = New-Object IO.MemoryStream (, [Convert]::FromBase64String($env:CLONE_REPORT))
          $gz = New-Object IO.Compression.GZipStream($in, [IO.Compression.CompressionMode]::Decompress)
          $out = New-Object IO.MemoryStream
          $gz.CopyTo($out)
          $gz.Dispose()
          $bytes = $out.ToArray()
          if ($bytes.Length -gt 1048576) { throw 'the report opens to more than 1 MB, which no clone report is' }
          $report = [Text.Encoding]::UTF8.GetString($bytes) | ConvertFrom-Json
          if (-not $report.PSObject.Properties['kind'] -or $report.kind -ne 'thornswood-clone-report' -or -not $report.PSObject.Properties['clones']) { throw 'the input is not a clone report' }
          Write-Host ("a clone report made {0}, {1} clone(s)" -f $report.made_at, @($report.clones).Count)
          # The marker is put together here so the script's own text, which
          # the log shows first, never holds it.
          $mark = 'CLONE' + '-JSON'
          $sha = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes)).Replace('-', '').ToLowerInvariant()
          $b64 = [Convert]::ToBase64String($bytes)
          Write-Host ("{0} begin {1} {2}" -f $mark, $bytes.Length, $sha)
          for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Host ("{0} {1}" -f $mark, $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
          Write-Host ("{0} end" -f $mark)
