# Every pull request and every push to main gets the checks a release starts
# with: do all the PowerShell scripts parse, does every game script parse,
# does the bot parse, do the test harnesses still pass, and does the launcher
# build with MSBuild from its project files (#498, switched 15 Oct; the step
# "Check the MSBuild launcher against its sources" holds that build to the
# repository, resource by resource). A red mark here means the
# branch would stop Ship.ps1; a green one means it is worth a person's time
# to read. It builds only; nothing is published.
#
# Everything is one job on purpose. Branch protection names ONE required
# check, "Launcher builds", and a second job would not be covered by it, so
# a new job would be a check that blocks nothing. Steps are named instead, and
# a failed step names itself in the summary just as a failed job would.
#
# The harnesses were all written to be run by hand and none of them had ever
# run here: 236 checks across twelve files, sitting in the repo going stale.
#
# WHERE IT RUNS NOW (#1306, 11 October): GitHub's hosted Windows runner by
# default, the VPS only as a fallback; see the jobs below. The history:
#
# WHERE IT RAN. On the VPS, from 25 September: GitHub's own runners were
# blocked on billing and every run failed in seconds, and Patrick chose a
# runner on the box over paying for minutes (issue #437).
# scripts\deploy\Install-Runner.ps1 puts it there, as its own local account that is
# shut out of every live Thornswood folder, at normal priority (never above)
# and with Defender skipping its own folder, so a check takes minutes.
# The label is what picks it; change it here and in Install-Runner together.
# SEVERAL OF THEM since 4 October: one runner takes one job at a time, and
# the queue reached an hour when the lanes opened pull requests in bursts.
# Install-Runner.ps1 -Number <n> puts each one after the first beside it with
# the same label, so a check goes to whichever is free.
# HOSTED FIRST, THE BOX WHEN HOSTED HAS NO USAGE (#2393, Patrick, 15 Oct):
# the Actions budget is not being raised. Every build tries GitHub's hosted
# Windows runner first; when the month's included minutes are used up the
# hosted job is refused before any step runs and the VPS fallback builds it.
# A pull request runs these same steps in build-pr.yml, which
# scripts\dev\Build-PrWorkflow.js generates from this file; it has the same
# fallback, for this repository's own branches only (Patrick, 12 Oct).
# Change a step here, then run  node scripts/dev/Build-PrWorkflow.js;
# tests\test-1306-pr-workflow.js fails while the two differ.
#
# WHY THE ACTIONS ARE PINNED. Every action is named by a full length commit
# SHA, with the tag it was on in a comment at the end of the line, the same as
# release.yml has been since it was written. A tag is a moving pointer its owner
# can repoint at any commit, and these steps run on the VPS, beside the live
# server: a repointed tag would be somebody else's code on that box without a
# line changing here. The comment is what a person reads; the SHA is what runs.
# To move one, look the tag up and replace both:
#   gh api repos/actions/checkout/git/matching-refs/tags/v7
#
# FAST, SINCE 25 SEPTEMBER: every pull request and every push to main gets
# the checks that take seconds (secrets, every script and file parses, the
# writing rules, the ownership page, the launcher window, the silent catch
# count) and the launcher build, about two
# minutes on the VPS. The ~380 test harnesses in tests/ took over five minutes there
# on their own, so they run every night instead, in nightly.yml, with the
# rest of the security, file, GitHub and code checks (Patrick: "let's do
# #1 and setup a nightly schedule"). A nightly failure opens an issue.
# One of those harnesses is here as well, tests\test-ownership.js, added by
# issue #752: it runs in a tenth of a second and what it guards, the page
# naming where every credential lives, went wrong on a pull request that
# nobody caught for days (#697, found in #750 and #751). A harness earns a
# place here by being that fast and that cheap to be wrong about. Six more
# joined it on 28 September (issue #875), under a minute between them, after
# all six had sat red on main with this build green.
#
# ON AGAIN, ON THE VPS, 25 SEPTEMBER. It was off for part of that day while
# no runner existed. Then Patrick: "I want it set so they can commit+merge
# as long as the checks on the VPS go through so they don't need me".
# Then: "we don't need the required check/reviewer at all anymore for
# anyone as long as we give verbal agreement and the VPS check goes
# through". So nothing is required in GitHub's settings; the team merges
# once this is green and it has been said in #staff-updates.
name: Build check
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'hosted (GitHub, the default) or vps (the box, the fallback)'
        type: choice
        options: [hosted, vps]
        default: hosted
permissions:
  contents: read
# One run per branch at a time. A newer push cancels the run it replaces, so
# no runner is left building a commit nobody wants.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ALREADY TESTED (#3182, 21 Oct 2026). Main's build used to run every check
  # again on the tree its pull request had just passed: 26 minutes of a build
  # runner for #3125 (run 39690135051), and 905 box minutes on 21 Oct, most
  # of it cancelled by the next merge. When the pull request's build ran
  # against the main it lands on, a squash merge gives main that very tree.
  # This job asks scripts\dev\Tested-Tree.js whether a green build-pr.yml run
  # of this repository kept a note of HEAD's tree (the last step of the checks
  # below), and when one did it names that run and the build stops green.
  # Any other tree, an expired note, a fork's run or a GitHub answer it cannot
  # read builds main in full, as before. A manual run always builds. It runs
  # on any VPS runner, not a build one: it starts node and asks GitHub three
  # questions. tests\test-3182-tested-tree.js holds what it accepts, and why a
  # tree is enough is in the script's header.
  tested:
    name: Already tested in its pull request
    if: ${{ github.event_name == 'push' }}
    runs-on: [self-hosted, Windows, thornswood-vps]
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.look.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every self-hosted checkout is written again (#3029), as below.
      - name: Check every tracked file out again
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          git rm -r -q --cached .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git reset -q --hard HEAD
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Look for a green pull request build of this tree
        id: look
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tree = (git rev-parse 'HEAD^{tree}' | Out-String).Trim()
          node scripts\dev\Tested-Tree.js --tree $tree --repo $env:GITHUB_REPOSITORY
          exit 0

  # WHERE IT RUNS, since 11 October (#1306, Patrick's final call on #2161):
  # GitHub's hosted windows-latest is the default, in the job "launcher"
  # at the end of this file. This job is the VPS FALLBACK. It runs only
  # when the hosted job did not succeed (for a pull request, only on a
  # branch of this repository, never a fork), that is when
  #   - the repository variable BUILD_RUNNER is vps, which skips the hosted
  #     job outright (Settings, Variables). Optional: a refused hosted job
  #     already falls through to the box, the variable only saves the red, or
  #   - a manual run asked for runner: vps, or
  #   - the hosted job failed. A quota or billing stop fails it before any
  #     step runs, and this picks the build up on the box. A real red fails
  #     here too, so a broken main shows red twice; that is the price of not
  #     telling a quota stop from a test failure.
  # The steps are the hosted job's own, by the YAML anchor checks, so the two
  # can never test different things.
  launcher-vps:
    name: Launcher builds (VPS fallback)
    needs: [tested, launcher]
    if: ${{ !cancelled() && needs.tested.outputs.run == '' && needs.launcher.result != 'success' && needs.launcher.result != 'cancelled' }}
    # thornswood-build (#2994): only the runners records/build-runners.json
    # lists carry it, so no more builds run on the box at once than its six
    # cores finish fastest. Seven at once on 21 Oct took 34 to 39 minutes for
    # the harness step alone and the limit below cancelled passing builds.
    runs-on: [self-hosted, Windows, thornswood-vps, thornswood-build]
    # Often past twenty minutes on the VPS (#2557): it is shared with the live
    # server and other jobs, and the harness list keeps growing (#2544 added
    # test-release-workflow.ps1, #2525 the feed-watch test, #2546 the remote
    # command map under both pwsh and PowerShell 5.1). Forty leaves room for
    # that; past it the job is stuck, not slow.
    timeout-minutes: 40
    steps: &checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A runner keeps its folder from one job to the next, and a checkout
      # there rewrites only the files that differ from the last job's commit,
      # so every other file keeps the line endings the last job's
      # .gitattributes gave it (#3029). Every tracked file is written again,
      # the way this commit checks it out.
      - name: Check every tracked file out again
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          git rm -r -q --cached .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git reset -q --hard HEAD
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The hosted image ships whatever node and python it has this month;
      # these are pinned so a check means the same thing as on the VPS, which
      # has its own and skips them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'

      - name: Scan the tree for secrets
        shell: pwsh
        run: |
          # Entry 236. Every tracked file, by the rules in scripts\dev\Check-Secrets.ps1.
          # A hit names the file, the line and the rule and never the value,
          # because anybody on the repository can read this log. A known
          # non-secret goes in scripts\dev\Check-Secrets.allow.txt with its reason.
          .\scripts\dev\Check-Secrets.ps1
          exit $LASTEXITCODE

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path scripts, tests, installer -Filter *.ps1 -Recurse -File | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              $bad++
              Write-Host ("::error file={0},line={1}::{2}" -f $_.FullName, $e.Extent.StartLineNumber, $e.Message)
            }
          }
          if ($bad) { exit 1 }
          Write-Host "every script parses"

      - name: Check the writing rules
        shell: pwsh
        run: |
          # The Words section of Developer-Guide.md, over every file people read
          # (every Markdown file outside lore and the archive, the launcher's
          # help and window, the bot's posts, the public pages, the installer's
          # read me). Written down since the start and never checked, and on
          # 24 September eleven hits had gone out in those files. Each hit is
          # marked on its line with the rule it breaks.
          #
          # Issue #460: then the two harnesses that prove the checks catch what
          # they should, this one and the release note check Ship runs
          # (scripts\release\Note-Rules.ps1), by planting a break of every rule.
          # A few seconds between them. They ran only at night before, and a
          # name in a component README sat red there for a day (#1034).
          .\scripts\dev\Check-Words.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $failed = @()
          # Issue #1081: Ship runs Check-Words before it builds. The harness
          # plants one hit in a temp tree and a dry-run Ship must stop and
          # name that hit.
          foreach ($n in 'test-check-words.ps1', 'test-note-rules.ps1', 'test-ship-check-words.ps1') {
            Write-Host ("--- {0}" -f $n)
            & pwsh -NoProfile -File (Join-Path 'tests' $n)
            if ($LASTEXITCODE -ne 0) { $failed += $n; Write-Host ("::error file=tests/{0}::a writing check let a planted break through or reported an allowed line; the FAIL lines above say which" -f $n) }
          }
          if ($failed.Count) { exit 1 }

      - name: Check the ownership page
        shell: pwsh
        run: |
          # Issue #752. docs\OWNERSHIP.md says where every credential file
          # lives, who holds it and who the second holder is, and
          # tests\test-ownership.js greps scripts\<area>\*.ps1 and
          # launcher\app\*.cs for the file names rather than trusting the page.
          # #697 added discord-avatar.txt with neither a row on that page nor a
          # line saying it is not a secret, and nothing said so until #750 and
          # #751 found it by hand. A tenth of a second, so it runs here on every
          # pull request and not only in the nightly checks.
          #
          # Fail closed: no node on the runner is a check that did not happen,
          # which is the failure this step exists to stop, so it is red.
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host '::error file=tests/test-ownership.js::no node on this runner, so the ownership page was not checked'
            exit 1
          }
          node tests\test-ownership.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=docs/OWNERSHIP.md::the ownership page does not match what the scripts and the launcher name; the FAIL lines above say which rows'
            exit 1
          }

      - name: Check the old mod's name stays out
        shell: pwsh
        run: |
          # Issue #497. The multiplayer mod this build replaced was taken out
          # of the whole tree on 28 September, after weeks of clean ups that
          # each found more because nothing failed when one came back. One
          # read of every tracked file, a second or two, so it runs here.
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host '::error file=tests/test-old-name-gone.js::no node on this runner, so the old name was not checked'
            exit 1
          }
          node tests\test-old-name-gone.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=tests/test-old-name-gone.js::the old multiplayer mod is named again; the lines above say where'
            exit 1
          }

      - name: Check the other server's name stays out
        shell: pwsh
        run: |
          # Issue #400. Patrick, 12 October: the name of the SkyMP server
          # Thornswood-Content.esp was salvaged from goes from every file,
          # records, tests, docs\archive and the plugin included, and on
          # 15 October (decision C) its two short forms with it. One read of
          # every tracked file, text, plugins and binary, so it runs here.
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host '::error file=tests/test-other-server-name-gone.js::no node on this runner, so the other server''s name was not checked'
            exit 1
          }
          node tests\test-other-server-name-gone.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=tests/test-other-server-name-gone.js::the other server or one of its short forms is named again; the lines above say where'
            exit 1
          }

      - name: Check the engine is one commit
        shell: pwsh
        run: |
          # Issue #1200. The commit engine\skymp is pinned to, the commit
          # records\client-build.json and records\server-build.json say the
          # two halves were built from must be one fork commit. On 29
          # September the server record was two days and several fixes behind
          # the pin and nothing said so, so the servers ran old engine code.
          # Reads only the checkout (the pin is the gitlink in HEAD's tree),
          # well under a second. Fail closed, like the steps above. It also
          # holds engine\README.md to naming no commit or hash in full, since
          # the page went stale twice copying the pin (issue #1346).
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host '::error file=tests/test-one-engine.js::no node on this runner, so the engine commit was not checked'
            exit 1
          }
          node tests\test-one-engine.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=records/server-build.json::the engine pin and the client and server build records do not name one fork commit, or engine/README.md names a commit or hash in full; the lines above say which'
            exit 1
          }

      - name: Check the high-risk records
        shell: pwsh
        run: |
          # Issue #2180. records\server-build.json, client-build.json,
          # most-online.json and collection-plugins.json must each be a version
          # this checkout knows, with every field its readers depend on
          # (scripts\release\RecordShape.ps1). The deploys refuse a record that
          # is not; this says so at merge instead. Reads four files, under a
          # second. Fail closed, like the steps above.
          .\scripts\release\Check-Records.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=records/server-build.json::a high-risk record is at a version this checkout does not know, or is missing a field its readers need; the lines above say which'
            exit 1
          }

      - name: Check inactive merchant role data
        shell: pwsh
        run: |
          & python tests/test-merchant-role-data.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python tests/test-merchant-roster.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python tests/test-merchant-roster-activation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python scripts/dev/Build-MerchantRoleTables.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the bot's keeping times
        shell: pwsh
        run: |
          # Issue #2353: joins_age, ticket_past_keeping and age_closed_tickets
          # lifted out of bot\bot.py, no discord.py needed.
          & python tests/test-2353-join-keeping.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python tests/test-2353-ticket-keeping.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python tests/test-retrieval-source-reader.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the gate harnesses
        shell: pwsh
        run: |
          # Issue #3009. The gate is every tests\test-*.js and tests\test-*.ps1
          # that tests\gate-excluded.txt does not name, read from the files by
          # scripts\dev\Gate-Harnesses.ps1 when this runs, in name order. It
          # was a hand-kept list here, and every pull request adding a harness
          # appended to its end, so any two of them conflicted in this file and
          # in build-pr.yml. A new harness is on the gate by being in tests\;
          # one comes off by a line in gate-excluded.txt with its reason; why
          # each one exists is in its own header. Name no harness in this step:
          # a name here is a second list (test-gate-list.ps1 fails on one).
          # It began as six that sat red on main unseen (#875) and grew from
          # there (#1088, #1273, #2513). pwsh on purpose: test-script-index.ps1
          # starts Windows PowerShell 5.1 itself to compare what the two write.
          # On 21 Oct 2026 the 550 then on the gate took 26 minutes of a 28
          # minute build one at a time, in a foreach here (#3114). They run
          # through scripts\dev\Nightly-Harnesses.ps1 now, -Throttle at once:
          # each a process of its own with its output in files of its own,
          # printed as it ends, on the nightly's clock, in a job object that
          # counts its processor time. The summary says what the box's cores
          # did meanwhile. Beside four other builds on 21 Oct 2026 the 550
          # took 2110 s one at a time, 1112 s two at a time, 887 s at three and
          # 765 s at six, every one passing. Since 22 Oct two builds run at
          # once, not four (records\build-runners.json says why), and each
          # runs its share of the cores, three of six, whatever the box is
          # doing; past that, up to six, only into cores the box has free, so
          # a build alone uses the idle ones and two side by side share them
          # rather than one grabbing them (#3106's build got under one core
          # beside one at six, and ran out of time). A harness that writes
          # where another reads says RUNS ALONE in its header and runs after
          # the rest. tests\test-signer-check.ps1 and
          # tests\test-build-generated.ps1 had steps of their own after this
          # one (#2046, #1982), one after the other; they are on the gate
          # list and run beside the rest.
          # 1800 s of the job's 40 minutes: a harness starts only when its
          # whole clock still fits, so the list of what failed is printed
          # before the job could be cancelled.
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host '::error::no node on this runner, so the .js gate harnesses were not run'
            exit 1
          }
          $gate = @(& .\scripts\dev\Gate-Harnesses.ps1)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # This build's share: the machine's cores over the builds the box
          # runs at once, the runners records\build-runners.json lists.
          $builds = @((Get-Content -LiteralPath records\build-runners.json -Raw | ConvertFrom-Json).runners).Count
          $share = [Math]::Min(6, [Math]::Max(1, [Math]::Floor([Environment]::ProcessorCount / [Math]::Max(1, $builds))))
          .\scripts\dev\Nightly-Harnesses.ps1 -Only ($gate -join ' ') -Throttle 6 -Share $share -BudgetSeconds 1800
          exit $LASTEXITCODE

      - name: Run the voice service's /health harness
        shell: pwsh
        run: |
          # Issue #2475. voice\test-turn-key.js checks /health's fields, in
          # order, and #2677 broke it while this build stayed green, because
          # the harness list above runs only tests\ and voice\test-*.js ran
          # only at night. It starts the real service on a port of its own
          # (#1703), a few seconds.
          & node voice\test-turn-key.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=voice/test-turn-key.js::the voice /health harness failed, the FAIL lines above say what'
            exit 1
          }

      - name: Check NPC population policy
        shell: pwsh
        run: |
          & python tests/test-npc-population.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check our plugins are clean
        shell: pwsh
        run: |
          # Issue #2790. Our three plugins are written by scripts and change
          # most weeks; this is the half of SSEEdit's error and cleaning check
          # that needs no game: every record inside its group, sizes that add
          # up, no form id twice or past the plugin's own index, nothing
          # deleted. The identical-to-master half needs the masters, a game
          # folder: python scripts/mods/Check-PluginClean.py where one is.
          & python tests/test-2790-plugin-clean.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python scripts/mods/Check-PluginClean.py --no-masters
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=scripts/mods/Check-PluginClean.py::a plugin in game/content has a broken or deleted record; the lines above say which, and the cure is in the script that writes it'
            exit 1
          }

      - name: Check the launcher window
        shell: powershell
        run: |
          # The launcher builds its window from ui.xaml at startup and finds
          # every control by name, so a renamed control or a window that does
          # not parse compiles clean and is found by the person using it. This
          # fails on either. Windows PowerShell on purpose: it parses with the
          # .NET Framework WPF the launcher runs on, not the newer one in pwsh.
          & powershell -NoProfile -File scripts\dev\Check-Controls.ps1 -NoPause
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=launcher/ui.xaml::the launcher window does not line up with the C#, see the lines above'; exit 1 }

      - name: Check the launcher UI thread
        shell: pwsh
        run: |
          # Issue #1216. A Log() from a background thread throws on the
          # window, and the catch then reports a success as a failure.
          # This follows calls out of ThreadPool and Thread delegates in
          # launcher\app. No arguments: the script finds launcher\app from
          # where it lives. A finding exits 1. No python is a check that
          # did not happen, so it is red.
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-Host '::error file=scripts/dev/Check-UiThread.py::no python on this runner, so the UI thread check did not run'
            exit 1
          }
          & python scripts/dev/Check-UiThread.py
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=scripts/dev/Check-UiThread.py::the launcher touches the window from a background thread; the lines above say where'
            exit 1
          }

      - name: Parse every game script
        shell: pwsh
        run: |
          $bad = 0
          # game\ since the reorganisation's phase 6 (issue #440): the gamemode,
          # the plugins and the overlays.
          $files = @(Get-ChildItem -Path scripts -Filter *.js -File -Recurse) + @(Get-ChildItem -Path game -Filter *.js -File) +
                   @(Get-ChildItem -Path game\plugins, game\ui -Filter *.js -File -ErrorAction SilentlyContinue) +
                   @(Get-ChildItem -Path site\server.js, voice\voice-server.js -File)
          foreach ($f in $files) {
            & node --check $f.FullName 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $bad++
              Write-Host ("::error file={0}::does not parse" -f $f.FullName)
            }
          }
          if ($bad) { exit 1 }
          Write-Host ("{0} game script(s) parse" -f $files.Count)

      - name: Parse every bot file
        shell: pwsh
        run: |
          if (-not (Test-Path bot)) { Write-Host 'no bot to parse'; exit 0 }
          $bad = 0
          foreach ($f in (Get-ChildItem bot -Filter *.py -Recurse -File)) {
            & python -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read(), sys.argv[1])" $f.FullName 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $bad++
              Write-Host ("::error file={0}::does not parse" -f $f.FullName)
            }
          }
          if ($bad) { exit 1 }
          Write-Host 'every bot file parses'

      - name: Check the Python names what exists
        shell: pwsh
        run: |
          # Issue #1343. Parsing (the step above) passes a name that does not
          # exist, and Python only finds out when that line runs: in the bot,
          # on the VPS, in front of people. ruff with four rule groups and
          # nothing else: E9 a file that will not compile, F63 a comparison
          # or assert that is always true or false, F7 a break, continue,
          # return or yield where none can be, F82 a name never defined.
          # No style rules, so no line here is red for how it looks. All 48
          # Python files passed on main on 5 October with nothing changed.
          # ruff comes into a venv of this run's own, never the machine's
          # Python, pinned by version and hash in .github\ruff-requirements.txt.
          # By hand, from the repository folder, in any venv:
          #   python -m pip install --only-binary :all: --require-hashes -r .github\ruff-requirements.txt
          #   python -m ruff check --isolated --select E9,F63,F7,F82 (git ls-files '*.py')
          $venv = Join-Path $env:RUNNER_TEMP 'ruff-venv'
          python -m venv $venv
          $py = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $py)) {
            Write-Host '::error::could not make a venv for ruff, so the Python was not checked'
            exit 1
          }
          & $py -m pip install --quiet --disable-pip-version-check --only-binary :all: --require-hashes -r .github\ruff-requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=.github/ruff-requirements.txt::could not install the pinned ruff, so the Python was not checked'
            exit 1
          }
          $files = @(git ls-files '*.py')
          & $py -m ruff check --isolated --no-cache --select E9,F63,F7,F82 --output-format github @files
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host ("{0} Python file(s) name only what exists" -f $files.Count)

      - name: Count the silent catches in the launcher, the scripts, the site, voice and the bot
        shell: pwsh
        run: |
          # Entry 239. A catch with nothing in it leaves no line in
          # launcher.log when it fires, and there were 386 of them on 24 Sep.
          # Since #2711 the PowerShell under scripts\ and installer\ is
          # counted too: two empty catches let New-ClientBuildRecord.ps1 write
          # a record over checks that never ran. Since #2736 the JavaScript
          # under site\ and voice\ and the Python under bot\ are counted as
          # well: an empty catch in the site's /api/play/logs handler lost a
          # session's crash note with nothing said. Red when any of those files
          # has more than
          # scripts\dev\swallow-baseline.txt allows, and since #756 red when a
          # file has fewer and its line has not been lowered with it, so the
          # lowering lands in the branch that made the count fall rather than
          # waiting for somebody to notice. The script says what to do.
          .\scripts\dev\Check-Swallow.ps1

      - name: Build the launcher
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Launcher') | Out-Null
          .\scripts\release\Build-Launcher.ps1 -Root $root -NoPause
          if (-not (Test-Path (Join-Path $root 'Launcher\Thornswood.exe'))) { Write-Host '::error::no Thornswood.exe came out of the build'; exit 1 }

      - name: Build the ship root tool
        shell: pwsh
        run: |
          # Issue #2019. Every Ship builds Thornswood-ShipRoot.exe from
          # scripts\release\ShipRoot\ShipRoot.csproj, which compiles all of
          # launcher\app with its own entry point, and runs it on the folder
          # the release is built from before anything is packed. A launcher
          # change that stops it compiling would stop every Ship, so it is
          # built here with the same MSBuild; tests\test-2019-ship-roots.ps1
          # in the list above runs it on a pretend root.
          $msb = & .\scripts\release\Find-MSBuild.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::MSBuild is not on this runner, so the ship root tool cannot be built'; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP 'shiproot'
          & $msb scripts\release\ShipRoot\ShipRoot.csproj -nologo -v:minimal -nr:false -p:Configuration=Release ('-p:OutDir=' + $out + '\')
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $out 'Thornswood-ShipRoot.exe'))) { Write-Host '::error file=scripts/release/ShipRoot/ShipRoot.csproj::the ship root tool did not build, see the lines above'; exit 1 }

      - name: Check the manifests in the built exes
        shell: pwsh
        run: |
          # Issue #463. Reads the manifest embedded in the launcher and the
          # setup program this build made: per-monitor DPI, asInvoker (neither
          # ever asks for administrator), and an identity version equal to
          # Updater.cs. Also runs the window fit at 100 to 200 percent.
          & pwsh -NoProfile -File tests\test-app-manifest.ps1 -Exe (Join-Path $env:RUNNER_TEMP 'Thornswood\Launcher\Thornswood.exe') -Scratch (Join-Path $env:RUNNER_TEMP 'app-manifest')
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=tests/test-app-manifest.ps1::the built exes do not carry the manifest they should, see the lines above'; exit 1 }

      - name: Scan the built launcher for secrets
        shell: pwsh
        run: |
          # The secrets that shipped were in built artefacts, not in the source,
          # so what this build made is read too, byte by byte: the launcher with
          # everything Build-Launcher embeds in it, and the setup stub.
          $built = @(Join-Path $env:RUNNER_TEMP 'Thornswood\Launcher\Thornswood.exe')
          if (Test-Path out\setup-stub.exe) { $built += (Resolve-Path out\setup-stub.exe).Path }
          .\scripts\dev\Check-Secrets.ps1 -Binary $built
          exit $LASTEXITCODE

      - name: Check the MSBuild launcher against its sources
        shell: pwsh
        run: |
          # Issue #498 (Patrick's option C, 11 Oct; switched 15 Oct): the
          # launcher is built only by MSBuild from launcher\app\Thornswood.csproj
          # and installer\setup\Setup.csproj. This holds that build to what the
          # comparison with the old csc build proved: every resource byte for
          # byte its file, the references, the PE kind, the version in the
          # file details and the manifest, the icon, nothing beside the exe.
          # GitHub's image has Visual Studio; the VPS runners have the Build
          # Tools from Bootstrap-VPS.ps1 -IncludeBuildTools (option A, 12 Oct).
          & pwsh -NoProfile -File tests\test-498-msbuild.ps1 -RequireMSBuild -Scratch (Join-Path $env:RUNNER_TEMP 'msbuild-498')
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=tests/test-498-msbuild.ps1::the MSBuild launcher does not match its sources, see the lines above'; exit 1 }

      - name: Lint (warnings only)
        # Issue #1343. Reports ruff, eslint and PSScriptAnalyzer findings and
        # never fails the build: continue-on-error, and scripts\dev\Lint.ps1
        # always ends 0. #3185 (21 Oct 2026): it fetched eslint and
        # PSScriptAnalyzer into RUNNER_TEMP on every job and linted every
        # file, 35 s a build on average. Lint.ps1 keeps each pinned tool in
        # the runner account's own folder, named by its version, and a pull
        # request lints only the files it changed against its base; main
        # and a manual run lint everything, and so does the nightly. The
        # last step before the note below, because it fetches the base
        # commit: no check after it reads git history.
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ($env:BASE -match '^[0-9a-f]{40}$') {
            git fetch -q --depth=1 --no-tags origin $env:BASE
            $changed = @(git diff --name-only --diff-filter=d $env:BASE HEAD)
            if ($LASTEXITCODE -eq 0) { .\scripts\dev\Lint.ps1 -Files $changed; exit 0 }
            Write-Host "::warning::could not tell what this pull request changed against $env:BASE, so everything is linted"
          }
          .\scripts\dev\Lint.ps1 -All
          exit 0

      # The note main's build looks for (#3182, the job "tested" at the top
      # of build.yml): the tree every step before this one passed on. Last,
      # so it is kept only when they all did. A pull request's checkout is
      # GitHub's merge of it into main, so this is the tree a squash merge
      # gives main while main has not moved. A few hundred bytes for seven
      # days, against the 2 GB below; nothing else reads it.
      - name: Write down the tree these checks passed on
        id: tree
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $tree = (git rev-parse 'HEAD^{tree}' | Out-String).Trim()
          if ($tree -notmatch '^[0-9a-f]{40}$') { Write-Host "::error::git gave no tree for HEAD: $tree"; exit 1 }
          $note = Join-Path $env:RUNNER_TEMP 'tested-tree.txt'
          Set-Content -LiteralPath $note -Encoding utf8 -Value @(
            "tree $tree", "commit $env:GITHUB_SHA", "pull request ${{ github.event.pull_request.number }}", "head ${{ github.event.pull_request.head.sha }}")
          "tree=$tree" >> $env:GITHUB_OUTPUT
          "note=$note" >> $env:GITHUB_OUTPUT
      - name: Keep the tree these checks passed on
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'pull_request'
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ steps.tree.outputs.note }}
          retention-days: 7
          overwrite: true

      # No other artifact from this build (#2163, 19 Oct). It used to keep the exe
      # for 7 days, and nothing read it: Ship takes the launcher from
      # release.yml's draft, and no script or test downloads a build's
      # artifacts. Measured 19 Oct: 488 copies, 1.30 GB of this account's 2 GB
      # of Actions storage, which Patrick's billing page read at 1.8 GB. The
      # pdb was never kept either (#1356 / #462): it carries absolute
      # build-machine source paths.

  # The default: GitHub's hosted Windows runner (#1306). Skipped when
  # BUILD_RUNNER is vps or a manual run asked for the box, and then the
  # fallback above runs instead.
  launcher:
    name: Launcher builds
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.run == '' && vars.BUILD_RUNNER != 'vps' && inputs.runner != 'vps' }}
    runs-on: windows-latest
    # The hosted runner has two cores: the harness step alone took over
    # eighteen minutes on it, so it gets an hour.
    timeout-minutes: 60
    steps: *checks
