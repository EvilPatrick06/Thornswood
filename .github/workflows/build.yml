# Every pull request and every push to main gets the checks a release starts
# with: do all the PowerShell scripts parse, does every game script parse,
# does the bot parse, do the test harnesses still pass, and does the launcher
# compile with the .NET Framework 4 csc (C# 5). A red mark here means the
# branch would stop Ship.ps1; a green one means it is worth a person's time
# to read. It builds only; nothing is published.
#
# Everything is one job on purpose. Branch protection names ONE required
# check, "Launcher builds", and a second job would not be covered by it, so a
# new job would be a check that blocks nothing. Steps are named instead, and
# a failed step names itself in the summary just as a failed job would.
#
# The harnesses were all written to be run by hand and none of them had ever
# run here: 236 checks across twelve files, sitting in the repo going stale.
name: Build check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  launcher:
    name: Launcher builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path tools -Filter *.ps1 -Recurse -File | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              $bad++
              Write-Host ("::error file={0},line={1}::{2}" -f $_.FullName, $e.Extent.StartLineNumber, $e.Message)
            }
          }
          if ($bad) { exit 1 }
          Write-Host "every script parses"

      - name: Parse every game script
        shell: pwsh
        run: |
          $bad = 0
          $files = @(Get-ChildItem -Path tools -Filter *.js -File) +
                   @(Get-ChildItem -Path tools\ts-plugins, tools\ts-ui -Filter *.js -File -ErrorAction SilentlyContinue)
          foreach ($f in $files) {
            & node --check $f.FullName 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $bad++
              Write-Host ("::error file={0}::does not parse" -f $f.FullName)
            }
          }
          if ($bad) { exit 1 }
          Write-Host ("{0} game script(s) parse" -f $files.Count)

      - name: Parse every bot file
        shell: pwsh
        run: |
          if (-not (Test-Path tools\discord)) { Write-Host 'no bot to parse'; exit 0 }
          $bad = 0
          foreach ($f in (Get-ChildItem tools\discord -Filter *.py -Recurse -File)) {
            & python -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read(), sys.argv[1])" $f.FullName 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $bad++
              Write-Host ("::error file={0}::does not parse" -f $f.FullName)
            }
          }
          if ($bad) { exit 1 }
          Write-Host 'every bot file parses'

      - name: Run the test harnesses
        shell: pwsh
        run: |
          # Written to be run by hand, and until now never run anywhere else.
          # A harness that reads this machine's game folder says SKIP for the
          # parts it cannot measure on a runner and still checks the rest.
          $bad = 0
          foreach ($t in (Get-ChildItem tools -Filter 'test-*.js' -File | Sort-Object Name)) {
            Write-Host ("--- {0}" -f $t.Name)
            & node $t.FullName
            if ($LASTEXITCODE -ne 0) { $bad++; Write-Host ("::error file={0}::harness failed" -f $t.FullName) }
          }
          foreach ($t in (Get-ChildItem tools -Filter 'test-*.ps1' -File | Sort-Object Name)) {
            Write-Host ("--- {0}" -f $t.Name)
            & pwsh -NoProfile -File $t.FullName
            if ($LASTEXITCODE -ne 0) { $bad++; Write-Host ("::error file={0}::harness failed" -f $t.FullName) }
          }
          # The five in toolsoice, which run nowhere else. They spawn the
          # real service in a temp folder and drive it over HTTP, so they need
          # node and nothing else, and node is already here. Added 23
          # September: the harness step globbed tools with no -Recurse, so
          # thirty ran and these five never had.
          foreach ($t in (Get-ChildItem toolsoice -Filter 'test-*.js' -File | Sort-Object Name)) {
            Write-Host ("--- voice/{0}" -f $t.Name)
            & node $t.FullName
            if ($LASTEXITCODE -ne 0) { $bad++; Write-Host ("::error file={0}::harness failed" -f $t.FullName) }
          }
          if ($bad) { exit 1 }
          Write-Host 'every harness passed'

      - name: Run the bot harnesses
        shell: pwsh
        run: |
          # The two Python ones import bot.py for real, so they need the
          # library the bot runs on. They were written to be run by hand and,
          # like every harness above before this file existed, had never run
          # anywhere: nothing was checking the bot's startup on a pull request.
          #
          # An install that fails says so and stops the step rather than the
          # build, because a pip outage is not a fault in the branch. A
          # harness that fails is red, which is the point.
          python -m pip install --quiet --disable-pip-version-check discord.py pillow certifi
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::could not install discord.py, so the bot harnesses did not run'
            exit 0
          }
          $env:DISCORD_TOKEN = 'not-a-real-token'
          $bad = 0
          foreach ($t in (Get-ChildItem tools\discord -Filter 'test-*.py' -File | Sort-Object Name)) {
            Write-Host ("--- {0}" -f $t.Name)
            & python $t.FullName
            if ($LASTEXITCODE -ne 0) { $bad++; Write-Host ("::error file={0}::harness failed" -f $t.FullName) }
          }
          if ($bad) { exit 1 }
          Write-Host 'every bot harness passed'

      - name: Build the launcher
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Launcher') | Out-Null
          .\tools\Build-Launcher.ps1 -Root $root -NoPause
          if (-not (Test-Path (Join-Path $root 'Launcher\Thornswood.exe'))) { Write-Host '::error::no Thornswood.exe came out of the build'; exit 1 }

      - name: Keep the exe from this build
        uses: actions/upload-artifact@v4
        with:
          name: Thornswood.exe
          path: ${{ runner.temp }}/Thornswood/Launcher/Thornswood.exe
          retention-days: 7
