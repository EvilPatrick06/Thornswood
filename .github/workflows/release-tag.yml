# Makes a launcher release's v<version> tag on main's commit and starts
# release.yml on it (#3312).
#
# WHY. release.yml signs only on a refs/tags/v ref, through the "release"
# environment, whose deployment rule allows v* tags alone. A Ship that runs
# from the cloud cannot push a tag: a cloud session's git pushes only its own
# branch, and its GitHub access refuses ref writes (measured 22 Oct 2026 on
# #3312: POST git/refs answered "Write access to this GitHub API path is not
# permitted"). It can start a workflow. So this workflow makes the tag with
# the repository token and starts release.yml on it; a tag the repository
# token pushes starts no workflow by itself, which is why it starts
# release.yml by name.
#
# WHAT IT HOLDS before it makes anything:
#   - the tag is v<a.b.c> (a main release, the number Updater.cs already
#     says, which release.yml checks again) or v<a.b.c.d> (a dev number,
#     which release.yml writes into Updater.cs, the way a dev Ship does);
#   - the commit is a full SHA on main (GitHub's compare says main is that
#     commit or ahead of it), so nothing off main is ever tagged here;
#   - a tag that is already there must already be that commit: the same
#     Ship asking again starts release.yml again on it, and a tag on another
#     commit stops the run. A tag is never moved or deleted here.
# Nothing is checked out and no repository code runs: it is REST calls with
# the repository token, on any VPS runner (a light job, like the board's).
#
# WHO CAN RUN IT. workflow_dispatch from main only, so only people who can
# write to the repository, who can push a v tag already.
name: Release tag
run-name: tag ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to make, v<a.b.c> (main) or v<a.b.c.d> (a dev number)
        required: true
      commit:
        description: The full SHA of the commit on main the tag names
        required: true
      runner:
        description: Passed to release.yml, hosted (GitHub, the default) or vps (the box)
        type: choice
        options: [hosted, vps]
        default: hosted
permissions:
  contents: write
  actions: write
concurrency:
  group: release-tag-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  tag:
    name: Tag the commit and start release.yml on it
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Windows, thornswood-vps]
    timeout-minutes: 5
    steps:
      # The inputs reach the script through env, never pasted into its text.
      - name: Hold the tag and the commit, make the tag, start release.yml
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_RUNNER: ${{ inputs.runner }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Stop-Run([string]$m) { Write-Host "::error::$m"; exit 1 }
          $tag = ([string]$env:INPUT_TAG).Trim()
          $commit = ([string]$env:INPUT_COMMIT).Trim().ToLowerInvariant()
          $runner = ([string]$env:INPUT_RUNNER).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+(\.\d+)?$') { Stop-Run "'$tag' is not v<a.b.c> or v<a.b.c.d>. Nothing was tagged." }
          if ($commit -notmatch '^[0-9a-f]{40}$') { Stop-Run "'$commit' is not a full commit SHA. Nothing was tagged." }
          if ($runner -notin 'hosted', 'vps') { Stop-Run "runner '$runner' is neither hosted nor vps. Nothing was tagged." }
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }

          # On main: main is the commit, or ahead of it with nothing behind.
          $cmp = Invoke-RestMethod -Method Get -Uri "$api/compare/$commit...main" -Headers $headers
          if ([string]$cmp.status -notin 'identical', 'ahead' -or [int]$cmp.behind_by -ne 0) {
            Stop-Run "commit $commit is not on main (GitHub's compare says $($cmp.status), $($cmp.behind_by) behind). Nothing was tagged."
          }

          # The tag as it is now: none, or already this commit.
          $have = $null
          try { $have = Invoke-RestMethod -Method Get -Uri "$api/git/ref/tags/$tag" -Headers $headers }
          catch { if ([int]$_.Exception.Response.StatusCode -ne 404) { throw } }
          if ($null -ne $have) {
            $sha = [string]$have.object.sha
            # An annotated tag names a tag object; the commit is behind it.
            if ([string]$have.object.type -eq 'tag') { $sha = [string](Invoke-RestMethod -Method Get -Uri "$api/git/tags/$sha" -Headers $headers).object.sha }
            if ($sha -ne $commit) { Stop-Run "$tag is already commit $sha, not $commit. A tag is never moved here; a new build is a new number." }
            Write-Host "$tag is already commit $commit"
          } else {
            $body = @{ ref = "refs/tags/$tag"; sha = $commit } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "$api/git/refs" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
            Write-Host "made $tag on commit $commit"
          }

          $run = @{ ref = $tag; inputs = @{ tag = $tag; expected_sha = $commit; runner = $runner } } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$api/actions/workflows/release.yml/dispatches" -Headers $headers -ContentType 'application/json' -Body $run | Out-Null
          Write-Host "started release.yml on $tag (runner: $runner first)"
