# Runs one verb of the deploy gate on the box (#2841), for a session that
# holds no key to the box: every cloud thread, the Cloud Desk included.
#
# WHY. Patrick, 25 Oct 2026, on #2841: the cloud key moves to a restricted,
# non-admin deploy account whose key runs one dispatcher with only the named
# Deploy, Install and Get-Logs verbs, and that key lives only where the
# release desk works, not in the default cloud environment. This project has
# one cloud environment, so the key is a secret of the GitHub environment
# "desk", which only main may use, the way staff-notice.yml holds the notices
# key. No cloud session ever holds it.
#
# HOW. A session runs
#
#   pwsh scripts/vps/Box-Run.ps1 -Line 'Deploy-DevGamemode -Restart'
#
# which starts this on main with the line and the public half of a key it
# made for this run. Here Box-Run.ps1 -OnTheBox logs in to the box's own sshd
# on 127.0.0.1 as thornswood-deploy. That account's key runs only
# C:\Thornswood-Gate\Gate.ps1, which hands the line to the gate's broker; the
# broker holds it to scripts/vps/gate/verbs.json and runs that script of main
# (scripts/deploy/Install-Gate.ps1 says the rest).
#
# WHAT THE LOG SHOWS. The verb, main's commit and the exit code, and nothing
# the verb printed: that, and every file it wrote, is sealed to the session's
# key and uploaded as the artifact box-run-sealed, kept for a day. Once the
# repository is public anyone can read a run's log and download its
# artifacts, and a deploy's output or the servers' logs are not for them.
#
# THE KEY. DESK_KEY_B64, written on One by
# .\scripts\vps\Grant-BoxAccess.ps1 -Name desk -Deploy -MakeKey -ToEnvironment desk,
# which also makes the environment usable by main alone. It is written to a
# folder of this run's own, used by the Microsoft-signed ssh.exe by its full
# path (not whatever ssh is first on a runner's PATH, which a pull request
# job could set), and removed when the step ends.
#
# Every action here is named by a full length commit SHA with its tag in the
# comment, for the reason build.yml gives.
name: Box run
run-name: Box run by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      line:
        description: 'The verb and its switches, as scripts/vps/gate/verbs.json allows'
        required: true
      recipient:
        description: 'The public half of the key the output is sealed to (Box-Run.ps1 makes it)'
        required: false
permissions:
  contents: read
# One verb at a time; the gate takes one anyway, and a second run waits here
# rather than at the gate's door.
concurrency:
  group: box-run
  cancel-in-progress: false
jobs:
  run:
    name: Ask the gate
    runs-on: [self-hosted, Windows, thornswood-vps]
    environment: desk
    # The longest verb's timeoutMinutes in verbs.json, and the wait for the gate.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A runner keeps its folder from one job to the next, and a checkout
      # there rewrites only the files that differ from the last job's commit,
      # so every other file keeps the line endings the last job's
      # .gitattributes gave it (#3029). Every tracked file is written again,
      # the way this commit checks it out.
      - name: Check every tracked file out again
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          git rm -r -q --cached .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git reset -q --hard HEAD
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Ask the gate
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          THORNSWOOD_DESK_KEY_B64: ${{ secrets.DESK_KEY_B64 }}
          BOX_LINE: ${{ inputs.line }}
          BOX_RECIPIENT: ${{ inputs.recipient }}
          BOX_RUN_SEALED: ${{ runner.temp }}/box-run-sealed/box-run.sealed
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/vps/Box-Run.ps1') -OnTheBox
          exit $LASTEXITCODE

      - name: Upload the sealed output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: box-run-sealed
          path: ${{ runner.temp }}/box-run-sealed/box-run.sealed
          if-no-files-found: ignore
          retention-days: 1

      - name: Leave nothing behind
        if: always()
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'box-run-sealed') -Recurse -Force -ErrorAction SilentlyContinue
