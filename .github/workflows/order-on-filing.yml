# A new issue gets an Order on the board the moment it is filed (#3534).
#
# WHY. Patrick chose on 27 Oct 2026 (the report page, answer A on #3534) that
# every open issue carries an Order, the board's one do-order, and that each
# new issue gets one when it is filed. On 26 Oct, 500 of 605 open issues had
# none, because Order was only ever set by hand or by an order: label.
#
# WHAT ORDER. 10000 plus the issue's number: after every Order a person or a
# review gives (the queue is below 1000, and the cards moved behind it on
# 26 Oct are between 1000 and 2000), in the order the issues were filed, and
# never the same as another card's, so two issues filed at once cannot share
# one and nothing has to read the board first. Where the issue really goes in
# the queue (Cloud, Game Breaking, Quick, then Everything else) is the board
# review's call; it moves the card with an order: label (board-status.yml),
# and scripts/ops/Check-Board.ps1 names any open issue still without one.
#
# WHAT IT DOES. It checks out nothing and runs no action. The issue comes from
# the event through the environment, never pasted into the script. With the
# board token it reads the board's Order field, adds the issue to the board
# (GitHub hands back the card it already has, so the board's own Auto-add
# making it first is fine) and sets Order. An issue that already has an Order
# keeps it.
#
# THE TOKEN. BOARD_TOKEN from the board environment, which only main may use,
# as in board-status.yml (its header says why it is a classic token). The
# run's own token is given nothing.
#
# WHERE IT RUNS. On the VPS runners while the repository is private, like
# board-status.yml and area-label.yml, for a few seconds per new issue, and on
# GitHub's runner once it is public, since anyone can open an issue on a
# public repository (#3685).
name: Order for a new issue
on:
  issues:
    types: [opened]
permissions: {}
jobs:
  order:
    name: Give the new issue its Order
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Windows", "thornswood-vps"]') || 'windows-latest' }}
    environment: board
    # A few calls to GitHub. Past this it is stuck, not slow.
    timeout-minutes: 3
    steps:
      - name: Set the card's Order to 10000 plus the issue's number
        shell: pwsh
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          BOARD_OWNER: EvilPatrick06
          BOARD_NUMBER: '1'
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_NODE: ${{ github.event.issue.node_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:BOARD_TOKEN) { throw 'BOARD_TOKEN is not set in the board environment, so nothing can reach the board (#2863 says how to make it)' }
          $number = 0
          if (-not [int]::TryParse($env:ISSUE, [ref]$number) -or $number -le 0) { throw "the event named no issue number ('$env:ISSUE')" }
          function Board([string]$query, [hashtable]$vars) {
            $h = @{ Authorization = "Bearer $env:BOARD_TOKEN"; 'Content-Type' = 'application/json' }
            $body = @{ query = $query; variables = $vars } | ConvertTo-Json -Depth 6 -Compress
            $r = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/graphql' -Headers $h -Body $body
            if ($r.PSObject.Properties['errors'] -and $r.errors) { throw ('the board answered: ' + (@($r.errors | ForEach-Object { $_.message }) -join '; ')) }
            return $r.data
          }

          $d = Board 'query($o:String!,$n:Int!){user(login:$o){projectV2(number:$n){id order:field(name:"Order"){... on ProjectV2Field{id dataType}}}}}' @{ o = $env:BOARD_OWNER; n = [int]$env:BOARD_NUMBER }
          $project = $d.user.projectV2
          if (-not $project) { throw "board $env:BOARD_NUMBER of $env:BOARD_OWNER is not there, or the token cannot see it" }
          $field = $project.order
          if (-not $field -or -not $field.PSObject.Properties['dataType'] -or $field.dataType -ne 'NUMBER') { throw 'the board has no number field named Order' }

          $item = (Board 'mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id fieldValueByName(name:"Order"){... on ProjectV2ItemFieldNumberValue{number}}}}}' @{ p = $project.id; c = $env:ISSUE_NODE }).addProjectV2ItemById.item
          if (-not $item -or -not $item.id) { throw "the board gave back no card for #$env:ISSUE" }
          $had = $item.fieldValueByName
          if ($had -and $had.PSObject.Properties['number'] -and $null -ne $had.number) {
            Write-Host ("#{0} already has Order {1}; it keeps it" -f $env:ISSUE, ([double]$had.number).ToString([Globalization.CultureInfo]::InvariantCulture))
            exit 0
          }
          $order = 10000 + $number
          $null = Board 'mutation($p:ID!,$i:ID!,$f:ID!,$v:ProjectV2FieldValue!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:$v}){projectV2Item{id}}}' @{ p = $project.id; i = $item.id; f = $field.id; v = @{ number = [double]$order } }
          Write-Host ("#{0}: Order set to {1}" -f $env:ISSUE, $order)
