# A pull request's release note is checked while it is open (#5179).
#
# WHY. A release's note was written at release time, from pull request titles
# meant for the team, by whoever shipped it. Each pull request now carries its
# own "Release note:" line (.github/pull_request_template.md), and
# scripts/release/Collect-ReleaseNotes.ps1 joins them into the release's note.
# Checking the line here, with the rules Ship.ps1 holds a note to
# (scripts/release/Note-Rules.ps1), means a release never stops on a note.
#
# WHEN. Opened, pushed to, reopened, and when the body is edited: the build
# check (build-pr.yml) does not run on an edit, so the note has its own small
# check, and fixing the body turns it green with no new push.
#
# WHAT IT RUNS. scripts/dev/Check-PrBody.ps1 on GitHub's Linux runner, from
# the pull request's own tree, with a read-only token and no secret. The body
# reaches it through the environment and a file, never pasted into the script.
#
# A PULL REQUEST THE WORKFLOW TOKEN OPENED (plan part 8). engine-pin.yml opens
# and updates engine-pin/next's pull request with the run's own token, which
# starts no pull_request run, so it starts this one by name on the branch
# once the body is written, as it does test-tasks.yml (#5199). That run reads
# the body of the open pull request whose head is the branch, through the
# API, with a token that only reads pull requests.
name: Pull request body
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-body-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-note:
    name: Release note
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Check the release note line
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'pr-body.md'
          $body = [string]$env:PR_BODY
          $author = [string]$env:PR_AUTHOR
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            # The open pull request whose head is this branch, in this repository.
            $owner = $env:GITHUB_REPOSITORY.Split('/')[0]
            $q = [uri]::EscapeDataString("${owner}:$env:HEAD_REF")
            $prs = @(gh api "repos/$env:GITHUB_REPOSITORY/pulls?state=open&head=$q" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { Write-Host "STOP  the open pull request of $env:HEAD_REF could not be read"; exit 1 }
            if ($prs.Count -ne 1) { Write-Host "STOP  $env:HEAD_REF heads $($prs.Count) open pull requests, not one, so there is no one body to check"; exit 1 }
            $body = [string]$prs[0].body
            $author = [string]$prs[0].user.login
            Write-Host "pull request #$($prs[0].number), opened by $author"
          }
          [IO.File]::WriteAllText($f, $body)
          ./scripts/dev/Check-PrBody.ps1 -BodyFile $f -Author $author
