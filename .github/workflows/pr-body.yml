# A pull request's release note is checked while it is open (#5179).
#
# WHY. A release's note was written at release time, from pull request titles
# meant for the team, by whoever shipped it. Each pull request now carries its
# own "Release note:" line (.github/pull_request_template.md), and
# scripts/release/Collect-ReleaseNotes.ps1 joins them into the release's note.
# Checking the line here, with the rules Ship.ps1 holds a note to
# (scripts/release/Note-Rules.ps1), means a release never stops on a note.
#
# WHEN. Opened, pushed to, reopened, and when the body is edited: the build
# check (build-pr.yml) does not run on an edit, so the note has its own small
# check, and fixing the body turns it green with no new push.
#
# WHAT IT RUNS. thornswood-notes (tools/ReleaseNotes, the release note rules
# in C#, plan rev 64) on GitHub's Linux runner, from the pull request's own
# tree and its locked packages, with a read-only token and no secret. The
# body reaches it through the environment and a file, never pasted into the
# script.
#
# IN THE MERGE QUEUE, AND REQUIRED. Main's ruleset requires this job,
# "Release note", beside Build check result and Test tasks in the pull
# request (records/github-repo-settings.json). Until 2 Nov 2026 it was not
# required, so the queue landed #5364 with this check red, and every merge
# release after it stopped at its notes (runs 41365299798 and 41367631056):
# a published Release never changes, so the release cannot go on without the
# line. The queue lands a pull request only once every required check has
# passed on its merge_group run, so this runs there too and reads the body of
# the pull request the queue's branch names
# (gh-readonly-queue/main/pr-<number>-<commit>), as test-tasks.yml does.
#
# A PULL REQUEST THE WORKFLOW TOKEN OPENED (plan part 8). engine-pin.yml opens
# and updates engine-pin/next's pull request with the run's own token, which
# starts no pull_request run, so it starts this one by name on the branch
# once the body is written, as it does test-tasks.yml (#5199). That run reads
# the body of the open pull request whose head is the branch, through the
# API, with a token that only reads pull requests.
name: Pull request body
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-body-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-note:
    name: Release note
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: tools/ReleaseNotes
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build the release note rules
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          dotnet restore tools/ReleaseNotes --locked-mode
          dotnet build tools/ReleaseNotes -c Release --no-restore -o "$RUNNER_TEMP/notes"
      - name: Check the release note line
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.ref_name }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'pr-body.md'
          $body = [string]$env:PR_BODY
          $author = [string]$env:PR_AUTHOR
          if ($env:GITHUB_EVENT_NAME -eq 'merge_group') {
            # The pull request the queue's branch names, its body as it is now.
            if ($env:QUEUE_REF -notmatch '^(refs/heads/)?gh-readonly-queue/[^/]+/pr-(\d+)-[0-9a-f]{40}$') { Write-Host "STOP  the merge queue's branch names no pull request: $env:QUEUE_REF"; exit 1 }
            $num = $Matches[2]
            $pr = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$num" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { Write-Host "STOP  pull request #$num could not be read"; exit 1 }
            $body = [string]$pr.body
            $author = [string]$pr.user.login
            Write-Host "pull request #$($pr.number) in the merge queue, opened by $author"
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            # The open pull request whose head is this branch, in this repository.
            $owner = $env:GITHUB_REPOSITORY.Split('/')[0]
            $q = [uri]::EscapeDataString("${owner}:$env:HEAD_REF")
            $prs = @(gh api "repos/$env:GITHUB_REPOSITORY/pulls?state=open&head=$q" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { Write-Host "STOP  the open pull request of $env:HEAD_REF could not be read"; exit 1 }
            if ($prs.Count -ne 1) { Write-Host "STOP  $env:HEAD_REF heads $($prs.Count) open pull requests, not one, so there is no one body to check"; exit 1 }
            $body = [string]$prs[0].body
            $author = [string]$prs[0].user.login
            Write-Host "pull request #$($prs[0].number), opened by $author"
          }
          [IO.File]::WriteAllText($f, $body)
          $with = @('pr', '--body-file', $f)
          if ($author) { $with += @('--author', $author) }
          dotnet (Join-Path $env:RUNNER_TEMP 'notes/thornswood-notes.dll') @with
          exit $LASTEXITCODE
