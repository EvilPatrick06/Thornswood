# A pull request's release note is checked while it is open (#5179).
#
# WHY. A release's note was written at release time, from pull request titles
# meant for the team, by whoever shipped it. Each pull request now carries its
# own "Release note:" line (.github/pull_request_template.md), and
# scripts/release/Collect-ReleaseNotes.ps1 joins them into the release's note.
# Checking the line here, with the rules Ship.ps1 holds a note to
# (scripts/release/Note-Rules.ps1), means a release never stops on a note.
#
# WHEN. Opened, pushed to, reopened, and when the body is edited: the build
# check (build-pr.yml) does not run on an edit, so the note has its own small
# check, and fixing the body turns it green with no new push.
#
# WHAT IT RUNS. scripts/dev/Check-PrBody.ps1 on GitHub's Linux runner, from
# the pull request's own tree, with a read-only token and no secret. The body
# reaches it through the environment and a file, never pasted into the script.
name: Pull request body
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  release-note:
    name: Release note
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Check the release note line
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'pr-body.md'
          [IO.File]::WriteAllText($f, [string]$env:PR_BODY)
          ./scripts/dev/Check-PrBody.ps1 -BodyFile $f -Author $env:PR_AUTHOR
