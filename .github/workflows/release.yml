# The launcher exe that ships is built HERE, on a clean runner, not on the
# machine of whoever runs Ship. Issue #457: CI builds the shipped launcher exe,
# and Ship publishes the runner's artifact, verified by its checksum file,
# instead of compiling the binary that reaches every launcher locally.
#
# WHAT IT DOES. On a tag v<version> it checks the tag out clean, runs
# scripts\release\Build-Launcher.ps1 into a folder under RUNNER_TEMP so it
# never touches a Desktop shortcut or closes a game on a real machine, signs
# Thornswood.exe through Azure Artifact Signing (on GitHub's runner, on a v
# tag), writes SHA256SUMS beside it, and attaches them to a DRAFT release for
# that tag. A person promotes the draft; Ship reads a draft's assets fine.
# Ship then downloads Thornswood.exe and SHA256SUMS and refuses to ship unless
# the checksum matches. SHA256SUMS is written AFTER signing, so it describes
# the signed bytes the draft carries.
#
# THE SETUP PROGRAM TOO, issue #932. The same build compiles setup-stub.exe,
# the program the installer is built around, into out\ of the checkout. It is
# attached beside the launcher and listed in the same SHA256SUMS. It is NOT
# signed here, on purpose: Package-Thornswood.ps1 appends the OneFile trailer
# to it and signs the finished Setup, and a stub signed first cannot be signed
# again after that append (Build-Launcher.ps1, "Do NOT sign setup-stub.exe").
#
# WHERE IT RUNS (#2163, Patrick's decisions of 12 Oct, relayed by Smeagle;
# switched over by #3312, Patrick, 22 Oct: "it needs to work like the VPS
# runners where VPS is the fallback and the GitHub runner is first"). GitHub's
# hosted windows-latest, in the job "launcher" below, the same image the
# build check (build.yml, build-pr.yml) proves green on every pull request,
# builds and signs every release first. The box ("launcher-vps") picks a
# release up the way build.yml's fallback does: the repository variable
# BUILD_RUNNER is vps, a manual run asks for the box, or the hosted job
# failed, as a quota or billing stop fails it before any step runs. Every
# launcher since 1.2.4.5 on dev and 1.2.5 on main is built by MSBuild (#498).
# tests\test-release-workflow.ps1 holds the shape.
#
# THE BOX SIGNS ON RUNNER 3 ONLY (#3312, Patrick, 22 Oct: "for signing it
# will use runner 3"). The fallback asks for the label thornswood-sign beside
# thornswood-vps, and only the runners records\sign-runners.json lists carry
# it (a push that changes the record puts GitHub right by itself, and
# scripts\deploy\Set-BuildRunners.ps1 asks again, #3107). Runner 3 is the
# light runner (docs\DECIDED.md), never a build runner, so the job that can
# sign never shares a runner with pull request code, and the "verify" job,
# on the build runners, never runs where the launcher was signed.
#
# HOW IT BUILDS (#498, Patrick's option C, switched 15 Oct). On both runners
# the launcher and setup program are built by MSBuild from
# launcher\app\Thornswood.csproj and installer\setup\Setup.csproj
# (Build-Launcher.ps1, which has no other way). The VPS runners have MSBuild
# from Bootstrap-VPS.ps1 -IncludeBuildTools (Patrick, 12 Oct, option A).
#
# HOW IT SIGNS (#2163 section 8, both runners since #3312). A federated
# (OIDC) identity, no secret stored anywhere: GitHub mints a short token for
# this job only, and only on a v tag, through the "release" environment,
# whose subject is the one the Azure federated credential trusts (it names the
# environment, not the runner, so the box's job presents the same one). Pull
# request jobs never get it; this file has no pull_request trigger. The sign
# step asks GitHub for the token itself, writes it to a file under
# RUNNER_TEMP for the length of one signtool call, and names it to Microsoft's
# signing client the way Azure's workload identity reads one
# (AZURE_FEDERATED_TOKEN_FILE beside the app and tenant ids); the file goes
# when the call ends. No Azure CLI is needed and no sign in is kept anywhere,
# which matters on the box: an az login would sit in the runner account's
# profile after the job. Sign-Artifact.ps1 -Required signs with the
# ThornswoodRelease profile, the same script and profile Ship uses, with
# Microsoft's signing client fetched at the version and sha256
# Setup-ShipMachine.ps1 pins. A signing failure fails the job and no draft
# gets the file. A run that is not on a v tag ref builds unsigned and says so.
#
# DEV NUMBERS (#3312). A dev Ship's launcher carries a fourth number
# (1.2.6.7) that only ever lives in the dev feed: Ship works it out from what
# main and dev have published and writes it into Updater.cs before it builds.
# A Ship that cannot build here (the cloud) asks for the tag v<that number>
# on main's commit (release-tag.yml makes it, since a cloud session cannot
# push one), and the step "Put the tag's number in Updater.cs" writes it in
# the same way Ship does. A three part tag is a main release and must be the
# number Updater.cs already says (Bump-Version.ps1 moved it).
#
# CHECKED ON A SECOND MACHINE (#2163, "a clean machine verifies"). When either
# job drafted a signed launcher, the "verify" job downloads the draft's files
# onto a VPS build runner, which holds no signing setup and is never the
# runner that signed, and runs scripts\release\Test-ReleaseFiles.ps1
# -RequireSigned: each file against SHA256SUMS, then the publish gate and the
# launcher's own Signature.cs on the launcher. A red verify means the draft
# must not be shipped. Off the box altogether, the engine fork's
# thornswood-sign-manifest.yml holds the launcher a release from the feed
# names to the same check on GitHub's runner before it signs the release
# (Sign-OnGitHub.ps1).
#
# ONE DRAFT PER TAG (#2462). GET /releases/tags/<tag> never returns a draft
# (measured 12 Oct: it answered 404 for v1.2.4 while release 410844061 was
# its draft), so a run that looked there made a second draft every time a
# tag was built again; v1.1.96 has two. The draft step reads the releases
# list, which does hold drafts, uploads into the one draft the tag has, and
# stops when the tag has more than one release or its release is already
# published (a new build is a new tag, never a replaced asset). The
# concurrency group is the tag, so a tag push and a manual run for the same
# tag queue instead of racing. test-release-workflow.ps1 holds the shape.
#
# WHY IT IS PINNED. Every action is pinned to a full-length commit SHA: a
# moved tag on an action cannot change what runs.
name: Release launcher
on:
  push:
    tags:
      - 'v*'
  # So the exe can be rebuilt for a tag that already exists without moving it,
  # for a first trial or a runner that died halfway, and so release-tag.yml
  # can start it on a tag it made (a tag the repository token pushes starts
  # no workflow). A signed draft needs the run started on the tag itself,
  # because only a refs/tags/v ref gets the signing identity:
  #   gh workflow run release.yml --ref v<version> -f tag=v<version>
  # A run started from a branch builds unsigned.
  workflow_dispatch:
    inputs:
      tag:
        description: The v<version> tag to build and draft a release for
        required: true
      expected_sha:
        description: The commit the tag must be (optional; without it the tag's commit must be on main)
        required: false
        default: ''
      runner:
        description: 'hosted (GitHub, the default) or vps (the box, the fallback, signing on runner 3)'
        type: choice
        options: [hosted, vps]
        default: hosted
# The draft release is created with the repository token, which needs write.
# The two build jobs add id-token: write for themselves only.
permissions:
  contents: write
# One run per TAG, whichever way it was started. A release build is not
# cancelled by a newer one: a tag push and a manual run for the same tag
# queue rather than race for the one draft. Keyed on github.ref, as it was,
# a manual run from main and the tag's own push were two groups, which is how
# v1.1.96 got two drafts in the same second.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  # GitHub's hosted Windows runner (#2163), first (header, WHERE IT RUNS).
  # Skipped when BUILD_RUNNER is vps or a manual run asked for the box, and
  # then the VPS job below builds the release instead.
  launcher:
    name: Build the release launcher
    if: ${{ vars.BUILD_RUNNER != 'vps' && inputs.runner != 'vps' }}
    runs-on: windows-latest
    # The "release" environment only on a v tag: its subject is what the Azure
    # federated credential trusts, and its deployment rule allows v* tags only.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
    # What the "verify" job needs to find the draft and check it.
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      commit: ${{ steps.tag.outputs.commit }}
      signed: ${{ steps.draft.outputs.signed }}
    # The build is a few minutes; past this it is stuck, not slow.
    timeout-minutes: 30
    steps: &release
      # THE TAG IS CHECKED BEFORE IT IS BUILT (#2202). A manual run used to
      # hand its free-form tag input straight to checkout and draft the
      # release against the run's own SHA, so a branch, a bare SHA or a tag
      # off main could be built and labelled as a release. Now the workflow's
      # own commit is checked out with every tag and main, and
      # scripts/release/Resolve-ReleaseTag.ps1 says which commit the tag is:
      # a real v<version> tag, and either the expected SHA (a tag push's own
      # GITHUB_SHA, or the manual run's expected_sha) or a commit on main.
      # Anything else stops the run before anything is built. The input
      # reaches the script through env, never pasted into the script text.
      - name: Check out the workflow's commit, with every tag and main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          submodules: false
          fetch-depth: 0

      - name: Confirm the tag is the commit meant, then check it out
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          . .\scripts\release\Resolve-ReleaseTag.ps1
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $tag = $env:INPUT_TAG; $expected = $env:INPUT_SHA }
          else { $tag = $env:GITHUB_REF_NAME; $expected = $env:GITHUB_SHA }
          try { $commit = Resolve-ThornswoodReleaseTag -Tag $tag -RepoDir . -ExpectedSha $expected -MainRef origin/main }
          catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          git checkout --force --detach $commit
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not check out $commit"; exit 1 }
          git clean -ffdx
          $head = "$(git rev-parse HEAD)".Trim()
          if ($head -ne $commit) { Write-Host "::error::checked out $head, not $commit"; exit 1 }
          Write-Host ("tag {0} is commit {1}" -f $tag, $commit)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("tag=" + $tag)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("commit=" + $commit)

      # DEV NUMBERS (header). Ship.ps1's own replace, so the exe built here
      # carries its number exactly as one built by a dev Ship on One would.
      - name: Put the tag's number in Updater.cs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $want = $env:RELEASE_TAG.Substring(1)
          if ($want -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { Write-Host "::error::tag $($env:RELEASE_TAG) is not v<a.b.c> (main) or v<a.b.c.d> (dev)"; exit 1 }
          $cs = 'launcher\app\Updater.cs'
          $src = [IO.File]::ReadAllText($cs)
          $m = [regex]::Match($src, 'Version\s*=\s*"([^"]+)"')
          if (-not $m.Success) { Write-Host '::error::could not read the version out of launcher\app\Updater.cs'; exit 1 }
          $have = $m.Groups[1].Value
          $parts = $want.Split('.')
          if ($parts.Count -eq 3) {
            if ($have -ne $want) { Write-Host "::error::$($env:RELEASE_TAG) is a main release, and Updater.cs at its commit says $have. Move it with Bump-Version.ps1 and its pull request, then tag that."; exit 1 }
            Write-Host "Updater.cs says $want, the tag's number"
            exit 0
          }
          # A dev number climbs from the higher of the commit's number and
          # main's published one (Ship.ps1), so it is never below the commit's.
          if ([version](($parts[0..2]) -join '.') -lt [version]$have) { Write-Host "::error::dev number $want is below the $have Updater.cs says at this commit"; exit 1 }
          $src = $src -replace 'Version\s*=\s*"[^"]+"', ('Version = "' + $want + '"')
          [IO.File]::WriteAllText((Resolve-Path $cs).Path, $src, (New-Object Text.UTF8Encoding $false))
          Write-Host "Updater.cs: $have -> $want (a dev number, as a dev Ship writes it)"

      - name: Build the launcher into RUNNER_TEMP
        shell: pwsh
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          # RUNNER_TEMP, not a real install root, so Install-Launcher is never
          # run and no Desktop shortcut, icon cache or Stop-Game is touched.
          # MSBuild and the two project files on either runner (#498).
          # -NoSign: signing is its own step below, -Required, never "skip if
          # no config".
          Write-Host ("building with MSBuild on a {0} runner" -f $env:RUNNER_KIND)
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Launcher') | Out-Null
          .\scripts\release\Build-Launcher.ps1 -Root $root -NoSign -NoPause
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Build-Launcher.ps1 failed"; exit 1 }
          $exe = Join-Path $root 'Launcher\Thornswood.exe'
          if (-not (Test-Path $exe)) { Write-Host '::error::no Thornswood.exe came out of the build'; exit 1 }
          # The setup program the same build compiled (issue #932).
          if (-not (Test-Path 'out\setup-stub.exe')) { Write-Host '::error::no setup-stub.exe came out of the build'; exit 1 }

      # SIGNING (#2163 section 8, both runners since #3312): a v tag, nothing
      # else. Microsoft's signing client comes first, at the version and
      # sha256 Setup-ShipMachine.ps1 pins, lifted out of it by the parser so
      # the pin lives in one place; nothing is unpacked unless the bytes match.
      # It goes into records\signing\client of this checkout, which git
      # ignores; "Take the signing setup off this runner" removes it again.
      - name: Fetch the signing client Setup-ShipMachine.ps1 pins
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $src = [IO.File]::ReadAllText((Resolve-Path 'scripts\release\Setup-ShipMachine.ps1'))
          $t = $null; $e = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$t, [ref]$e)
          foreach ($name in 'Get-SigningClientPin', 'Get-Sha256', 'Save-Url', 'Save-SigningClient') {
            $fn = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name }, $true)
            if (-not $fn) { Write-Host "::error::Setup-ShipMachine.ps1 has no $name"; exit 1 }
            . ([scriptblock]::Create($fn.Extent.Text))
          }
          $repo = (Get-Location).Path
          $why = Save-SigningClient $repo (Get-SigningClientPin) ${function:Save-Url} (Join-Path $env:RUNNER_TEMP 'signing-client')
          if ($why) { Write-Host ('::error::' + $why); exit 1 }
          # signing.json from the tracked template: paths only, no key. It is
          # gitignored and lives on this runner for this job only.
          Copy-Item -LiteralPath 'records\signing\signing.template.json' -Destination 'records\signing\signing.json' -Force

      # The ids are not secrets (they name the app registration and the
      # tenant, and grant nothing without the federated credential), so they
      # are repository variables Patrick set on 12 Oct. The token is asked for
      # here, right before signtool, and lives in a file under RUNNER_TEMP for
      # that one call: Microsoft's signing client signs in through Azure's
      # DefaultAzureCredential, whose workload identity credential reads
      # AZURE_FEDERATED_TOKEN_FILE beside AZURE_CLIENT_ID and AZURE_TENANT_ID
      # (header, HOW IT SIGNS).
      - name: Sign the launcher with ThornswoodRelease (OIDC, no secret)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:AZURE_TENANT_ID) { Write-Host '::error::the AZURE_SIGNING_CLIENT_ID and AZURE_SIGNING_TENANT_ID repository variables are not set'; exit 1 }
          if (-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) { Write-Host '::error::GitHub gave this job no OIDC token to ask for (id-token: write and the release environment)'; exit 1 }
          $exe = Join-Path $env:RUNNER_TEMP 'Thornswood\Launcher\Thornswood.exe'
          $tokenFile = Join-Path $env:RUNNER_TEMP 'azure-federated-token'
          try {
            $answer = Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=api://AzureADTokenExchange') -Headers @{ Authorization = ('bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) } -ErrorAction Stop
            if (-not $answer.value) { Write-Host '::error::GitHub answered the OIDC request with no token'; exit 1 }
            Write-Host ('::add-mask::' + $answer.value)
            [IO.File]::WriteAllText($tokenFile, [string]$answer.value)
            $env:AZURE_FEDERATED_TOKEN_FILE = $tokenFile
            & .\scripts\release\Sign-Artifact.ps1 -Path $exe -Required
            $rc = $LASTEXITCODE
          } finally {
            Remove-Item -LiteralPath $tokenFile -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\AZURE_FEDERATED_TOKEN_FILE -ErrorAction SilentlyContinue
          }
          if ($rc -ne 0) { Write-Host '::error::signing failed; no draft gets this exe'; exit 1 }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne 'Valid') { Write-Host ('::error::the signed exe reads back ' + $sig.Status); exit 1 }
          if (-not $sig.TimeStamperCertificate) { Write-Host '::error::the signed exe has no timestamp'; exit 1 }
          Write-Host ('signed by ' + $sig.SignerCertificate.Subject + ' on a ' + $env:RUNNER_ENVIRONMENT + ' runner')

      - name: Collect the exe and the setup program, and write SHA256SUMS
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          $out = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath (Join-Path $root 'Launcher\Thornswood.exe') -Destination (Join-Path $out 'Thornswood.exe') -Force
          Copy-Item -LiteralPath 'out\setup-stub.exe' -Destination (Join-Path $out 'setup-stub.exe') -Force
          # The sha256sum shape, "<hash>  <name>" with two spaces, one line
          # each, so both `sha256sum -c` and Ship read the same file. Written
          # after signing, so it names the bytes the draft carries.
          $lines = @()
          foreach ($n in 'Thornswood.exe', 'setup-stub.exe') {
            $hash = (Get-FileHash -LiteralPath (Join-Path $out $n) -Algorithm SHA256).Hash.ToLower()
            $lines += ("$hash  $n")
            Write-Host ("SHA256  {0}  {1}" -f $hash, $n)
          }
          Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS') -Value $lines -Encoding ascii

      - name: Draft a release with the exe, the setup program and their checksums
        id: draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          # The tag and commit the check above settled, so the draft names the
          # commit that was built, not whatever ref started the run (#2202).
          $tag = $env:RELEASE_TAG
          if (-not $tag -or $env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') { Write-Host '::error::the tag check gave no tag and commit'; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP 'release'
          $exe = Join-Path $out 'Thornswood.exe'
          $stub = Join-Path $out 'setup-stub.exe'
          $sums = Join-Path $out 'SHA256SUMS'
          $signed = (Get-AuthenticodeSignature -LiteralPath $exe).Status -eq 'Valid'
          $how = 'built on the VPS runner with MSBuild (#498), the fallback when GitHub''s runner did not build it (#3312)'
          if ($env:RUNNER_KIND -eq 'github-hosted') { $how = 'built on GitHub''s runner with MSBuild (#498)' }
          if ($signed) { $how += ', the launcher signed by ThornswoodRelease (#2163)' }
          else { $how += ', UNSIGNED (not a v tag ref): Ship signs it on download (#921)' }
          $notes = "Launcher exe and setup program for $tag, $how, and verified by SHA256SUMS. Ship downloads these and checks the checksums instead of compiling the shipped binaries (issues #457 and #932).`n`nSource for the SkyMP files Thornswood ships: https://thornswood.net/credits#source"
          # A draft: a person promotes it, and Ship reads a draft's assets. If a
          # run for this tag already made the draft, upload into it instead.
          # Use the GitHub REST API directly; the dedicated runner does not
          # require the GitHub CLI to be installed on its PATH.
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          # The releases list, not /releases/tags/<tag>: only the list holds
          # drafts (header, ONE DRAFT PER TAG). Newest first, a page at a time,
          # until a short page says there is no more.
          $same = @()
          for ($page = 1; $page -le 50; $page++) {
            # Through ForEach-Object so the page is one release per item whether
            # or not this PowerShell unrolled the JSON array itself.
            $batch = @(Invoke-RestMethod -Method Get -Uri "$api/releases?per_page=100&page=$page" -Headers $headers -ErrorAction Stop | ForEach-Object { $_ })
            $same += @($batch | Where-Object { $_.tag_name -eq $tag })
            if ($batch.Count -lt 100) { break }
          }
          if ($same.Count -gt 1) {
            Write-Host ("::error::tag $tag already has {0} releases ({1}). Delete the ones that are not wanted, then run this again: gh api -X DELETE repos/$repo/releases/<id>" -f $same.Count, (($same | ForEach-Object { [string]$_.id }) -join ', '))
            exit 1
          }
          $release = $null
          if ($same.Count -eq 1) {
            $release = $same[0]
            if (-not $release.draft) {
              Write-Host "::error::the release for $tag ($($release.id)) is already published, and a published release's files are never replaced (docs\SIGNED-RELEASES.md section 6). A new build is a new tag."
              exit 1
            }
            Write-Host ("uploading into the draft {0} that tag {1} already has" -f $release.id, $tag)
            # Its notes were written by the run that made it, and this run's
            # files replace that run's: a VPS draft rebuilt signed on GitHub's
            # runner kept saying UNSIGNED. The notes say how THESE files were
            # built, so they are written again with them.
            $patch = @{ body = $notes } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body $patch -ErrorAction Stop
          }
          if (-not $release) {
            $payload = @{
              tag_name = $tag
              target_commitish = $env:RELEASE_COMMIT
              name = "Launcher $tag"
              body = $notes
              draft = $true
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $payload
          }
          foreach ($asset in @($exe, $stub, $sums)) {
            $assetName = [IO.Path]::GetFileName($asset)
            $existing = @($release.assets | Where-Object { $_.name -eq $assetName })
            foreach ($item in $existing) {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($item.id)" -Headers $headers -ErrorAction Stop | Out-Null
            }
            $encodedName = [Uri]::EscapeDataString($assetName)
            $uploadUri = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encodedName"
            Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType 'application/octet-stream' -InFile $asset -ErrorAction Stop | Out-Null
          }
          Write-Host ("draft {0} for {1} holds Thornswood.exe ({2}), setup-stub.exe and SHA256SUMS" -f $release.id, $tag, $(if ($signed) { 'signed' } else { 'unsigned' }))
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("release_id=" + $release.id)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("signed=" + $(if ($signed) { 'true' } else { 'false' }))

      # A runner keeps its folder from one job to the next, so the signing
      # setup this job put in the checkout goes again whatever happened above.
      # The token file under RUNNER_TEMP went with its signtool call.
      - name: Take the signing setup off this runner
        if: ${{ always() }}
        shell: pwsh
        run: |
          foreach ($p in 'records\signing\signing.json', 'records\signing\client') {
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force }
          }

  # THE VPS JOB, the fallback the same way build.yml has it (#1306, #2163,
  # #3312). It runs whenever the hosted job did not succeed and the run was
  # not cancelled:
  #   - BUILD_RUNNER is vps, or a manual run asked for runner: vps, which
  #     skip the hosted job;
  #   - the hosted job failed (a quota or billing stop fails it before any
  #     step runs). A real red fails here too; that is the price of not
  #     telling a quota stop from a build failure.
  # !cancelled(), not always() (#2422): a cancelled run never leaves the box
  # building a release nobody wants. The steps are the hosted job's own, by
  # the YAML anchor, so the two cannot drift, the signing included: on a v
  # tag this job has the release environment and its OIDC token the way the
  # hosted job does, and signs on runner 3 alone (header, THE BOX SIGNS ON
  # RUNNER 3 ONLY).
  launcher-vps:
    name: Build the release launcher (VPS)
    needs: launcher
    if: ${{ !cancelled() && needs.launcher.result != 'success' && needs.launcher.result != 'cancelled' }}
    runs-on: [self-hosted, Windows, X64, thornswood-vps, thornswood-sign]
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      commit: ${{ steps.tag.outputs.commit }}
      signed: ${{ steps.draft.outputs.signed }}
    # The build is about two minutes; past this it is stuck, not slow.
    timeout-minutes: 20
    steps: *release

  # A SECOND MACHINE CHECKS THE SIGNED DRAFT (#2163). After whichever job
  # drafted a signed launcher. It asks for a build runner (thornswood-build,
  # records\build-runners.json) though it is a light job, because those are
  # the runners that are never runner 3, which signs, so the runner
  # that checks holds no signing client, no signing.json and no Azure token
  # and is not the one that signed: what it accepts it accepts on the files
  # alone, the way an installed launcher does. contents: write only because
  # a draft release is visible to nobody without push access.
  verify:
    name: Check the signed draft on a second machine (VPS)
    needs: [launcher, launcher-vps]
    if: ${{ !cancelled() && ((needs.launcher.result == 'success' && needs.launcher.outputs.signed == 'true') || (needs.launcher-vps.result == 'success' && needs.launcher-vps.outputs.signed == 'true')) }}
    runs-on: [self-hosted, Windows, thornswood-vps, thornswood-build]
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      DRAFT_ID: ${{ needs.launcher.result == 'success' && needs.launcher.outputs.release_id || needs.launcher-vps.outputs.release_id }}
      DRAFT_COMMIT: ${{ needs.launcher.result == 'success' && needs.launcher.outputs.commit || needs.launcher-vps.outputs.commit }}
    steps:
      - name: Check out the commit the draft was built from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DRAFT_COMMIT }}
          clean: true
          submodules: false

      # A runner keeps its folder from one job to the next, and a checkout
      # there rewrites only the files that differ from the last job's commit,
      # so every other file keeps the line endings the last job's
      # .gitattributes gave it (#3029). Every tracked file is written again,
      # the way this commit checks it out.
      - name: Check every tracked file out again
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          git rm -r -q --cached .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git reset -q --hard HEAD
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Download the draft's files and check them
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ env.DRAFT_ID }}
        run: |
          if ($env:RELEASE_ID -notmatch '^[0-9]+$') { Write-Host '::error::the build job gave no release id'; exit 1 }
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod -Method Get -Uri "$api/releases/$($env:RELEASE_ID)" -Headers $headers -ErrorAction Stop
          $dir = Join-Path $env:RUNNER_TEMP 'draft'
          if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # Each file by its asset id, as bytes: the octet-stream answer is a
          # redirect to the file, and PowerShell 7 drops the token on it.
          $bin = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2022-11-28' }
          foreach ($n in 'Thornswood.exe', 'setup-stub.exe', 'SHA256SUMS') {
            $a = @($release.assets | Where-Object { $_.name -eq $n })
            if ($a.Count -ne 1) { Write-Host ("::error::draft {0} has {1} files named {2}" -f $env:RELEASE_ID, $a.Count, $n); exit 1 }
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri "$api/releases/assets/$($a[0].id)" -Headers $bin -OutFile (Join-Path $dir $n) -UseBasicParsing -ErrorAction Stop
          }
          & .\scripts\release\Test-ReleaseFiles.ps1 -Dir $dir -RequireSigned
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::draft $($env:RELEASE_ID) did not pass on a second machine; do not ship it"; exit 1 }
