# The launcher exe that ships is built HERE, on a clean runner, not on the
# machine of whoever runs Ship. Issue #457: CI builds the shipped launcher exe,
# and Ship publishes the runner's artifact, verified by its checksum file,
# instead of compiling the binary that reaches every launcher locally.
#
# WHAT IT DOES. On a tag v<version> it checks the tag out clean, runs
# scripts\release\Build-Launcher.ps1 into a folder under RUNNER_TEMP so it
# never touches a Desktop shortcut or closes a game on a real machine, signs
# every program of the launcher through Azure Artifact Signing (in a run of
# main's own workflow, below), writes SHA256SUMS beside them, and attaches
# them to a DRAFT release for that tag. A person promotes the draft; Ship
# reads a draft's assets fine. Ship then downloads Thornswood.exe and
# SHA256SUMS and refuses to ship unless the checksum matches. SHA256SUMS is
# written AFTER signing, so it describes the signed bytes the draft carries.
#
# THE LAUNCHER IS A FOLDER (#4823). Compiled to native code, Thornswood.exe
# needs the native libraries Avalonia draws with beside it, so every .exe and
# .dll the publish leaves goes on the draft, signed, each with its own line
# in SHA256SUMS; Thornswood.pdb, the symbols, does not. So do app.ico and
# app-dev.ico, the icons the exe embeds, which Build-Launcher.ps1 writes
# beside it: Install-Launcher.ps1 names the shortcuts' icon file after the
# art the exe carries (#887), and a native exe's resources cannot be read
# back out of it. They are not programs, so they are not signed; their
# lines in SHA256SUMS hold them. The setup program
# this build also made until #4824 (setup-stub.exe) went with the old
# installer: the download is Velopack's Setup.exe, which merge-release.yml
# makes.
#
# WHERE IT RUNS (#2163, Patrick's decisions of 12 Oct, relayed by Smeagle;
# #4013, Patrick's A of 27 Oct 2026). GitHub's hosted windows-latest, the
# same image the build check (build.yml, build-pr.yml) proves green on every
# pull request, builds and signs every release, and every other job here is
# GitHub's too. From #3312 to the day this repository went public the box
# built and signed one when GitHub's runner could not (hosted minutes ran
# out), on runner 3. A public repository has GitHub's runners free with no
# minute limit and no runner of the box registered to it (#3685, #3792), so
# that fallback ended with the flip rather than moving to the private ops
# repository, which would have needed a second Azure federated credential
# and a stored token that writes releases here. If GitHub's runner cannot
# build a release, a Ship on One signs the unsigned launcher on download
# (#921). tests\test-release-workflow.ps1 holds the shape.
#
# HOW IT BUILDS (#4823). The .NET 10 SDK publishes launcher\app\Thornswood.csproj
# compiled to native code (Build-Launcher.ps1, which has no other way), so
# the job sets that SDK up first, at the same pinned action as the build
# check. From #498 (15 Oct) to #4823 MSBuild built it, and before that the
# .NET Framework's own compiler.
#
# HOW IT SIGNS (#2163 section 8). A federated
# (OIDC) identity, no secret stored anywhere: GitHub mints a short token for
# this job only, and only in a run of main's own workflow (below), through
# the "release" environment,
# whose subject is the one the Azure federated credential trusts. Pull
# request jobs never get it; this file has no pull_request trigger. The sign
# step asks GitHub for the token itself, writes it to a file under
# RUNNER_TEMP for the length of one signtool call, and names it to Microsoft's
# signing client the way Azure's workload identity reads one
# (AZURE_FEDERATED_TOKEN_FILE beside the app and tenant ids); the file goes
# when the call ends. No Azure CLI is needed and no sign in is kept anywhere.
# Sign-Artifact.ps1 -Required signs with the
# ThornswoodRelease profile, the same script and profile Ship uses, with
# Microsoft's signing client fetched at the version and sha256
# Setup-ShipMachine.ps1 pins. A signing failure fails the job and no draft
# gets the file. A run that is not main's builds unsigned and says so.
#
# ONLY A RUN OF MAIN'S OWN WORKFLOW SIGNS (#3930, Patrick, 27 Oct, option 1
# on his report page). Signing used to follow a refs/tags/v ref. A v tag push
# runs the tagged commit's OWN copy of this file, so a tag pushed on a branch
# commit whose copy left out the tag check still got the "release"
# environment and signed, though main's copy refuses a commit off main
# (#3890). Now a job signs only when the run is a workflow_dispatch on
# refs/heads/main: that is main's copy of this file and of
# Resolve-ReleaseTag.ps1, which only a pull request changes, and it builds a
# tag only when the tag's commit is on main. The "release" environment's
# deployment rule names the branch main and nothing else (Settings,
# Environments; the ops repo's ops\claude-queue\3930-sign-from-main.md), so a
# copy on any other ref cannot reach the identity whatever it says. A v tag
# push builds nothing itself: its one job hands the tag to main's workflow
# (gh workflow run release.yml --ref main -f tag=<tag> -f expected_sha=<its
# commit>), so pushing a tag still starts a signed release, through main.
#
# DEV NUMBERS (#3312). A dev Ship's launcher carries a fourth number
# (2026.1101.1745.7) that only ever lives in the dev feed: Ship works it out
# from what main and dev have published. A Ship that cannot build here (the
# cloud) asks for the tag v<that number> on main's commit (release-tag.yml
# makes it, since a cloud session cannot push one). Since #5179 main's number
# is not committed either: it is the time the launcher's sources last changed
# at the tag's commit (scripts\release\LauncherVersion.ps1), which needs the
# history this checkout fetches. A three part tag is a main release and must
# be that number; a four part one starts with it. Build-Launcher.ps1 -Version
# writes it in for the compile, the same way Ship does.
#
# CHECKED ON A SECOND MACHINE (#2163, "a clean machine verifies"). When the
# build drafted a signed launcher, the "verify" job downloads the draft's
# files onto a fresh GitHub runner of its own, which holds no signing setup
# and is not the one that signed, and runs scripts\release\Test-ReleaseFiles.ps1
# -RequireSigned: each file against SHA256SUMS, then the publish gate and the
# launcher's own Signature.cs on the launcher. A red verify means the draft
# must not be shipped. Off the box altogether, the engine fork's
# thornswood-sign-manifest.yml holds the launcher a release from the feed
# names to the same check on GitHub's runner before it signs the release
# (Sign-OnGitHub.ps1).
#
# ONE DRAFT PER TAG (#2462). GET /releases/tags/<tag> never returns a draft
# (measured 12 Oct: it answered 404 for v1.2.4 while release 410844061 was
# its draft), so a run that looked there made a second draft every time a
# tag was built again; v1.1.96 has two. The draft step reads the releases
# list, which does hold drafts, uploads into the one draft the tag has, and
# stops when the tag has more than one release or its release is already
# published (a new build is a new tag, never a replaced asset). The
# concurrency group is the tag, so a tag push and a manual run for the same
# tag queue instead of racing. test-release-workflow.ps1 holds the shape.
#
# WHY IT IS PINNED. Every action is pinned to a full-length commit SHA: a
# moved tag on an action cannot change what runs.
name: Release launcher
# The tag in the run's title, so a script waiting for the run main's workflow
# makes for a tag finds it by title and branch (Sign-OnGitHub.ps1,
# Find-ReleaseRun): a manual run's head branch is main, not the tag (#3930).
run-name: Release launcher ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags:
      - 'v*'
  # Every build is a manual run: the tag push above only hands its tag to
  # one, and release-tag.yml starts one for a tag it made (a tag the
  # repository token pushes starts no workflow). Also so the exe can be
  # rebuilt for a tag that already exists without moving it, for a trial or
  # a runner that died halfway. A signed draft needs the run started on main
  # (header, ONLY A RUN OF MAIN'S OWN WORKFLOW SIGNS):
  #   gh workflow run release.yml --ref main -f tag=v<version>
  # A run started from any other ref builds unsigned.
  workflow_dispatch:
    inputs:
      tag:
        description: The v<version> tag to build and draft a release for
        required: true
      expected_sha:
        description: The commit the tag must be (optional; the tag's commit must be on main either way)
        required: false
        default: ''
# The draft release is created with the repository token, which needs write.
# The build job adds id-token: write for itself only.
permissions:
  contents: write
# One run per TAG, whichever way it was started. A release build is not
# cancelled by a newer one: a tag push and a manual run for the same tag
# queue rather than race for the one draft. Keyed on github.ref, as it was,
# a manual run from main and the tag's own push were two groups, which is how
# v1.1.96 got two drafts in the same second.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  # A V TAG PUSH IS HANDED TO MAIN'S WORKFLOW (#3930). This run is the tagged
  # commit's own copy of this file, which nothing reviewed, so it builds and
  # signs nothing: it asks GitHub to start main's copy for the tag, with the
  # commit the tag named when it was pushed as the expected SHA, and main's
  # copy checks the tag is that commit and on main before it builds. No
  # checkout and no repository code: one REST call with the repository token
  # (a workflow_dispatch the repository token asks for does start a run). On
  # GitHub's Linux runner, the lightest it has: no runner of the box is
  # registered to a public repository (#4013).
  handoff:
    name: Hand the tag to main's release workflow
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Start release.yml on main for this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -notmatch '^refs/tags/v') { Write-Host "::error::$env:GITHUB_REF is not a v tag"; exit 1 }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $run = @{ ref = 'main'; inputs = @{ tag = $env:GITHUB_REF_NAME; expected_sha = $env:GITHUB_SHA } } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$api/actions/workflows/release.yml/dispatches" -Headers $headers -ContentType 'application/json' -Body $run | Out-Null
          Write-Host ("started main's release.yml for {0} (commit {1}); it builds, signs and drafts there" -f $env:GITHUB_REF_NAME, $env:GITHUB_SHA)

  # GitHub's hosted Windows runner (#2163, header WHERE IT RUNS). A manual
  # run only: a tag push is handed over above.
  launcher:
    name: Build the release launcher
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    # The "release" environment only in a run of main's own workflow: its
    # subject is what the Azure federated credential trusts, and its
    # deployment rule allows the branch main only (#3930).
    environment: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
    # What the "verify" job needs to find the draft and check it.
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      commit: ${{ steps.tag.outputs.commit }}
      signed: ${{ steps.draft.outputs.signed }}
    # The build is a few minutes; past this it is stuck, not slow.
    timeout-minutes: 30
    steps:
      # THE TAG IS CHECKED BEFORE IT IS BUILT (#2202). A manual run used to
      # hand its free-form tag input straight to checkout and draft the
      # release against the run's own SHA, so a branch, a bare SHA or a tag
      # off main could be built and labelled as a release. Now the workflow's
      # own commit is checked out with every tag and main, and
      # scripts/release/Resolve-ReleaseTag.ps1 says which commit the tag is:
      # a real v<version> tag on a commit on main, and the expected SHA when
      # there is one (the commit a tag push named, which the handover passes,
      # or a manual run's expected_sha). A commit off main is refused whatever
      # the expected SHA (#3890). Anything else stops the run before anything
      # is built. The input reaches the script through env, never pasted into
      # the script text.
      - name: Check out the workflow's commit, with every tag and main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          submodules: false
          fetch-depth: 0

      - name: Confirm the tag is the commit meant, then check it out
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          . .\scripts\release\Resolve-ReleaseTag.ps1
          # Only a manual run builds (#3930); a tag push's handover passes the
          # tag and the commit it named as the inputs.
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { Write-Host "::error::only a manual run builds a release, not a $env:GITHUB_EVENT_NAME"; exit 1 }
          $tag = $env:INPUT_TAG; $expected = $env:INPUT_SHA
          try { $commit = Resolve-ThornswoodReleaseTag -Tag $tag -RepoDir . -ExpectedSha $expected -MainRef origin/main }
          catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          git checkout --force --detach $commit
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not check out $commit"; exit 1 }
          git clean -ffdx
          $head = "$(git rev-parse HEAD)".Trim()
          if ($head -ne $commit) { Write-Host "::error::checked out $head, not $commit"; exit 1 }
          Write-Host ("tag {0} is commit {1}" -f $tag, $commit)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("tag=" + $tag)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("commit=" + $commit)

      # DEV NUMBERS (header). The tag's number against the launcher's own at
      # this commit (scripts\release\LauncherVersion.ps1, #5179), which is
      # what Ship.ps1 asked the tag for: a main tag is that number, a dev tag
      # that number with a fourth part. Build-Launcher.ps1 writes it in for
      # the compile and puts git's 0.0.0 back.
      - name: Hold the tag's number to the launcher's
        id: number
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $want = $env:RELEASE_TAG.Substring(1)
          if ($want -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { Write-Host "::error::tag $($env:RELEASE_TAG) is not v<a.b.c> (main) or v<a.b.c.d> (dev)"; exit 1 }
          . .\scripts\release\LauncherVersion.ps1
          try { $main = Get-LauncherVersion -RepoDir . }
          catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          $parts = $want.Split('.')
          $base = ($parts[0..2]) -join '.'
          if ($parts.Count -eq 3 -and $want -ne $main) { Write-Host "::error::$($env:RELEASE_TAG) is a main release, and the launcher's number at this commit is $main (LauncherVersion.ps1). A main tag is that number and no other."; exit 1 }
          if ($parts.Count -eq 4 -and $base -ne $main) { Write-Host "::error::dev number $want does not start with $main, the launcher's number at this commit (LauncherVersion.ps1)"; exit 1 }
          Write-Host "the launcher's number at this commit is $main; this builds $want"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('version=' + $want)

      # The .NET 10 SDK the launcher publishes with (#4823), the same pin as
      # the build check's.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build the launcher into RUNNER_TEMP
        shell: pwsh
        env:
          RUNNER_KIND: ${{ runner.environment }}
          LAUNCHER_VERSION: ${{ steps.number.outputs.version }}
        run: |
          # RUNNER_TEMP, not a real install root, so Install-Launcher is never
          # run and no Desktop shortcut, icon cache or Stop-Game is touched.
          # The .NET 10 SDK's native publish on either runner (#4823).
          # -NoSign: signing is its own step below, -Required, never "skip if
          # no config".
          Write-Host ("publishing with the .NET 10 SDK on a {0} runner" -f $env:RUNNER_KIND)
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Launcher') | Out-Null
          .\scripts\release\Build-Launcher.ps1 -Root $root -NoSign -NoPause -Version $env:LAUNCHER_VERSION
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Build-Launcher.ps1 failed"; exit 1 }
          $exe = Join-Path $root 'Launcher\Thornswood.exe'
          if (-not (Test-Path $exe)) { Write-Host '::error::no Thornswood.exe came out of the build'; exit 1 }

      # SIGNING (#2163 section 8): a run of main's own workflow, nothing
      # else (#3930). Microsoft's signing client comes first, at the version and
      # sha256 Setup-ShipMachine.ps1 pins, lifted out of it by the parser so
      # the pin lives in one place; nothing is unpacked unless the bytes match.
      # It goes into records\signing\client of this checkout, which git
      # ignores; "Take the signing setup off this runner" removes it again.
      - name: Fetch the signing client Setup-ShipMachine.ps1 pins
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $src = [IO.File]::ReadAllText((Resolve-Path 'scripts\release\Setup-ShipMachine.ps1'))
          $t = $null; $e = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$t, [ref]$e)
          foreach ($name in 'Get-SigningClientPin', 'Get-Sha256', 'Save-Url', 'Save-SigningClient') {
            $fn = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name }, $true)
            if (-not $fn) { Write-Host "::error::Setup-ShipMachine.ps1 has no $name"; exit 1 }
            . ([scriptblock]::Create($fn.Extent.Text))
          }
          $repo = (Get-Location).Path
          $why = Save-SigningClient $repo (Get-SigningClientPin) ${function:Save-Url} (Join-Path $env:RUNNER_TEMP 'signing-client')
          if ($why) { Write-Host ('::error::' + $why); exit 1 }
          # signing.json from the tracked template: paths only, no key. It is
          # gitignored and lives on this runner for this job only.
          Copy-Item -LiteralPath 'records\signing\signing.template.json' -Destination 'records\signing\signing.json' -Force

      # The ids are not secrets (they name the app registration and the
      # tenant, and grant nothing without the federated credential), so they
      # are repository variables Patrick set on 12 Oct. The token is asked for
      # here, right before signtool, and lives in a file under RUNNER_TEMP for
      # that one call: Microsoft's signing client signs in through Azure's
      # DefaultAzureCredential, whose workload identity credential reads
      # AZURE_FEDERATED_TOKEN_FILE beside AZURE_CLIENT_ID and AZURE_TENANT_ID
      # (header, HOW IT SIGNS).
      - name: Sign the launcher's programs with ThornswoodRelease (OIDC, no secret)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:AZURE_TENANT_ID) { Write-Host '::error::the AZURE_SIGNING_CLIENT_ID and AZURE_SIGNING_TENANT_ID repository variables are not set'; exit 1 }
          if (-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) { Write-Host '::error::GitHub gave this job no OIDC token to ask for (id-token: write and the release environment)'; exit 1 }
          $exe = Join-Path $env:RUNNER_TEMP 'Thornswood\Launcher\Thornswood.exe'
          # Every program of the launcher: the exe and each native library
          # beside it (header, THE LAUNCHER IS A FOLDER).
          $programs = @(Get-ChildItem -LiteralPath (Split-Path -Parent $exe) -File | Where-Object { $_.Extension -in '.exe', '.dll' } | ForEach-Object { $_.FullName })
          $tokenFile = Join-Path $env:RUNNER_TEMP 'azure-federated-token'
          try {
            $answer = Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=api://AzureADTokenExchange') -Headers @{ Authorization = ('bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) } -ErrorAction Stop
            if (-not $answer.value) { Write-Host '::error::GitHub answered the OIDC request with no token'; exit 1 }
            Write-Host ('::add-mask::' + $answer.value)
            [IO.File]::WriteAllText($tokenFile, [string]$answer.value)
            $env:AZURE_FEDERATED_TOKEN_FILE = $tokenFile
            & .\scripts\release\Sign-Artifact.ps1 -Path $programs -Required
            $rc = $LASTEXITCODE
          } finally {
            Remove-Item -LiteralPath $tokenFile -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\AZURE_FEDERATED_TOKEN_FILE -ErrorAction SilentlyContinue
          }
          if ($rc -ne 0) { Write-Host '::error::signing failed; no draft gets these programs'; exit 1 }
          foreach ($f in $programs) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            $n = Split-Path -Leaf $f
            if ($sig.Status -ne 'Valid') { Write-Host ('::error::the signed ' + $n + ' reads back ' + $sig.Status); exit 1 }
            if (-not $sig.TimeStamperCertificate) { Write-Host ('::error::the signed ' + $n + ' has no timestamp'); exit 1 }
          }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          Write-Host ('{0} program(s) signed by {1} on a {2} runner' -f $programs.Count, $sig.SignerCertificate.Subject, $env:RUNNER_ENVIRONMENT)

      - name: Collect the launcher's programs, and write SHA256SUMS
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          $out = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Every .exe and .dll the publish left (header, THE LAUNCHER IS A
          # FOLDER), and the two icons the exe embeds, by name, so the order
          # is the same on every run.
          $programs = @(Get-ChildItem -LiteralPath (Join-Path $root 'Launcher') -File | Where-Object { $_.Extension -in '.exe', '.dll' -or $_.Name -in 'app.ico', 'app-dev.ico' } | Sort-Object Name)
          if (-not ($programs | Where-Object { $_.Name -eq 'Thornswood.exe' })) { Write-Host '::error::the launcher folder has no Thornswood.exe'; exit 1 }
          $noIcon = @('app.ico', 'app-dev.ico' | Where-Object { $programs.Name -notcontains $_ })
          if ($noIcon.Count) { Write-Host ("::error::the launcher folder has no " + ($noIcon -join ' or ') + ", which Build-Launcher.ps1 writes beside the exe"); exit 1 }
          foreach ($f in $programs) { Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $out $f.Name) -Force }
          # The sha256sum shape, "<hash>  <name>" with two spaces, one line
          # each, so both `sha256sum -c` and Ship read the same file. Written
          # after signing, so it names the bytes the draft carries.
          $lines = @()
          foreach ($f in $programs) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $out $f.Name) -Algorithm SHA256).Hash.ToLower()
            $lines += ("$hash  " + $f.Name)
            Write-Host ("SHA256  {0}  {1}" -f $hash, $f.Name)
          }
          Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS') -Value $lines -Encoding ascii

      # THE SAME FILES AS THIS RUN'S ARTIFACT (#2841). GitHub lists a
      # draft release only to an account that can push, and the box's Ship
      # token reads Thornswood's contents and nothing more (ship-access.js,
      # Patrick's pick of 30 Oct). So a Ship from the deploy gate never saw
      # the v1.2.12 draft this workflow made (31 Oct, run 41196215137) and
      # stopped on "no verified launcher". An artifact is read with Actions
      # read, which that token has: Ship (Get-ReleaseFiles) takes the files
      # from the newest green run of this workflow for the tag, and the draft
      # only when no such run still holds them. Same folder, same bytes as the
      # draft; Ship checks them against SHA256SUMS and the signature as before.
      - name: Keep the launcher's programs and SHA256SUMS as the run's files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

      - name: Draft a release with the launcher's programs and their checksums
        id: draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          # The tag and commit the check above settled, so the draft names the
          # commit that was built, not whatever ref started the run (#2202).
          $tag = $env:RELEASE_TAG
          if (-not $tag -or $env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') { Write-Host '::error::the tag check gave no tag and commit'; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP 'release'
          $exe = Join-Path $out 'Thornswood.exe'
          $sums = Join-Path $out 'SHA256SUMS'
          # Every file the collect step put here: the programs and SHA256SUMS.
          $files = @(Get-ChildItem -LiteralPath $out -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $signed = (Get-AuthenticodeSignature -LiteralPath $exe).Status -eq 'Valid'
          $how = 'published natively on GitHub''s runner with the .NET 10 SDK (#4823)'
          if ($signed) { $how += ', every program signed by ThornswoodRelease (#2163)' }
          else { $how += ', UNSIGNED (not a run of main''s workflow, #3930): Ship signs it on download (#921)' }
          $notes = "The launcher for $tag, Thornswood.exe and the native libraries beside it, $how, and verified by SHA256SUMS. Ship downloads these and checks the checksums instead of compiling the shipped binaries (issue #457).`n`nSource for the SkyMP files Thornswood ships: https://thornswood.net/credits#source"
          # A draft: a person promotes it, and Ship reads a draft's assets. If a
          # run for this tag already made the draft, upload into it instead.
          # Use the GitHub REST API directly; the dedicated runner does not
          # require the GitHub CLI to be installed on its PATH.
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          # The releases list, not /releases/tags/<tag>: only the list holds
          # drafts (header, ONE DRAFT PER TAG). Newest first, a page at a time,
          # until a short page says there is no more.
          $same = @()
          for ($page = 1; $page -le 50; $page++) {
            # Through ForEach-Object so the page is one release per item whether
            # or not this PowerShell unrolled the JSON array itself.
            $batch = @(Invoke-RestMethod -Method Get -Uri "$api/releases?per_page=100&page=$page" -Headers $headers -ErrorAction Stop | ForEach-Object { $_ })
            $same += @($batch | Where-Object { $_.tag_name -eq $tag })
            if ($batch.Count -lt 100) { break }
          }
          if ($same.Count -gt 1) {
            Write-Host ("::error::tag $tag already has {0} releases ({1}). Delete the ones that are not wanted, then run this again: gh api -X DELETE repos/$repo/releases/<id>" -f $same.Count, (($same | ForEach-Object { [string]$_.id }) -join ', '))
            exit 1
          }
          $release = $null
          if ($same.Count -eq 1) {
            $release = $same[0]
            if (-not $release.draft) {
              Write-Host "::error::the release for $tag ($($release.id)) is already published, and a published release's files are never replaced (docs\SIGNED-RELEASES.md section 6). A new build is a new tag."
              exit 1
            }
            Write-Host ("uploading into the draft {0} that tag {1} already has" -f $release.id, $tag)
            # Its notes were written by the run that made it, and this run's
            # files replace that run's: a draft built unsigned and rebuilt
            # signed kept saying UNSIGNED. The notes say how THESE files were
            # built, so they are written again with them. The tag and commit
            # go with them: since immutable releases (31 Oct 2026), GitHub
            # drops a draft's tag when an edit does not name it, and the
            # v1.2.13 draft read untagged-<hex> after a second run wrote its
            # notes alone, so Ship could not find it by its
            # tag (scripts\ops\Set-Ref.ps1 -RetagLauncher puts one back).
            $patch = @{ body = $notes; tag_name = $tag; target_commitish = $env:RELEASE_COMMIT } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body $patch -ErrorAction Stop
          }
          if (-not $release) {
            $payload = @{
              tag_name = $tag
              target_commitish = $env:RELEASE_COMMIT
              name = "Launcher $tag"
              body = $notes
              draft = $true
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $payload
          }
          foreach ($asset in $files) {
            $assetName = [IO.Path]::GetFileName($asset)
            $existing = @($release.assets | Where-Object { $_.name -eq $assetName })
            foreach ($item in $existing) {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($item.id)" -Headers $headers -ErrorAction Stop | Out-Null
            }
            $encodedName = [Uri]::EscapeDataString($assetName)
            $uploadUri = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encodedName"
            Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType 'application/octet-stream' -InFile $asset -ErrorAction Stop | Out-Null
          }
          Write-Host ("draft {0} for {1} holds {2} file(s), Thornswood.exe {3}: {4}" -f $release.id, $tag, $files.Count, $(if ($signed) { 'signed' } else { 'unsigned' }), (($files | ForEach-Object { Split-Path -Leaf $_ }) -join ', '))
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("release_id=" + $release.id)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("signed=" + $(if ($signed) { 'true' } else { 'false' }))

      # A runner keeps its folder from one job to the next, so the signing
      # setup this job put in the checkout goes again whatever happened above.
      # The token file under RUNNER_TEMP went with its signtool call.
      - name: Take the signing setup off this runner
        if: ${{ always() }}
        shell: pwsh
        run: |
          foreach ($p in 'records\signing\signing.json', 'records\signing\client') {
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force }
          }

  # A SECOND MACHINE CHECKS THE SIGNED DRAFT (#2163). After the build drafted
  # a signed launcher. A job of its own gets a fresh GitHub runner, so the
  # machine that checks holds no signing client, no signing.json and no
  # Azure token and is not the one that signed: what it accepts it accepts
  # on the files alone, the way an installed launcher does. No VPS runner
  # checks it any more (#4013), and #4033 took the signing and check
  # runners' labels off. contents: write only because a draft release is
  # visible to nobody without push access.
  verify:
    name: Check the signed draft on a second machine
    needs: launcher
    if: ${{ !cancelled() && needs.launcher.result == 'success' && needs.launcher.outputs.signed == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      DRAFT_ID: ${{ needs.launcher.outputs.release_id }}
      DRAFT_COMMIT: ${{ needs.launcher.outputs.commit }}
    steps:
      - name: Check out the commit the draft was built from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DRAFT_COMMIT }}
          clean: true
          submodules: false

      - name: Download the draft's files and check them
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ env.DRAFT_ID }}
        run: |
          if ($env:RELEASE_ID -notmatch '^[0-9]+$') { Write-Host '::error::the build job gave no release id'; exit 1 }
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod -Method Get -Uri "$api/releases/$($env:RELEASE_ID)" -Headers $headers -ErrorAction Stop
          $dir = Join-Path $env:RUNNER_TEMP 'draft'
          if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # Each file by its asset id, as bytes: the octet-stream answer is a
          # redirect to the file, and PowerShell 7 drops the token on it.
          # SHA256SUMS first, then every file it names, which is the launcher
          # whole (header, THE LAUNCHER IS A FOLDER).
          $bin = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $ProgressPreference = 'SilentlyContinue'
          $get = {
            param([string]$n)
            $a = @($release.assets | Where-Object { $_.name -eq $n })
            if ($a.Count -ne 1) { Write-Host ("::error::draft {0} has {1} files named {2}" -f $env:RELEASE_ID, $a.Count, $n); exit 1 }
            Invoke-WebRequest -Uri "$api/releases/assets/$($a[0].id)" -Headers $bin -OutFile (Join-Path $dir $n) -UseBasicParsing -ErrorAction Stop
          }
          & $get 'SHA256SUMS'
          $named = @([IO.File]::ReadAllLines((Join-Path $dir 'SHA256SUMS')) | ForEach-Object { [regex]::Match($_, '^\s*[0-9a-fA-F]{64}\s+\*?([A-Za-z0-9][A-Za-z0-9._-]*)\s*$') } | Where-Object { $_.Success } | ForEach-Object { $_.Groups[1].Value })
          if ($named.Count -eq 0) { Write-Host "::error::draft $($env:RELEASE_ID)'s SHA256SUMS names no file"; exit 1 }
          foreach ($n in $named) { & $get $n }
          & .\scripts\release\Test-ReleaseFiles.ps1 -Dir $dir -RequireSigned
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::draft $($env:RELEASE_ID) did not pass on a second machine; do not ship it"; exit 1 }
