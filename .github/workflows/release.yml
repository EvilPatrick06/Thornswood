# The launcher exe that ships is built HERE, on a clean runner, not on the
# machine of whoever runs Ship. Issue #457: CI builds the shipped launcher exe,
# and Ship publishes the runner's artifact, verified by its checksum file,
# instead of compiling the binary that reaches every launcher locally.
#
# WHAT IT DOES. On a tag v<version> it checks the tag out clean, runs
# scripts\release\Build-Launcher.ps1 into a folder under RUNNER_TEMP so it
# never touches a Desktop shortcut or closes a game on a real machine, signs
# Thornswood.exe through Azure Artifact Signing (on GitHub's runner, on a v
# tag), writes SHA256SUMS beside it, and attaches them to a DRAFT release for
# that tag. A person promotes the draft; Ship reads a draft's assets fine.
# Ship then downloads Thornswood.exe and SHA256SUMS and refuses to ship unless
# the checksum matches. SHA256SUMS is written AFTER signing, so it describes
# the signed bytes the draft carries.
#
# THE SETUP PROGRAM TOO, issue #932. The same build compiles setup-stub.exe,
# the program the installer is built around, into out\ of the checkout. It is
# attached beside the launcher and listed in the same SHA256SUMS. It is NOT
# signed here, on purpose: Package-Thornswood.ps1 appends the OneFile trailer
# to it and signs the finished Setup, and a stub signed first cannot be signed
# again after that append (Build-Launcher.ps1, "Do NOT sign setup-stub.exe").
#
# WHERE IT RUNS (#2163, Patrick's decisions of 12 Oct, relayed by Smeagle).
# GitHub's hosted windows-latest by default, in the job "launcher" below,
# the same image the build check (build.yml, build-pr.yml) proves green on
# every pull request, including the MSBuild build of #498. The VPS is the
# backup for every GitHub runner build, so "launcher-vps" picks a release up
# on the box the same way build.yml does: when the repository variable
# BUILD_RUNNER is vps, when a manual run asks for runner: vps, or when the
# hosted job failed (a quota or billing stop fails it before any step runs).
#
# HOW IT BUILDS (#498, Patrick's option C). On GitHub's runner the launcher
# and setup program are built by MSBuild from launcher\app\Thornswood.csproj
# and installer\setup\Setup.csproj (Build-Launcher.ps1 -With msbuild). The
# VPS runners have no MSBuild (measured 12 Oct, #498), so the fallback keeps
# the in-box csc build until Patrick's decision on #498 (Build Tools on the
# VPS, or not) is done; then the fallback moves to -With msbuild too.
#
# HOW IT SIGNS (#2163 section 8). azure/login with a federated (OIDC)
# identity, no secret stored anywhere: GitHub mints a short token for this
# job only, and only on a v tag, through the "release" environment, whose
# subject is the one the Azure federated credential trusts. Pull request jobs
# never get it; this file has no pull_request trigger. Then Sign-Artifact.ps1
# -Required signs with the ThornswoodRelease profile, the same script and
# profile Ship uses, with Microsoft's signing client fetched at the version
# and sha256 Setup-ShipMachine.ps1 pins. A signing failure fails the job and
# no draft gets the file. The VPS fallback has no identity and no signing
# client: its draft is unsigned and says so in its notes, and Ship signs the
# download on One the way it did before (#921).
#
# WHY IT IS PINNED. Every action is pinned to a full-length commit SHA: a
# moved tag on an action cannot change what runs.
name: Release launcher
on:
  push:
    tags:
      - 'v*'
  # So the exe can be rebuilt for a tag that already exists without moving it,
  # for a first trial or a runner that died halfway. Run it on the tag
  # (gh workflow run release.yml --ref v<version> -f tag=v<version>) for a
  # signed draft; a manual run from main builds on GitHub's runner unsigned.
  workflow_dispatch:
    inputs:
      tag:
        description: The v<version> tag to build and draft a release for
        required: true
      expected_sha:
        description: The commit the tag must be (optional; without it the tag's commit must be on main)
        required: false
        default: ''
      runner:
        description: 'hosted (GitHub, the default) or vps (the box, the fallback)'
        type: choice
        options: [hosted, vps]
        default: hosted
# The draft release is created with the repository token, which needs write.
# The hosted job adds id-token: write for itself only.
permissions:
  contents: write
# One run per tag. A release build is not cancelled by a newer one: two pushes
# of the same tag queue rather than race for the one draft.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # The default: GitHub's hosted Windows runner (#2163). Skipped when
  # BUILD_RUNNER is vps or a manual run asked for the box, and then the
  # fallback below runs instead.
  launcher:
    name: Build the release launcher
    if: ${{ vars.BUILD_RUNNER != 'vps' && inputs.runner != 'vps' }}
    runs-on: windows-latest
    # The "release" environment only on a v tag: its subject is what the Azure
    # federated credential trusts, and its deployment rule allows v* tags only.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
    # The build is a few minutes; past this it is stuck, not slow.
    timeout-minutes: 30
    steps: &release
      # THE TAG IS CHECKED BEFORE IT IS BUILT (#2202). A manual run used to
      # hand its free-form tag input straight to checkout and draft the
      # release against the run's own SHA, so a branch, a bare SHA or a tag
      # off main could be built and labelled as a release. Now the workflow's
      # own commit is checked out with every tag and main, and
      # scripts/release/Resolve-ReleaseTag.ps1 says which commit the tag is:
      # a real v<version> tag, and either the expected SHA (a tag push's own
      # GITHUB_SHA, or the manual run's expected_sha) or a commit on main.
      # Anything else stops the run before anything is built. The input
      # reaches the script through env, never pasted into the script text.
      - name: Check out the workflow's commit, with every tag and main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          submodules: false
          fetch-depth: 0

      - name: Confirm the tag is the commit meant, then check it out
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          . .\scripts\release\Resolve-ReleaseTag.ps1
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $tag = $env:INPUT_TAG; $expected = $env:INPUT_SHA }
          else { $tag = $env:GITHUB_REF_NAME; $expected = $env:GITHUB_SHA }
          try { $commit = Resolve-ThornswoodReleaseTag -Tag $tag -RepoDir . -ExpectedSha $expected -MainRef origin/main }
          catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          git checkout --force --detach $commit
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not check out $commit"; exit 1 }
          git clean -ffdx
          $head = "$(git rev-parse HEAD)".Trim()
          if ($head -ne $commit) { Write-Host "::error::checked out $head, not $commit"; exit 1 }
          Write-Host ("tag {0} is commit {1}" -f $tag, $commit)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("tag=" + $tag)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("commit=" + $commit)

      - name: Build the launcher into RUNNER_TEMP
        shell: pwsh
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          # RUNNER_TEMP, not a real install root, so Install-Launcher is never
          # run and no Desktop shortcut, icon cache or Stop-Game is touched.
          # MSBuild on GitHub's runner (#498); the in-box csc on the VPS,
          # which has no MSBuild until #498's VPS decision is done. -NoSign:
          # signing is its own step below, -Required, never "skip if no config".
          $with = 'csc'
          if ($env:RUNNER_KIND -eq 'github-hosted') { $with = 'msbuild' }
          Write-Host ("building with {0} on a {1} runner" -f $with, $env:RUNNER_KIND)
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Launcher') | Out-Null
          .\scripts\release\Build-Launcher.ps1 -Root $root -With $with -NoSign -NoPause
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Build-Launcher.ps1 -With $with failed"; exit 1 }
          $exe = Join-Path $root 'Launcher\Thornswood.exe'
          if (-not (Test-Path $exe)) { Write-Host '::error::no Thornswood.exe came out of the build'; exit 1 }
          # The setup program the same build compiled (issue #932).
          if (-not (Test-Path 'out\setup-stub.exe')) { Write-Host '::error::no setup-stub.exe came out of the build'; exit 1 }

      # SIGNING (#2163 section 8): GitHub's runner, a v tag, nothing else.
      # The ids are not secrets (they name the app registration, the tenant
      # and the subscription, and grant nothing without the federated
      # credential), so they are repository variables Patrick sets.
      - name: Sign in to Azure with the release identity (OIDC, no secret)
        if: ${{ runner.environment == 'github-hosted' && startsWith(github.ref, 'refs/tags/v') }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}

      - name: Sign the launcher with ThornswoodRelease
        if: ${{ runner.environment == 'github-hosted' && startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          # Microsoft's signing client at the version and sha256
          # Setup-ShipMachine.ps1 pins, lifted out of it by the parser so the
          # pin lives in one place. Nothing is unpacked unless the bytes match.
          $src = [IO.File]::ReadAllText((Resolve-Path 'scripts\release\Setup-ShipMachine.ps1'))
          $t = $null; $e = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$t, [ref]$e)
          foreach ($name in 'Get-SigningClientPin', 'Get-Sha256', 'Save-Url', 'Save-SigningClient') {
            $fn = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name }, $true)
            if (-not $fn) { Write-Host "::error::Setup-ShipMachine.ps1 has no $name"; exit 1 }
            . ([scriptblock]::Create($fn.Extent.Text))
          }
          $repo = (Get-Location).Path
          $why = Save-SigningClient $repo (Get-SigningClientPin) ${function:Save-Url} (Join-Path $env:RUNNER_TEMP 'signing-client')
          if ($why) { Write-Host ('::error::' + $why); exit 1 }
          # signing.json from the tracked template: paths only, no key. It is
          # gitignored and lives on this runner for this job only.
          Copy-Item -LiteralPath 'records\signing\signing.template.json' -Destination 'records\signing\signing.json' -Force
          $exe = Join-Path $env:RUNNER_TEMP 'Thornswood\Launcher\Thornswood.exe'
          & .\scripts\release\Sign-Artifact.ps1 -Path $exe -Required
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::signing failed; no draft gets this exe'; exit 1 }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne 'Valid') { Write-Host ('::error::the signed exe reads back ' + $sig.Status); exit 1 }
          Write-Host ('signed by ' + $sig.SignerCertificate.Subject)

      - name: Collect the exe and the setup program, and write SHA256SUMS
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          $out = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath (Join-Path $root 'Launcher\Thornswood.exe') -Destination (Join-Path $out 'Thornswood.exe') -Force
          Copy-Item -LiteralPath 'out\setup-stub.exe' -Destination (Join-Path $out 'setup-stub.exe') -Force
          # The sha256sum shape, "<hash>  <name>" with two spaces, one line
          # each, so both `sha256sum -c` and Ship read the same file. Written
          # after signing, so it names the bytes the draft carries.
          $lines = @()
          foreach ($n in 'Thornswood.exe', 'setup-stub.exe') {
            $hash = (Get-FileHash -LiteralPath (Join-Path $out $n) -Algorithm SHA256).Hash.ToLower()
            $lines += ("$hash  $n")
            Write-Host ("SHA256  {0}  {1}" -f $hash, $n)
          }
          Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS') -Value $lines -Encoding ascii

      - name: Draft a release with the exe, the setup program and their checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          # The tag and commit the check above settled, so the draft names the
          # commit that was built, not whatever ref started the run (#2202).
          $tag = $env:RELEASE_TAG
          if (-not $tag -or $env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') { Write-Host '::error::the tag check gave no tag and commit'; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP 'release'
          $exe = Join-Path $out 'Thornswood.exe'
          $stub = Join-Path $out 'setup-stub.exe'
          $sums = Join-Path $out 'SHA256SUMS'
          $signed = (Get-AuthenticodeSignature -LiteralPath $exe).Status -eq 'Valid'
          $how = 'built on the VPS fallback runner with the in-box csc, UNSIGNED: Ship signs it on download (#921)'
          if ($env:RUNNER_KIND -eq 'github-hosted') { $how = 'built on GitHub''s runner with MSBuild (#498)' }
          if ($signed) { $how += ', the launcher signed by ThornswoodRelease (#2163)' }
          elseif ($env:RUNNER_KIND -eq 'github-hosted') { $how += ', UNSIGNED (not a v tag ref): Ship signs it on download (#921)' }
          $notes = "Launcher exe and setup program for $tag, $how, and verified by SHA256SUMS. Ship downloads these and checks the checksums instead of compiling the shipped binaries (issues #457 and #932).`n`nSource for the SkyMP files Thornswood ships: https://thornswood.net/credits#source"
          # A draft: a person promotes it, and Ship reads a draft's assets. If a
          # run for this tag already made the release, upload into it instead,
          # the same fallback Publish-Update.ps1 uses.
          # Use the GitHub REST API directly; the dedicated runner does not
          # require the GitHub CLI to be installed on its PATH.
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers -ErrorAction Stop
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          if (-not $release) {
            $payload = @{
              tag_name = $tag
              target_commitish = $env:RELEASE_COMMIT
              name = "Launcher $tag"
              body = $notes
              draft = $true
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $payload
          }
          foreach ($asset in @($exe, $stub, $sums)) {
            $assetName = [IO.Path]::GetFileName($asset)
            $existing = @($release.assets | Where-Object { $_.name -eq $assetName })
            foreach ($item in $existing) {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($item.id)" -Headers $headers -ErrorAction Stop | Out-Null
            }
            $encodedName = [Uri]::EscapeDataString($assetName)
            $uploadUri = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encodedName"
            Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType 'application/octet-stream' -InFile $asset -ErrorAction Stop | Out-Null
          }

  # The VPS FALLBACK, the same way build.yml has it (#1306, #2163). It runs
  # only when
  #   - the repository variable BUILD_RUNNER is vps, or
  #   - a manual run asked for runner: vps, or
  #   - the hosted job failed (a quota or billing stop fails it before any
  #     step runs). A real red fails here too; that is the price of not
  #     telling a quota stop from a build failure.
  # !cancelled(), not always() (#2422): a cancelled run never leaves the box
  # building a release nobody wants. The steps are the hosted job's own, by
  # the YAML anchor, so the two cannot drift; the MSBuild build and the
  # signing are the hosted-only parts, said by runner.environment above.
  launcher-vps:
    name: Build the release launcher (VPS fallback)
    needs: launcher
    if: ${{ !cancelled() && needs.launcher.result != 'success' && needs.launcher.result != 'cancelled' }}
    runs-on: [self-hosted, Windows, X64, thornswood-vps]
    permissions:
      contents: write
    # The build is about two minutes; past this it is stuck, not slow.
    timeout-minutes: 20
    steps: *release
