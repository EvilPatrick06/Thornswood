# The launcher exe that ships is built HERE, on a clean runner, not on the
# machine of whoever runs Ship. Issue #457: CI builds the shipped launcher exe,
# and Ship publishes the runner's artifact, verified by its checksum file,
# instead of compiling the binary that reaches every launcher locally.
#
# WHAT IT DOES. On a tag v<version> it checks the tag out clean, runs the same
# scripts\release\Build-Launcher.ps1 the build check runs, into a folder under
# RUNNER_TEMP so it never touches a Desktop shortcut or closes a game on a real
# machine, writes SHA256SUMS beside Thornswood.exe, and attaches both to a
# DRAFT release for that tag. A person promotes the draft; Ship reads a draft's
# assets fine. Ship then downloads Thornswood.exe and SHA256SUMS and refuses to
# ship unless the checksum matches. Byte-identical local and runner builds are
# impossible with the Framework 4 csc (it stamps a build time and a fresh MVID
# into the PE), so nothing compares against a local build: the runner's exe IS
# the shipped exe, and SHA256SUMS is what proves the download is that exe and
# nothing else.
#
# THE SETUP PROGRAM TOO, issue #932. The same build compiles setup-stub.exe,
# the program the installer is built around, into out\ of the checkout. It is
# attached beside the launcher and listed in the same SHA256SUMS, and a main
# Ship with -Package downloads and checks it the same way. Until then a main
# Ship, which never runs Build-Launcher, had no stub to package, and the one
# in a shared clone's out\ was whatever the last local build had left there.
#
# WHY IT IS PINNED. runs-on names the dedicated self-hosted runners by their
# exact labels, including thornswood-vps, so no runner but ours can pick up a
# release build. Every runner Install-Runner.ps1 puts on the VPS carries that
# label, the numbered ones since 4 October included. Every action is pinned to a full-length commit SHA for the
# same reason: a moved tag on an action cannot change what runs. This is the
# layer Azure Artifact Signing goes on top of later (issue #457, and the
# signing entry): signing needs the secrets that are not in this repository yet,
# so it is a follow-up, and until then the checksum file is the whole of the verification.
#
# WHERE IT RUNS. This job uses the dedicated self-hosted Windows X64 runners
# labeled thornswood-vps, whichever is free. The build check and nightly run
# there too. This avoids
# the GitHub-hosted minute spending limit (issue #437); a real tag trial can run
# as soon as this change is merged. Said in the pull request so it is not a
# surprise on the first tag.
name: Release launcher
on:
  push:
    tags:
      - 'v*'
  # So the exe can be rebuilt for a tag that already exists without moving it,
  # for a first trial or a runner that died halfway.
  workflow_dispatch:
    inputs:
      tag:
        description: The v<version> tag to build and draft a release for
        required: true
      expected_sha:
        description: The commit the tag must be (optional; without it the tag's commit must be on main)
        required: false
        default: ''
# The draft release is created with the repository token, which needs write.
permissions:
  contents: write
# One run per tag. A release build is not cancelled by a newer one: two pushes
# of the same tag queue rather than race for the one draft.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  launcher:
    name: Build the release launcher
    runs-on: [self-hosted, Windows, X64, thornswood-vps]
    # The build is about two minutes; past this it is stuck, not slow.
    timeout-minutes: 20
    steps:
      # THE TAG IS CHECKED BEFORE IT IS BUILT (#2202). A manual run used to
      # hand its free-form tag input straight to checkout and draft the
      # release against the run's own SHA, so a branch, a bare SHA or a tag
      # off main could be built and labelled as a release. Now the workflow's
      # own commit is checked out with every tag and main, and
      # scripts/release/Resolve-ReleaseTag.ps1 says which commit the tag is:
      # a real v<version> tag, and either the expected SHA (a tag push's own
      # GITHUB_SHA, or the manual run's expected_sha) or a commit on main.
      # Anything else stops the run before anything is built. The input
      # reaches the script through env, never pasted into the script text.
      - name: Check out the workflow's commit, with every tag and main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          submodules: false
          fetch-depth: 0

      - name: Confirm the tag is the commit meant, then check it out
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          . .\scripts\release\Resolve-ReleaseTag.ps1
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $tag = $env:INPUT_TAG; $expected = $env:INPUT_SHA }
          else { $tag = $env:GITHUB_REF_NAME; $expected = $env:GITHUB_SHA }
          try { $commit = Resolve-ThornswoodReleaseTag -Tag $tag -RepoDir . -ExpectedSha $expected -MainRef origin/main }
          catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          git checkout --force --detach $commit
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not check out $commit"; exit 1 }
          git clean -ffdx
          $head = "$(git rev-parse HEAD)".Trim()
          if ($head -ne $commit) { Write-Host "::error::checked out $head, not $commit"; exit 1 }
          Write-Host ("tag {0} is commit {1}" -f $tag, $commit)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("tag=" + $tag)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("commit=" + $commit)

      - name: Build the launcher into RUNNER_TEMP
        shell: pwsh
        run: |
          # RUNNER_TEMP, not a real install root, so Install-Launcher is never
          # run and no Desktop shortcut, icon cache or Stop-Game is touched.
          # The same call the build check makes (.github/workflows/build.yml).
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Launcher') | Out-Null
          .\scripts\release\Build-Launcher.ps1 -Root $root -NoPause
          $exe = Join-Path $root 'Launcher\Thornswood.exe'
          if (-not (Test-Path $exe)) { Write-Host '::error::no Thornswood.exe came out of the build'; exit 1 }
          # The setup program the same build compiled (issue #932).
          if (-not (Test-Path 'out\setup-stub.exe')) { Write-Host '::error::no setup-stub.exe came out of the build'; exit 1 }

      - name: Collect the exe and the setup program, and write SHA256SUMS
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          $out = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath (Join-Path $root 'Launcher\Thornswood.exe') -Destination (Join-Path $out 'Thornswood.exe') -Force
          Copy-Item -LiteralPath 'out\setup-stub.exe' -Destination (Join-Path $out 'setup-stub.exe') -Force
          # The sha256sum shape, "<hash>  <name>" with two spaces, one line
          # each, so both `sha256sum -c` and Ship read the same file.
          $lines = @()
          foreach ($n in 'Thornswood.exe', 'setup-stub.exe') {
            $hash = (Get-FileHash -LiteralPath (Join-Path $out $n) -Algorithm SHA256).Hash.ToLower()
            $lines += ("$hash  $n")
            Write-Host ("SHA256  {0}  {1}" -f $hash, $n)
          }
          Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS') -Value $lines -Encoding ascii

      - name: Draft a release with the exe, the setup program and their checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          # The tag and commit the check above settled, so the draft names the
          # commit that was built, not whatever ref started the run (#2202).
          $tag = $env:RELEASE_TAG
          if (-not $tag -or $env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') { Write-Host '::error::the tag check gave no tag and commit'; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP 'release'
          $exe = Join-Path $out 'Thornswood.exe'
          $stub = Join-Path $out 'setup-stub.exe'
          $sums = Join-Path $out 'SHA256SUMS'
          $notes = "Launcher exe and setup program for $tag, built on a clean runner and verified by SHA256SUMS. Ship downloads these and checks the checksums instead of compiling the shipped binaries (issues #457 and #932).`n`nSource for the SkyMP files Thornswood ships: https://thornswood.net/credits#source"
          # A draft: a person promotes it, and Ship reads a draft's assets. If a
          # run for this tag already made the release, upload into it instead,
          # the same fallback Publish-Update.ps1 uses.
          # Use the GitHub REST API directly; the dedicated runner does not
          # require the GitHub CLI to be installed on its PATH.
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers -ErrorAction Stop
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          if (-not $release) {
            $payload = @{
              tag_name = $tag
              target_commitish = $env:RELEASE_COMMIT
              name = "Launcher $tag"
              body = $notes
              draft = $true
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $payload
          }
          foreach ($asset in @($exe, $stub, $sums)) {
            $assetName = [IO.Path]::GetFileName($asset)
            $existing = @($release.assets | Where-Object { $_.name -eq $assetName })
            foreach ($item in $existing) {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($item.id)" -Headers $headers -ErrorAction Stop | Out-Null
            }
            $encodedName = [Uri]::EscapeDataString($assetName)
            $uploadUri = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encodedName"
            Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType 'application/octet-stream' -InFile $asset -ErrorAction Stop | Out-Null
          }
