# The load test (#4623): how many people the game server holds, measured
# with network bots, not chosen. Decided 20 Oct: bots that connect over the
# game's port, log in and move like a person; the plan puts them on GitHub's
# runner with the five masters.
#
# Each job lays out a server on a fresh windows-2022 runner from the engine
# build records\server-build.json pins (the fork's own build of that commit,
# every file held to the record), this checkout's gamemode.js and
# Thornswood-Content.esp, and the five masters the fork's build downloads,
# held to the same sha256 (scripts\bot\New-LoadServer.js; THIRD-PARTY.md says
# where they come from, and they go with the runner). Then
# scripts\bot\Load-Test.js puts more and more bots on it and, at each step,
# reads the server process's cores and memory and every byte between the bots
# and the server. Two shapes, one job each:
#   crowd   everybody at one spot, so everybody sees everybody: the most the
#           server has to send;
#   spread  new characters put at 36 spots over Tamriel, so few see each other.
# The numbers are in the run's summary and in the load-test-<shape> artifact
# (result.json and the server's log, nothing else), and go on #4623.
#
# Why GitHub's runner: this repository is public, so its standard runners cost
# nothing, and nothing here needs a secret, the box, or a real server. No job
# here may name a self-hosted runner. Its token reads only: the fork's build is
# a public repository's artifact, which GitHub serves to any token.
#
# The runner is not the box: its cores are a cloud machine's, and the bots run
# on it beside the server. Load-Test.js reads how busy the whole runner was at
# each step and stops once it passes 90%, because past that the numbers are the
# runner's and not the server's.

name: Load test

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'How many bots at each step, comma separated'
        required: false
        default: '5,10,20,30,40,60'
      hold:
        description: 'Seconds each step is measured over'
        required: false
        default: '60'
  pull_request:
    paths:
      - 'scripts/bot/Load-Test.js'
      - 'scripts/bot/New-LoadServer.js'
      - 'scripts/bot/load-*.js'
      - '.github/workflows/load-test.yml'

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load:
    strategy:
      fail-fast: false
      matrix:
        shape: [crowd, spread]
    runs-on: windows-2022
    # Measured on its first runs: the masters and the build download in about
    # two minutes, the gamemode loads in about one, and each step takes its
    # fill, 20 s of settling and its window. Six steps of 60 s are under 20
    # minutes; twice that is the limit.
    timeout-minutes: 45
    steps:
      # As the fork's build does: the gamemode's bytes as committed.
      - name: Check out as committed, LF
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Get the engine build the checkout pins
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = ((Get-Content -Raw records/server-build.json) | ConvertFrom-Json).source.commit
          $name = "thornswood-engine-$commit"
          $list = gh api -X GET repos/ThornswoodRP/skymp/actions/artifacts -f name=$name -f per_page=100 | ConvertFrom-Json
          $art = @($list.artifacts | Where-Object { -not $_.expired -and $_.workflow_run.head_branch -eq 'thornswood/engine-changes' } | Sort-Object created_at -Descending) | Select-Object -First 1
          if (-not $art) { Write-Host "::error::the fork keeps no $name from a push to thornswood/engine-changes, so the pinned engine cannot be measured"; exit 1 }
          $zip = Join-Path $env:RUNNER_TEMP 'engine.zip'
          # The API sends the zip on to GitHub's storage, and pwsh drops the
          # token when a request moves to another host.
          Invoke-WebRequest -Uri "https://api.github.com/repos/ThornswoodRP/skymp/actions/artifacts/$($art.id)/zip" -OutFile $zip `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          if ((Get-Item -LiteralPath $zip).Length -ne [long]$art.size_in_bytes) { Write-Host "::error::the download of $name is $((Get-Item -LiteralPath $zip).Length) bytes, and the fork says $($art.size_in_bytes)"; exit 1 }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'engine')
          Write-Host "fork $commit, artifact $($art.id) of run $($art.workflow_run.id), $($art.size_in_bytes) bytes"

      - name: Lay out the load server
        shell: pwsh
        run: |
          node scripts/bot/New-LoadServer.js --engine "$env:RUNNER_TEMP/engine" --masters "$env:RUNNER_TEMP/masters" --out "$env:RUNNER_TEMP/server" --shape ${{ matrix.shape }} --seats 200 --download yes
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Put the bots on it
        shell: pwsh
        env:
          STEPS: ${{ github.event.inputs.steps || '5,10,20,30,40,60' }}
          HOLD: ${{ github.event.inputs.hold || '60' }}
        run: |
          node scripts/bot/Load-Test.js --root "$env:RUNNER_TEMP/server" --out "$env:RUNNER_TEMP/server/result.json" --steps $env:STEPS --hold $env:HOLD --shape ${{ matrix.shape }} --summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Keep the result and the server's log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: load-test-${{ matrix.shape }}
          path: |
            ${{ runner.temp }}/server/result.json
            ${{ runner.temp }}/server/load-test-server.log
            ${{ runner.temp }}/server/load-samples.jsonl
          if-no-files-found: warn
          retention-days: 30
