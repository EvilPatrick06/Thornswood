# Drops every engine build engine.yml keeps that nothing pins, so the
# repository's artifact storage cannot fill with them again (#3410).
#
# WHY. The artifact storage of a private repository on the free plan is 500
# MB, for every workflow's artifacts together, and an upload past it fails:
# "Failed to CreateArtifact: Artifact storage quota has been hit". On 25 Oct
# 2026 it did, for the board read (runs 40210248299, 40211493452,
# 40231207157) and for engine.yml (run 40249618462, the build the #2262 pin
# needed). engine.yml keeps each build, about 12 MB, for 30 days
# (retention-days: 30), and 22 builds of 21 commits made from 18 to 22 Oct
# held 272 MB, more than half the cap, though a Ship machine only ever takes
# the build of the commit its checkout pins (Get-EngineArtifact.ps1). Patrick
# approved keeping only the builds a pin can still take (card t-artifacts, 25
# Oct board review).
#
# WHAT IT KEEPS. Every unexpired engine-<fork commit 12> artifact of a commit
# that is:
#   - the one main pins engine/skymp to (what every Ship machine fetches);
#   - the tip of the fork's thornswood/engine-changes (what the next pin
#     names: a pin names a head of that branch, engine\README.md);
#   - the one an open pull request's head pins (a pin bump in review, whose
#     records came from that artifact);
#   - the one the engine.yml run that started this built.
# and every engine artifact of an engine.yml run still going: it may upload
# while this runs, and its own prune comes when it ends.
# Every copy of a kept commit stays, not only the newest: when a commit was
# built twice only the run its records came from passes Get-EngineArtifact
# (#3243), and nothing here can tell which that is without downloading both.
# Every other engine artifact is deleted, and the run says each one it
# deleted and why each kept one stays. Nothing else is touched: only names of
# the form engine-<12 hex> are read, and the board read and the tested-tree
# notes keep their own few days.
#
# A READ THAT FAILS DELETES NOTHING. All of the above is read before the
# first delete; if any read fails the run stops red with what failed, and
# every artifact is as it was.
#
# WHEN. After every engine.yml run, however it ended (a run that could not
# upload is the one that most needs the room), and by hand:
#   gh workflow run engine-prune.yml --ref main
# A workflow_run run reads this file and the code on main, never a branch's.
#
# THE TOKEN. The run's own token, which may delete artifacts (actions:
# write), read this repository and read its pull requests, nothing else. No
# secret. engine.yml itself keeps its read-only token: the deletes are here,
# in a job that checks out nothing and builds nothing.
#
# WHERE IT RUNS. On the VPS runners, like board-status.yml: a few dozen calls
# to GitHub.
name: Engine build prune
run-name: Engine build prune ${{ github.event_name == 'workflow_run' && format('after run {0}', github.event.workflow_run.id) || format('by {0}', github.actor) }}
on:
  workflow_run:
    workflows: [Engine build]
    types: [completed]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  pull-requests: read
concurrency:
  group: engine-prune
  cancel-in-progress: false
jobs:
  prune:
    name: Drop the engine builds nothing pins
    runs-on: [self-hosted, Windows, thornswood-vps]
    # A few dozen calls. Past this it is stuck, not slow.
    timeout-minutes: 5
    steps:
      - name: Drop the engine builds nothing pins
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_RUN: ${{ github.event.workflow_run.id }}
          FORK: EvilPatrick06/skymp
          FORK_BRANCH: thornswood/engine-changes
        run: |
          $ErrorActionPreference = 'Stop'
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $gh = 'https://api.github.com'
          $repo = $env:GITHUB_REPOSITORY
          function Has($o, [string]$n) { return ($null -ne $o -and $o.PSObject.Properties[$n] -and $null -ne $o.$n) }
          # One GET; a list comes back one item per element (done-on-merge.yml,
          # #2798: Invoke-RestMethod hands a JSON array on as one object).
          function Get-Api([string]$path) { return @(Invoke-RestMethod -Method Get -Uri "$gh/$path" -Headers $h | ForEach-Object { $_ }) }

          # ---- what is kept, all read before anything is deleted ----
          $keep = [ordered]@{}
          function Keep([string]$sha, [string]$why) {
            $sha = $sha.Trim().ToLowerInvariant()
            if ($sha -notmatch '^[0-9a-f]{40}$') { throw "$why named '$sha', which is not a fork commit, so nothing is deleted" }
            $k = $sha.Substring(0, 12)
            if ($keep.Contains($k)) { $keep[$k] += ", $why" } else { $keep[$k] = $why }
          }
          function Pin([string]$from, [string]$ref) {
            $c = @(Get-Api "repos/$from/contents/engine/skymp?ref=$ref")
            if ($c.Count -ne 1 -or [string]$c[0].type -ne 'submodule' -or -not (Has $c[0] 'sha')) { throw "engine/skymp at $ref of $from is not a submodule pin, so nothing is deleted" }
            return [string]$c[0].sha
          }
          Keep (Pin $repo 'main') "main's pin"
          $tip = @(Get-Api ("repos/$env:FORK/branches/" + [uri]::EscapeDataString($env:FORK_BRANCH)))
          if ($tip.Count -ne 1 -or -not (Has $tip[0] 'commit')) { throw "the fork's $env:FORK_BRANCH did not answer with its commit, so nothing is deleted" }
          Keep ([string]$tip[0].commit.sha) ("the tip of the fork's " + $env:FORK_BRANCH)
          for ($pg = 1; ; $pg++) {
            $prs = @(Get-Api "repos/$repo/pulls?state=open&per_page=100&page=$pg")
            foreach ($p in $prs) {
              # A head whose repository was deleted has nothing to read a pin from.
              if (-not (Has $p.head 'repo')) { Write-Host ("pull request #{0} has no head repository left, so it pins nothing" -f $p.number); continue }
              Keep (Pin ([string]$p.head.repo.full_name) ([string]$p.head.sha)) ("the pin of pull request #" + $p.number)
            }
            if ($prs.Count -lt 100) { break }
          }
          if ($env:BUILT_RUN) {
            $built = @(Get-Api "repos/$repo/actions/runs/$env:BUILT_RUN/artifacts?per_page=100")
            foreach ($b in @($built | ForEach-Object { @($_.artifacts) })) {
              $m = [regex]::Match([string]$b.name, '^engine-([0-9a-f]{12})$')
              if ($m.Success -and -not $keep.Contains($m.Groups[1].Value)) { $keep[$m.Groups[1].Value] = "built by run $env:BUILT_RUN" }
            }
          }

          # A run still going may upload a build nothing pins yet; what it
          # made stays until its own prune.
          $going = @{}
          $runs = @(Get-Api "repos/$repo/actions/workflows/engine.yml/runs?status=in_progress&per_page=100")
          foreach ($g in @($runs | ForEach-Object { @($_.workflow_runs) })) { $going[[string]$g.id] = $true }

          $all = New-Object System.Collections.Generic.List[object]
          for ($pg = 1; ; $pg++) {
            $page = @(@(Get-Api "repos/$repo/actions/artifacts?per_page=100&page=$pg") | ForEach-Object { @($_.artifacts) })
            foreach ($a in $page) { $all.Add($a) }
            if ($page.Count -lt 100) { break }
          }
          $engine = @($all | Where-Object { [string]$_.name -cmatch '^engine-[0-9a-f]{12}$' -and -not $_.expired } | Sort-Object { [long]$_.id })
          function Stays($a) { return ($keep.Contains(([string]$a.name).Substring(7)) -or ((Has $a 'workflow_run') -and $going.ContainsKey([string]$a.workflow_run.id))) }
          $drop = @($engine | Where-Object { -not (Stays $_) })
          $stay = @($engine | Where-Object { Stays $_ })

          foreach ($k in $keep.Keys) { Write-Host ("keeps engine-{0}: {1}" -f $k, $keep[$k]) }
          foreach ($g in $going.Keys) { Write-Host ("keeps what engine.yml run {0} made: it has not ended" -f $g) }
          foreach ($a in $stay) { Write-Host ("  kept   {0} (artifact {1}, run {2}, {3:N0} bytes)" -f $a.name, $a.id, $a.workflow_run.id, [long]$a.size_in_bytes) }

          # ---- the deletes ----
          $failed = 0; $freed = 0
          foreach ($a in $drop) {
            try {
              Invoke-RestMethod -Method Delete -Uri "$gh/repos/$repo/actions/artifacts/$($a.id)" -Headers $h | Out-Null
              $freed += [long]$a.size_in_bytes
              Write-Host ("  dropped {0} (artifact {1}, run {2}, made {3}): nothing pins it" -f $a.name, $a.id, $a.workflow_run.id, $a.created_at)
            } catch {
              $failed++
              Write-Host ("::error::{0} (artifact {1}) could not be deleted: {2}" -f $a.name, $a.id, $_.Exception.Message)
            }
          }
          $kept = [long](@($stay | Measure-Object size_in_bytes -Sum).Sum)
          Write-Host ("{0} engine build(s) kept, {1:N0} bytes; {2} dropped, {3:N0} bytes freed; {4} could not be" -f $stay.Count, $kept, ($drop.Count - $failed), $freed, $failed)
          if ($failed) { exit 1 }
