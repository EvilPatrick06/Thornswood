          $failed = @()
          foreach ($n in $six) {
            $p = Join-Path 'tests' $n
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Write-Host ("--- {0}" -f $n)
            if ($n -like '*.js') { & node $p } else { & pwsh -NoProfile -File $p }
            $code = $LASTEXITCODE
            Write-Host ("--- {0}: exit {1}, {2}s" -f $n, $code, [Math]::Round($sw.Elapsed.TotalSeconds, 1))
            if ($code -ne 0) { $failed += $n; Write-Host ("::error file=tests/{0}::harness failed, the FAIL lines above say what" -f $n) }
          }
          if ($failed.Count) { Write-Host ("{0} harness(es) failed: {1}" -f $failed.Count, ($failed -join ', ')); exit 1 }
          Write-Host ('all {0} passed' -f $six.Count)

      - name: Run the signer check
        shell: pwsh
        run: |
          # Issue #2046. tests\test-signer-check.ps1 sat 1 of 34 red every
          # night from 5 Oct while this build stayed green, because it ran
          # only at night. It compiles Signature.cs and points Refusal and
          # MicrosoftRefusal at real files, about two seconds. The harness
          # restarts itself in Windows PowerShell 5.1, the .NET Framework
          # the launcher runs on.
          & pwsh -NoProfile -File tests\test-signer-check.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=tests/test-signer-check.ps1::the signer check failed, the FAIL lines above say what'
            exit 1
          }

      - name: Run the generated-files build harness
        shell: pwsh
        run: |
          # Issue #1982. tests\test-build-generated.ps1 failed cases C to K
          # because case B overwrote the path to Build-Generated.ps1. It ran
          # nowhere on push, so nothing caught it. It compiles stand-ins for
          # Pandora and BodySlide with the .NET Framework csc and builds into
          # a temp folder; it touches no real game folder.
          & pwsh -NoProfile -File tests\test-build-generated.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=tests/test-build-generated.ps1::the generated-files build harness failed, the FAIL lines above say what'
            exit 1
          }

      - name: Check NPC population policy
        shell: pwsh
        run: |
          & python tests/test-npc-population.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the launcher window
        shell: powershell
        run: |
          # The launcher builds its window from ui.xaml at startup and finds
          # every control by name, so a renamed control or a window that does
          # not parse compiles clean and is found by the person using it. This
          # fails on either. Windows PowerShell on purpose: it parses with the
          # .NET Framework WPF the launcher runs on, not the newer one in pwsh.
          & powershell -NoProfile -File scripts\dev\Check-Controls.ps1 -NoPause
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=launcher/ui.xaml::the launcher window does not line up with the C#, see the lines above'; exit 1 }

      - name: Check the launcher UI thread
        shell: pwsh
        run: |
          # Issue #1216. A Log() from a background thread throws on the
          # window, and the catch then reports a success as a failure.
          # This follows calls out of ThreadPool and Thread delegates in
          # launcher\app. No arguments: the script finds launcher\app from
          # where it lives. A finding exits 1. No python is a check that
          # did not happen, so it is red.
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-Host '::error file=scripts/dev/Check-UiThread.py::no python on this runner, so the UI thread check did not run'
            exit 1
          }
          & python scripts/dev/Check-UiThread.py
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=scripts/dev/Check-UiThread.py::the launcher touches the window from a background thread; the lines above say where'
            exit 1
          }

      - name: Parse every game script
        shell: pwsh
        run: |
          $bad = 0
          # game\ since the reorganisation's phase 6 (issue #440): the gamemode,
          # the plugins and the overlays.
          $files = @(Get-ChildItem -Path scripts -Filter *.js -File -Recurse) + @(Get-ChildItem -Path game -Filter *.js -File) +
                   @(Get-ChildItem -Path game\plugins, game\ui -Filter *.js -File -ErrorAction SilentlyContinue) +
                   @(Get-ChildItem -Path site\server.js, voice\voice-server.js -File)
          foreach ($f in $files) {
            & node --check $f.FullName 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $bad++
              Write-Host ("::error file={0}::does not parse" -f $f.FullName)
            }
          }
          if ($bad) { exit 1 }
          Write-Host ("{0} game script(s) parse" -f $files.Count)

      - name: Parse every bot file
        shell: pwsh
        run: |
          if (-not (Test-Path bot)) { Write-Host 'no bot to parse'; exit 0 }
          $bad = 0
          foreach ($f in (Get-ChildItem bot -Filter *.py -Recurse -File)) {
            & python -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read(), sys.argv[1])" $f.FullName 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $bad++
              Write-Host ("::error file={0}::does not parse" -f $f.FullName)
            }
          }
          if ($bad) { exit 1 }
          Write-Host 'every bot file parses'

      - name: Check the Python names what exists
        shell: pwsh
        run: |
          # Issue #1343. Parsing (the step above) passes a name that does not
          # exist, and Python only finds out when that line runs: in the bot,
          # on the VPS, in front of people. ruff with four rule groups and
          # nothing else: E9 a file that will not compile, F63 a comparison
          # or assert that is always true or false, F7 a break, continue,
          # return or yield where none can be, F82 a name never defined.
          # No style rules, so no line here is red for how it looks. All 48
          # Python files passed on main on 5 October with nothing changed.
          # ruff comes into a venv of this run's own, never the machine's
          # Python, pinned by version and hash in .github\ruff-requirements.txt.
          # By hand, from the repository folder, in any venv:
          #   python -m pip install --only-binary :all: --require-hashes -r .github\ruff-requirements.txt
          #   python -m ruff check --isolated --select E9,F63,F7,F82 (git ls-files '*.py')
          $venv = Join-Path $env:RUNNER_TEMP 'ruff-venv'
          python -m venv $venv
          $py = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $py)) {
            Write-Host '::error::could not make a venv for ruff, so the Python was not checked'
            exit 1
          }
          & $py -m pip install --quiet --disable-pip-version-check --only-binary :all: --require-hashes -r .github\ruff-requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error file=.github/ruff-requirements.txt::could not install the pinned ruff, so the Python was not checked'
            exit 1
          }
          $files = @(git ls-files '*.py')
          & $py -m ruff check --isolated --no-cache --select E9,F63,F7,F82 --output-format github @files
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host ("{0} Python file(s) name only what exists" -f $files.Count)

      - name: Lint (warnings only)
        # Issue #1343. Reports ruff, eslint and PSScriptAnalyzer findings and
        # never fails the build. PSScriptAnalyzer took about 253 s over the
        # repository on Ship PC One on 10 Oct (1276 findings), so 8 minutes.
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        run: |
          # ruff: the venv the step above made from the hash-pinned
          # .github\ruff-requirements.txt, so nothing new is installed.
          $py = Join-Path $env:RUNNER_TEMP 'ruff-venv\Scripts\python.exe'
          if (Test-Path -LiteralPath $py) {
            & $py -m ruff check --no-cache --config .github\lint\ruff.toml --exit-zero --output-format github @(git ls-files '*.py')
          } else { Write-Host '::warning::no ruff venv, ruff lint skipped' }

          # eslint: pinned by version only (no lockfile, no hash).
          $npm = Join-Path $env:RUNNER_TEMP 'lint-npm'
          npm install --prefix $npm --no-save --no-audit --no-fund --silent eslint@9.39.5
          # node runs eslint.js itself, not npm's eslint.cmd shim: cmd.exe reads
          # the shim, whose 'SET dp0=%~dp0' and '%*' are unquoted, so an '&' in
          # its folder or an argument (C:\ThornswoodTemps&Worktrees) cut the
          # command short and eslint never ran (#1343).
          $eslint = Join-Path $npm 'node_modules\eslint\bin\eslint.js'
          if (Test-Path -LiteralPath $eslint) {
            & node $eslint -c (Join-Path $PWD '.github\lint\eslint.config.mjs') .
          } else { Write-Host '::warning::could not install eslint 9.39.5, eslint lint skipped' }

          # PSScriptAnalyzer: pinned by version only, from the PowerShell Gallery.
          $psm = Join-Path $env:RUNNER_TEMP 'lint-psm'
          New-Item -ItemType Directory -Force -Path $psm | Out-Null
          Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Path $psm -Repository PSGallery -Force
          Import-Module (Join-Path $psm 'PSScriptAnalyzer\1.24.0\PSScriptAnalyzer.psd1')
          $found = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings .github\lint\PSScriptAnalyzerSettings.psd1)
          foreach ($d in $found) {
            $lvl = if ($d.Severity -eq 'Error') { 'error' } else { 'warning' }
            Write-Host ("::{0} file={1},line={2}::{3}: {4}" -f $lvl, $d.ScriptPath, $d.Line, $d.RuleName, $d.Message)
          }
          Write-Host ("PSScriptAnalyzer: {0} finding(s)" -f $found.Count)
          exit 0

      - name: Count the silent catches in the launcher
        shell: pwsh
        run: |
          # Entry 239. A catch with nothing in it leaves no line in
          # launcher.log when it fires, and there were 386 of them on 24 Sep.
          # Red when any file in launcher\app has more than
          # scripts\dev\swallow-baseline.txt allows, and since #756 red when a
          # file has fewer and its line has not been lowered with it, so the
          # lowering lands in the branch that made the count fall rather than
          # waiting for somebody to notice. The script says what to do.
          .\scripts\dev\Check-Swallow.ps1

      - name: Build the launcher
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Launcher') | Out-Null
          .\scripts\release\Build-Launcher.ps1 -Root $root -NoPause
          if (-not (Test-Path (Join-Path $root 'Launcher\Thornswood.exe'))) { Write-Host '::error::no Thornswood.exe came out of the build'; exit 1 }

      - name: Build the ship root tool
        shell: pwsh
        run: |
          # Issue #2019. Every Ship builds Thornswood-ShipRoot.exe from
          # scripts\release\ShipRoot\ShipRoot.csproj, which compiles all of
          # launcher\app with its own entry point, and runs it on the folder
          # the release is built from before anything is packed. A launcher
          # change that stops it compiling would stop every Ship, so it is
          # built here with the same MSBuild; tests\test-2019-ship-roots.ps1
          # in the list above runs it on a pretend root.
          $msb = & .\scripts\release\Find-MSBuild.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::MSBuild is not on this runner, so the ship root tool cannot be built'; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP 'shiproot'
          & $msb scripts\release\ShipRoot\ShipRoot.csproj -nologo -v:minimal -nr:false -p:Configuration=Release ('-p:OutDir=' + $out + '\')
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $out 'Thornswood-ShipRoot.exe'))) { Write-Host '::error file=scripts/release/ShipRoot/ShipRoot.csproj::the ship root tool did not build, see the lines above'; exit 1 }

      - name: Check the manifests in the built exes
        shell: pwsh
        run: |
          # Issue #463. Reads the manifest embedded in the launcher and the
          # setup program this build made: per-monitor DPI, asInvoker (neither
          # ever asks for administrator), and an identity version equal to
          # Updater.cs. Also runs the window fit at 100 to 200 percent.
          & pwsh -NoProfile -File tests\test-app-manifest.ps1 -Exe (Join-Path $env:RUNNER_TEMP 'Thornswood\Launcher\Thornswood.exe') -Scratch (Join-Path $env:RUNNER_TEMP 'app-manifest')
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=tests/test-app-manifest.ps1::the built exes do not carry the manifest they should, see the lines above'; exit 1 }

      - name: Scan the built launcher for secrets
        shell: pwsh
        run: |
          # The secrets that shipped were in built artefacts, not in the source,
          # so what this build made is read too, byte by byte: the launcher with
          # everything Build-Launcher embeds in it, and the setup stub.
          $built = @(Join-Path $env:RUNNER_TEMP 'Thornswood\Launcher\Thornswood.exe')
          if (Test-Path out\setup-stub.exe) { $built += (Resolve-Path out\setup-stub.exe).Path }
          .\scripts\dev\Check-Secrets.ps1 -Binary $built
          exit $LASTEXITCODE

      - name: Check the MSBuild launcher against its sources
        shell: pwsh
        run: |
          # Issue #498 (Patrick's option C, 11 Oct; switched 15 Oct): the
          # launcher is built only by MSBuild from launcher\app\Thornswood.csproj
          # and installer\setup\Setup.csproj. This holds that build to what the
          # comparison with the old csc build proved: every resource byte for
          # byte its file, the references, the PE kind, the version in the
          # file details and the manifest, the icon, nothing beside the exe.
          # GitHub's image has Visual Studio; the VPS runners have the Build
          # Tools from Bootstrap-VPS.ps1 -IncludeBuildTools (option A, 12 Oct).
          & pwsh -NoProfile -File tests\test-498-msbuild.ps1 -RequireMSBuild -Scratch (Join-Path $env:RUNNER_TEMP 'msbuild-498')
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=tests/test-498-msbuild.ps1::the MSBuild launcher does not match its sources, see the lines above'; exit 1 }

      - name: Keep the exe from this build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Thornswood.exe
          path: ${{ runner.temp }}/Thornswood/Launcher/Thornswood.exe
          retention-days: 7

      # No pdb artifact (#1356 / #462): the pdb carries absolute build-machine
      # source paths. Packs and the installer already skip *.pdb. Keep the exe
      # above; leave the pdb on the runner only.

  # The default: GitHub's hosted Windows runner (#1306). Skipped when
  # BUILD_RUNNER is vps or a manual run asked for the box, and then the
  # fallback above runs instead.
  launcher:
    name: Launcher builds
    if: ${{ vars.BUILD_RUNNER != 'vps' && inputs.runner != 'vps' }}
    runs-on: windows-latest
    # The hosted runner has two cores: the harness step alone took over
    # eighteen minutes on it, so it gets an hour.
    timeout-minutes: 60
    steps: *checks
