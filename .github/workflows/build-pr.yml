                 'test-2349-server-log.js',
                 'test-2351-delete-person.ps1',
                 'test-2166-retention-fixes.js',
                 'test-2166-kept-chat-and-logs.js',
                 'test-missing-files-stop.ps1',
                 'test-ship-launcher-drift.ps1',
                 'test-client-by-hash.ps1',
                 'test-build-vs-install.ps1',
                 'test-ship-dry-run.ps1',
                 'test-launcher-icons.js',
                 'test-whose-game-gate.js',
                 'test-gate-list.ps1',
