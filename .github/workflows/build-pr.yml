          # tests\test-launcher-icons.js fails if any frame of
          # launcher\app.ico matches a frame of site\public\favicon.ico, or
          # if app.ico and app-dev.ico share a frame.
          # Issue #2177: every picture, video, sound, font, mesh, interface
          # file and plugin in the repository is in the asset provenance
          # register, recordsasset-provenance.json, by its sha256, so a
          # new or changed one is red until its source, maker, licence and
