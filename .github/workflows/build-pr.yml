          # record and its reapply after a restore. About half a minute.
          # Issue #2166: tests\test-2166-retention-fixes.js holds three
          # retention fixes to what the privacy page already says: trouble.json
          # ages by 365 days in the hourly sweep on a scratch site (a kept
          # session's alert stays) and a Discord sign-in no longer sets the
