# The engine pin follows the fork by itself (#5148): one rolling pull request,
# engine-pin/next, that moves engine/skymp to the newest head of the fork's
# thornswood/engine-changes the fork built green, with every record and line
# a pin carries.
#
# WHY. Until #5148 a pin was six hand steps after every fork merge (engine\
# README.md, "One engine"), so fixes sat merged in the fork until somebody was
# there to do them, and the commit typed into THIRD-PARTY.md and credits.md
# went stale between pins. Patrick, 31 Oct 2026: "there has to be more
# efficient, faster, safer, more accurate, streamlined, and more dynamic"
# way. Every step was already a script; this runs them in order.
#
# HOW, ONE LOOK AT A TIME. Nothing in the fork can start a run here without
# holding a token of this repository, so until plan part 8 this looked every
# ten minutes; now it is woken too (WOKEN, NOT ONLY TICKING, below). Each
# look, the job "look" asks GitHub what the next step is (scripts\release\EnginePin.ps1, Get-EnginePinStep):
#   pinned, building, no-build, recording: nothing to do this tick;
#   aside: another open pull request moves engine/skymp (a pin made by hand,
#          or a change that needs the pin with it), so this waits for it;
#   record: the fork built its head green and nothing recorded it, so this
#          starts engine.yml for that commit, which records it on its own;
#   pin:   engine.yml recorded it green, so "make" and "push" move the pin;
#   ready: engine-pin/next already pins the head; the pull request is opened
#          if none is;
#   red:   engine.yml's run for the head ended red. That is a failure to fix
#          at its cause, so this run goes red with its link and never starts
#          engine.yml again for that commit (no re-runs, #5148's rules).
# From a fork merge: the fork's push build (20 to 45 minutes), a tick, the
# record (about 3), the pin (about 4) and the build check (about 5).
#
# WOKEN, NOT ONLY TICKING (plan part 8, Patrick's yes of 31 Oct 2026). Three
# things start a look the moment they happen, so a step waits for no tick:
#   - engine.yml's "wake" job, when a record run on main ends, green or red;
#   - a push to main that moves engine/skymp, so a look that stood aside for
#     another pin pull request moves on once that one merges;
#   - the fork, when its push build of thornswood/engine-changes ends green
#     (the fork's thornswood-wake-pin.yml, with the one secret the fork
#     holds: a fine-grained token that may start workflows here and do
#     nothing else, THORNSWOOD_PIN_WAKE).
# The ten-minute tick stays until the fork's wake has run once for real;
# then it goes, in its own pull request.
#
# THREE JOBS, BECAUSE OF THE TOKEN. "make" runs the front's npm build
# (Build-Front.ps1), which is code from the npm registry, so its token can
# only read. It moves the pin on a local branch with Update-EnginePin.ps1,
# commits it and hands the commit back in its log as a git bundle
# (LogHandBack.ps1, the way engine.yml hands back its records, #3399). "push"
# runs nothing but this repository's own scripts and git: it takes the bundle
# out of make's log, holds it to one commit on main's head that changes only
# a pin's paths, force pushes engine-pin/next, starts build-pr.yml on it (a
# push made with the run's own token starts no pull_request run, and a manual
# run is the event that token may start) and opens or updates the pull
# request (Open-EnginePinPr.ps1). The pull request is the only way the pin
# reaches main: the Desk merges it under the merge rule like any other, and
# the release after every change takes it to dev and then main.
#
# THE TOKEN MAY OPEN PULL REQUESTS. Patrick's yes on 31 Oct 2026, 3:51 PM:
# Thornswood's Actions setting "Allow GitHub Actions to create and approve
# pull requests" is on (records\github-settings.json, workflow_token). Main's
# ruleset requires no review, so approving gives a token nothing, and pull
# requests from forks never get a write token (fork_pull_requests there).
#
# NO SECRET, no self-hosted runner, nothing from the fork run here but the
# front's locked npm build, read only. Every action is named by a full length
# commit SHA with its tag in a comment, for the reason build.yml gives.
# tests\test-5148-engine-pin.ps1 holds this file's shape.
name: Engine pin
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
  # A pin made by another pull request has merged: the look that stood aside
  # for it moves on now, not at the next tick.
  push:
    branches: [main]
    paths: [engine/skymp]
permissions:
  contents: read
# One tick at a time. A tick never cancels the one before it, which may be
# pushing; a third waiting tick drops the second, which would only look again.
concurrency:
  group: engine-pin
  cancel-in-progress: false
jobs:
  look:
    name: What the pin needs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: write
    outputs:
      step: ${{ steps.look.outputs.step }}
      head: ${{ steps.look.outputs.head }}
      run: ${{ steps.look.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Ask GitHub what the next step is
        id: look
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/release/ForkEngineBuild.ps1
          . ./scripts/release/EnginePin.ps1
          $get = {
            param([string]$Path)
            $out = @(gh api $Path 2>&1 | ForEach-Object { [string]$_ })
            if ($LASTEXITCODE -ne 0) { throw ("GitHub answered GET $Path with: " + (($out | Select-Object -Last 2) -join ' ')) }
            return (($out -join "`n") | ConvertFrom-Json)
          }
          $pin = "$(@(git ls-tree HEAD engine/skymp) -split '\s+' | Select-Object -Index 2)".Trim()
          $s = Get-EnginePinStep $pin $get
          Write-Host ("{0}: {1}" -f $s.Step, $s.Why)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("**{0}**: {1}" -f $s.Step, $s.Why)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('step=' + $s.Step)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('head=' + $s.Head)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('run=' + $s.Run)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('open=' + $(if ($s.Step -eq 'ready' -and -not $s.Pr) { 'yes' } else { '' }))
          if ($s.Step -eq 'red') { Write-Host "::error title=Engine pin::$($s.Why)"; exit 1 }

      - name: Record the fork's head
        if: steps.look.outputs.step == 'record'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT: ${{ steps.look.outputs.head }}
        run: |
          gh workflow run engine.yml --repo $env:GITHUB_REPOSITORY --ref main -f "commit=$env:HEAD_COMMIT"
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::engine.yml could not be started'; exit 1 }
          Write-Host "engine.yml started for $env:HEAD_COMMIT; the next tick moves the pin once it is green"

      - name: Open the pull request the branch is ready for
        if: steps.look.outputs.open == 'yes'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release/Open-EnginePinPr.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The test task check reads the pull request's body, so it starts
          # once the pull request has it; its result is required (#5199).
          gh workflow run test-tasks.yml --repo $env:GITHUB_REPOSITORY --ref engine-pin/next
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::the test task check could not be started on engine-pin/next'; exit 1 }
          # And the release note check, for the same reason (plan part 8).
          gh workflow run pr-body.yml --repo $env:GITHUB_REPOSITORY --ref engine-pin/next
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::the release note check could not be started on engine-pin/next'; exit 1 }

  make:
    name: Make the pin
    needs: look
    if: needs.look.outputs.step == 'pin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      # The node the front's record names (records\front-build.json,
      # builtWith): webpack's output is held to it byte for byte.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Move the pin on a local branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT: ${{ needs.look.outputs.head }}
          ENGINE_RUN: ${{ needs.look.outputs.run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c engine-pin/next
          $t = Join-Path $env:RUNNER_TEMP 'pin-title.txt'
          $b = Join-Path $env:RUNNER_TEMP 'pin-body.md'
          ./scripts/release/Update-EnginePin.ps1 -Commit $env:HEAD_COMMIT -Run $env:ENGINE_RUN -TitleFile $t -BodyFile $b
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $m = Join-Path $env:RUNNER_TEMP 'pin-message.txt'
          [IO.File]::WriteAllText($m, ([IO.File]::ReadAllText($t) + "`n`n" + [IO.File]::ReadAllText($b)))
          git commit -q -F $m
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::the pin could not be committed'; exit 1 }
          git show --stat --format='%H %s' HEAD

      - name: Hand the pin back in the log
        shell: pwsh
        run: |
          # The commit as a git bundle over main's head, between two marked
          # lines (LogHandBack.ps1). The mark is put together here so this
          # script's own text, which the log shows first, never holds it.
          . ./scripts/release/LogHandBack.ps1
          $f = Join-Path $env:RUNNER_TEMP 'pin.bundle'
          git bundle create $f main..engine-pin/next
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::git bundle failed'; exit 1 }
          foreach ($l in @(Get-LogHandBackLines ('ENGINE' + '-PIN') ([IO.File]::ReadAllBytes($f)))) { Write-Host $l }

  push:
    name: Push the pin
    needs: [look, make]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Take the pin out of make's log
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT: ${{ needs.look.outputs.head }}
        run: |
          . ./scripts/release/LogHandBack.ps1
          $jobs = (gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100" | ConvertFrom-Json).jobs
          $make = @($jobs | Where-Object { [string]$_.name -eq 'Make the pin' -and [string]$_.conclusion -eq 'success' })
          if ($make.Count -ne 1) { Write-Host "::error::this run has $($make.Count) green Make the pin jobs, not one"; exit 1 }
          $flags = Get-GhLogFlags
          $log = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/$($make[0].id)/logs" @flags)
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::make''s log could not be read'; exit 1 }
          $f = Join-Path $env:RUNNER_TEMP 'pin.bundle'
          [IO.File]::WriteAllBytes($f, (Read-LogHandBack $log ('ENGINE' + '-PIN')))
          git bundle verify $f
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::the bundle is not one over main''s head'; exit 1 }
          git fetch -q $f engine-pin/next:engine-pin/next
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::the bundle has no engine-pin/next'; exit 1 }
          # Held to a pin before anything is pushed: one commit on main's
          # head, engine/skymp at the head look found, and no path but a
          # pin's.
          $main = "$(git rev-parse HEAD)".Trim()
          $parents = @("$(git rev-list --parents -n 1 engine-pin/next)".Trim() -split ' ')
          if ($parents.Count -ne 2 -or $parents[1] -ne $main) { Write-Host "::error::engine-pin/next is not one commit on main's head $main"; exit 1 }
          $gitlink = "$(@(git ls-tree engine-pin/next engine/skymp) -split '\s+' | Select-Object -Index 2)".Trim()
          if ($gitlink -ne $env:HEAD_COMMIT) { Write-Host "::error::engine-pin/next pins $gitlink, not $env:HEAD_COMMIT"; exit 1 }
          $allowed = '^(engine/skymp|records/(server-build|client-build|client-licences|front-build)\.json|records/(client|front)-licences/[^/]+|THIRD-PARTY\.md|site/data/site/credits\.md)$'
          $bad = @(git diff --name-only main engine-pin/next | Where-Object { $_ -notmatch $allowed })
          if ($bad.Count) { Write-Host "::error::engine-pin/next changes more than a pin: $($bad -join ', ')"; exit 1 }
          git show --stat --format='%H %s' engine-pin/next

      - name: Push it, check it, and open or update its pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push --force origin engine-pin/next:refs/heads/engine-pin/next
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::engine-pin/next could not be pushed'; exit 1 }
          gh workflow run build-pr.yml --repo $env:GITHUB_REPOSITORY --ref engine-pin/next
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::the build check could not be started on engine-pin/next'; exit 1 }
          ./scripts/release/Open-EnginePinPr.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The test task check reads the pull request's body, so it starts
          # once the pull request has it; its result is required (#5199).
          gh workflow run test-tasks.yml --repo $env:GITHUB_REPOSITORY --ref engine-pin/next
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::the test task check could not be started on engine-pin/next'; exit 1 }
          # And the release note check, for the same reason (plan part 8).
          gh workflow run pr-body.yml --repo $env:GITHUB_REPOSITORY --ref engine-pin/next
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::the release note check could not be started on engine-pin/next'; exit 1 }
