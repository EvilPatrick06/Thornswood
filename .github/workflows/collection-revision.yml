# Every hour: Nexus's newest published collection revision, the record and
# both feeds held to each other, and the rebuild on the board while they
# part (#4068).
#
# WHY. Collection revision 5 was published on Nexus on 21 Oct, and on 27 Oct
# both feeds still named revision 2: nothing compared them, so a launcher on
# revision 2 was let in and nobody was told the servers needed rebuilding.
# Patrick, 27 Oct: the launcher is always on the newest revision, every update
# is built on it, and the launcher refuses Play on any other. A Ship refuses
# while the record is behind Nexus; this is what puts the rebuild in front of
# the Desk, whoever published the revision and however.
#
# WHAT IT DOES. scripts\release\Check-CollectionRevisions.ps1 -Issue reads the
# four numbers (Nexus's public read, no key; the record in this checkout; each
# feed on the site) and keeps one open issue, "Collection revision N is
# published: rebuild dev, then main, on it", while any is behind, and closes
# it once all four agree. A number it cannot read changes no issue and turns
# the run red, so a check that could not look is never a quiet green.
#
# WHERE IT RUNS. On GitHub's Windows runner (#4983), like expire-claims.yml:
# this is four reads and at most a few REST calls. The run's own token can
# read and edit issues and nothing else.
name: Collection revision check
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: collection-revision
  cancel-in-progress: false
jobs:
  check:
    name: Hold Nexus, the record and both feeds to one revision
    # Main only (#3550): a dispatch on a branch skips it, so only main's code
    # runs with this job's token.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    # Four reads and a few calls to GitHub. Past this it is stuck, not slow.
    timeout-minutes: 5
    steps:
      # Every commit and tree, no old file contents: Nexus is asked with the
      # launcher's number as Application-Version (Nexus.ps1), worked out from
      # when its sources last changed (LauncherVersion.ps1, #5179), which a
      # shallow checkout cannot say.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Read the four revisions and keep the rebuild issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          & .\scripts\release\Check-CollectionRevisions.ps1 -Issue
          exit $LASTEXITCODE
