# Builds the installer from main's feed and signs it on GitHub's runner, so a
# main Ship needs no One for it (#3412, #2862).
#
# WHY. Package-Thornswood.ps1 built the installer from One's game folder and
# Vortex record and signed it there, so every main Ship needed One, and the
# installer carried whatever that folder held: measured 26 Oct, the one One
# built that evening carried a Thornswood-Content.esp and Thornswood-Last.esp
# no main release had. Package-Thornswood -FromFeed builds it from what main's
# newest release recorded, on any machine (the header there).
#
# HOW TO START IT. On a v tag, because only a refs/tags/v ref gets the
# "release" environment, whose subject is the one the Azure federated
# credential trusts (release.yml, HOW IT SIGNS). Normally the tag of the
# launcher main's feed offers, after the Ship that published the release:
#   gh workflow run installer.yml --ref v<launcher version>
# The tag has to be on main (Resolve-ReleaseTag.ps1). What is built does not
# come from the tag: the scripts are main's, and the files are the ones main's
# feed names, each held to its sha256 (New-FeedRoot.ps1), so starting it on
# any v tag builds the same installer.
#
# WHAT IT DOES. Checks out main, fetches the setup program release.yml built
# beside the launcher main's feed offers (held to that draft's SHA256SUMS),
# runs Package-Thornswood -FromFeed -OneFile -NoPublish, which signs the
# finished Setup through Sign-Artifact.ps1 (it asks GitHub for the federated
# token itself, right before signtool, since the build fetches the release
# for longer than a token lasts), and puts Thornswood-Setup.exe and the note
# naming its release on that launcher's draft (scripts\release\
# Installer-OnGitHub.ps1). A draft is seen by nobody without push access, and
# a release file takes none of the 500 MB artifact storage (#3410). Nothing
# here touches the site: the Ship that publishes a release publishes its
# installer from the draft.
#
# WHERE IT RUNS. On GitHub's hosted windows-latest alone, as release.yml
# signs the launcher (Patrick's answer A on #4013: releases sign on GitHub's
# runner alone, because no VPS runner serves this repository once it is
# public). Then a second hosted machine, which never held the signing setup,
# downloads the draft's installer and holds it to the publish gate (the
# "verify" job). A red verify means the draft's installer must not be
# published. A hosted runner is a fresh machine for every job, so nothing
# this leaves on it outlives the job. When the hosted job cannot run (no
# minutes), the installer is built and signed on One, as before (#921).
#
# Every action is named by a full length commit SHA with its tag in the
# comment, for the reason build.yml gives.
name: Release installer
run-name: Installer from main's feed (${{ github.ref_name }})
on:
  workflow_dispatch:
# The draft is read and written with the repository token, which needs write
# (a draft is visible to nobody without push access). The build job adds
# id-token: write for itself only.
permissions:
  contents: write
# One installer build at a time, whichever tag started it: they all build
# main's newest release, and two would race for the same draft's files.
concurrency:
  group: installer
  cancel-in-progress: false
jobs:
  installer:
    name: Build and sign the installer from main's feed
    runs-on: windows-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    # The feed's files are fetched and zipped: minutes, not an hour.
    timeout-minutes: 45
    steps:
      - name: Check out the repository, with every tag and main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          submodules: false
          fetch-depth: 0

      # The run's ref is what unlocks the signing identity, so it has to be a
      # v tag on main; then main is what is built from (header, HOW TO START IT).
      - name: Confirm the run is on a release tag on main, then check out main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notlike 'refs/tags/v*') { Write-Host ('::error::start this on a v tag, which is what the signing identity is given to: gh workflow run installer.yml --ref v<launcher version> (this run is on ' + $env:GITHUB_REF + ')'); exit 1 }
          . .\scripts\release\Resolve-ReleaseTag.ps1
          try { $commit = Resolve-ThornswoodReleaseTag -Tag $env:GITHUB_REF_NAME -RepoDir . -MainRef origin/main }
          catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          if ($commit -ne $env:GITHUB_SHA) { Write-Host "::error::tag $($env:GITHUB_REF_NAME) is $commit, and this run is on $($env:GITHUB_SHA)"; exit 1 }
          git checkout --force --detach origin/main
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::could not check out origin/main'; exit 1 }
          git clean -ffdx
          Write-Host ("on tag {0}; building from main at {1}" -f $env:GITHUB_REF_NAME, "$(git rev-parse HEAD)".Trim())

      - name: Fetch the setup program beside the launcher main's feed offers
        id: stub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .\scripts\release\Installer-OnGitHub.ps1
          try {
            $api = New-InstallerGitHubApi $env:GH_TOKEN
            $tag = Get-InstallerLauncherTag
            $stub = Save-InstallerStub $api $env:GITHUB_REPOSITORY $tag (Join-Path $env:RUNNER_TEMP 'stub')
          } catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          Write-Host ("setup program from the release for {0}: {1}" -f $tag, $stub)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('tag=' + $tag)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('stub=' + $stub)

      # Microsoft's signing client at the version and sha256
      # Setup-ShipMachine.ps1 pins, the way release.yml fetches it, into
      # records\signing\client of this checkout, which git ignores.
      - name: Fetch the signing client Setup-ShipMachine.ps1 pins
        shell: pwsh
        run: |
          $src = [IO.File]::ReadAllText((Resolve-Path 'scripts\release\Setup-ShipMachine.ps1'))
          $t = $null; $e = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$t, [ref]$e)
          foreach ($name in 'Get-SigningClientPin', 'Get-Sha256', 'Save-Url', 'Save-SigningClient') {
            $fn = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name }, $true)
            if (-not $fn) { Write-Host "::error::Setup-ShipMachine.ps1 has no $name"; exit 1 }
            . ([scriptblock]::Create($fn.Extent.Text))
          }
          $repo = (Get-Location).Path
          $why = Save-SigningClient $repo (Get-SigningClientPin) ${function:Save-Url} (Join-Path $env:RUNNER_TEMP 'signing-client')
          if ($why) { Write-Host ('::error::' + $why); exit 1 }
          # signing.json from the tracked template: paths only, no key. It is
          # gitignored and lives on this job's machine only.
          Copy-Item -LiteralPath 'records\signing\signing.template.json' -Destination 'records\signing\signing.json' -Force

      # The ids are repository variables, not secrets (release.yml says why).
      # No token is asked for here: Sign-Artifact.ps1 asks for it right
      # before signtool (its header, IN A GITHUB JOB).
      - name: Build and sign the installer from main's feed
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          INSTALLER_STUB: ${{ steps.stub.outputs.stub }}
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:AZURE_TENANT_ID) { Write-Host '::error::the AZURE_SIGNING_CLIENT_ID and AZURE_SIGNING_TENANT_ID repository variables are not set'; exit 1 }
          $root = Join-Path $env:RUNNER_TEMP 'feed-root'
          $out = Join-Path $env:RUNNER_TEMP 'installer'
          .\scripts\release\Package-Thornswood.ps1 -FromFeed -OneFile -NoPublish -NoPause -Root $root -OutDir $out -Stub $env:INSTALLER_STUB
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Package-Thornswood.ps1 -FromFeed exited $LASTEXITCODE"; exit 1 }
          $exe = Join-Path $out 'Thornswood-Setup.exe'
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne 'Valid') { Write-Host ('::error::the installer reads back ' + $sig.Status + ' after signing; it goes nowhere'); exit 1 }
          if (-not $sig.TimeStamperCertificate) { Write-Host '::error::the signed installer has no timestamp'; exit 1 }
          Write-Host ('signed by ' + $sig.SignerCertificate.Subject + ' on a ' + $env:RUNNER_ENVIRONMENT + ' runner')

      - name: Put the installer on the launcher's draft
        id: draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCHER_TAG: ${{ steps.stub.outputs.tag }}
        run: |
          . .\scripts\release\Installer-OnGitHub.ps1
          try {
            $api = New-InstallerGitHubApi $env:GH_TOKEN
            $id = Send-InstallerToRelease $api $env:GITHUB_REPOSITORY $env:LAUNCHER_TAG (Join-Path $env:RUNNER_TEMP 'installer')
          } catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('release_id=' + $id)

  # A SECOND MACHINE CHECKS THE DRAFT'S INSTALLER, as release.yml's verify:
  # another hosted machine, holding no signing client, no signing.json and no
  # Azure token, accepts it on its files alone.
  verify:
    name: Check the draft's installer on a second machine
    needs: installer
    if: ${{ !cancelled() && needs.installer.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      DRAFT_ID: ${{ needs.installer.outputs.release_id }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          clean: true
          submodules: false

      - name: Download the draft's installer and hold it to the publish gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .\scripts\release\Installer-OnGitHub.ps1
          $dir = Join-Path $env:RUNNER_TEMP 'installer-check'
          if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
          try { $api = New-InstallerGitHubApi $env:GH_TOKEN } catch { Write-Host ('::error::' + $_.Exception.Message); exit 1 }
          $why = Get-InstallerDraftRefusal $api $env:GITHUB_REPOSITORY $env:DRAFT_ID $dir (Get-Location).Path
          Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
          if ($why) { Write-Host ("::error::the installer on draft $($env:DRAFT_ID) did not pass on a second machine, so it must not be published: " + $why); exit 1 }
