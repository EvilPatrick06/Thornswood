# A board: or order: label sets the issue's card on the board, then comes off
# (#2863, #2862).
#
# WHY. Patrick, 19 Oct 2026: an issue goes to In Progress on the board the
# moment work starts on it, and to Done when it is merged and only needs
# testing (the board's Status options are Todo, In Progress and Done); and
# "we need to make it so it works in the cloud". The board is a user-owned
# Projects board, and its fields change only through GraphQL. A cloud Claude
# thread is refused GraphQL and the user-scoped projectsV2 routes (403,
# measured 19 Oct), but it can add a label to an issue over REST. So a label
# is the instruction and this workflow carries it out:
#
#     gh api -X POST repos/EvilPatrick06/Thornswood/issues/<N>/labels -f "labels[]=board: In Progress"
#     gh api -X POST repos/EvilPatrick06/Thornswood/issues/<N>/labels -f "labels[]=order: 52.5"
#
# "board: <Status>" names a Status option. Case, spaces and hyphens do not
# matter ("in-progress" is In Progress). A name the board does not have turns
# the run red and lists the ones it does. It never adds an option: GitHub
# rewrites every option when one is added, which can clear the Status on
# every card.
#
# "order: <number>" sets the card's Order, the do-order (Developer-Guide.md,
# the board). Any number, 52.5 included; anything else turns the run red.
#
# WHAT IT DOES. It checks out nothing and runs no action. The label name and
# the issue come from the event through the environment, never pasted into
# the script. With the board token it reads the board's Status and Order
# fields, adds the issue to the board (GitHub hands back the card it already
# has, so this finds the card and never makes a second one) and sets the one
# field the label names. Then, with the run's own token, which can do nothing
# but edit issues, it takes every label of that kind off the issue. The label
# is a one-shot instruction, never a second copy of the card that could go
# stale when someone moves the card by hand. An order: label is deleted from
# the repository instead, which takes it off the issue too, because each
# number is a label of its own and they would pile up in the label list; the
# three board: labels stay.
#
# Runs for one issue go one at a time, in the order the labels went on. When
# two wait, GitHub keeps the newer and cancels the older, and the run that
# goes takes the cancelled one's label off with its own, so the card ends on
# the last label put on and no label is left behind.
#
# THE TOKEN. GITHUB_TOKEN cannot reach a user-owned board, and GitHub's
# documentation says fine-grained tokens cannot reach Projects owned by a
# user account, so BOARD_TOKEN is a classic token with the project and repo
# scopes (repo, because the repository is private and the token has to see
# the issue to find its card). It is a secret of the "board" environment,
# which only main may use, so a workflow on a pull request branch cannot read
# it. Missing or refused, the run goes red and says which.
#
# WHERE IT RUNS. On the VPS runners, [self-hosted, Windows, thornswood-vps],
# like drop-claims.yml. The job starts only for a label that begins "board:"
# or "order:", so every other label takes no runner slot.
name: Board card from a label
on:
  issues:
    types: [labeled]
permissions:
  issues: write
jobs:
  status:
    name: Set the card's Status or Order
    if: ${{ startsWith(github.event.label.name, 'board:') || startsWith(github.event.label.name, 'order:') }}
    runs-on: [self-hosted, Windows, thornswood-vps]
    environment: board
    # On the job, not the workflow: the job's if is read first, so a run for
    # some other label never joins the queue and cannot push a board run out.
    concurrency:
      group: board-status-${{ github.event.issue.number }}
      cancel-in-progress: false
    # A handful of calls to GitHub. Past this it is stuck, not slow.
    timeout-minutes: 3
    steps:
      - name: Set what the label names, then take its labels off
        shell: pwsh
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          BOARD_OWNER: EvilPatrick06
          BOARD_NUMBER: '1'
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_NODE: ${{ github.event.issue.node_id }}
          LABEL: ${{ github.event.label.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:BOARD_TOKEN) { throw 'BOARD_TOKEN is not set in the board environment, so nothing can reach the board (#2863 says how to make it)' }
          $kind = ($env:LABEL.Substring(0, $env:LABEL.IndexOf(':'))).ToLowerInvariant()
          $wanted = $env:LABEL.Substring($env:LABEL.IndexOf(':') + 1).Trim()
          if (-not $wanted) { throw "the label '$env:LABEL' names nothing after the colon" }
          function Key([string]$s) { ($s.ToLowerInvariant() -replace '[^a-z0-9]', '') }
          function Board([string]$query, [hashtable]$vars) {
            $h = @{ Authorization = "Bearer $env:BOARD_TOKEN"; 'Content-Type' = 'application/json' }
            $body = @{ query = $query; variables = $vars } | ConvertTo-Json -Depth 6 -Compress
            $r = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/graphql' -Headers $h -Body $body
            if ($r.PSObject.Properties['errors'] -and $r.errors) { throw ('the board answered: ' + (@($r.errors | ForEach-Object { $_.message }) -join '; ')) }
            return $r.data
          }

          $d = Board 'query($o:String!,$n:Int!){user(login:$o){projectV2(number:$n){id status:field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}} order:field(name:"Order"){... on ProjectV2Field{id dataType}}}}}' @{ o = $env:BOARD_OWNER; n = [int]$env:BOARD_NUMBER }
          $project = $d.user.projectV2
          if (-not $project) { throw "board $env:BOARD_NUMBER of $env:BOARD_OWNER is not there, or the token cannot see it" }
          if ($kind -eq 'board') {
            $field = $project.status
            if (-not $field -or -not $field.PSObject.Properties['options']) { throw 'the board has no single-select field named Status' }
            $option = @($field.options | Where-Object { (Key $_.name) -eq (Key $wanted) })
            if ($option.Count -ne 1) { throw ("the board has no Status '{0}'; it has: {1}" -f $wanted, (@($field.options | ForEach-Object { $_.name }) -join ', ')) }
            $value = @{ singleSelectOptionId = $option[0].id }
            $said = 'Status set to ' + $option[0].name
          } else {
            $field = $project.order
            if (-not $field -or -not $field.PSObject.Properties['dataType'] -or $field.dataType -ne 'NUMBER') { throw 'the board has no number field named Order' }
            $n = 0.0
            if (-not [double]::TryParse($wanted, [Globalization.NumberStyles]::Float, [Globalization.CultureInfo]::InvariantCulture, [ref]$n) -or [double]::IsNaN($n) -or [double]::IsInfinity($n)) { throw "the label '$env:LABEL' is not a number Order can take (52 or 52.5)" }
            $value = @{ number = $n }
            $said = 'Order set to ' + $n.ToString([Globalization.CultureInfo]::InvariantCulture)
          }

          $item = (Board 'mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' @{ p = $project.id; c = $env:ISSUE_NODE }).addProjectV2ItemById.item.id
          if (-not $item) { throw "the board gave back no card for #$env:ISSUE" }
          $null = Board 'mutation($p:ID!,$i:ID!,$f:ID!,$v:ProjectV2FieldValue!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:$v}){projectV2Item{id}}}' @{ p = $project.id; i = $item; f = $field.id; v = $value }
          Write-Host ("#{0}: {1}" -f $env:ISSUE, $said)

          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $repo = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $base = "$repo/issues/$env:ISSUE/labels"
          $on = @(Invoke-RestMethod -Method Get -Uri ($base + '?per_page=100') -Headers $h | ForEach-Object { $_.name } | Where-Object { $_ -like ($kind + ':*') })
          if ($kind -eq 'board') {
            foreach ($l in $on) {
              try {
                Invoke-RestMethod -Method Delete -Uri ($base + '/' + [Uri]::EscapeDataString($l)) -Headers $h | Out-Null
                Write-Host "took $l off #$env:ISSUE"
              } catch {
                # 404 is GitHub saying the label is already off: a run for the
                # same issue got there first, which is the state this run wants.
                $r = $_.Exception.Response
                if ($r -and [int]$r.StatusCode -eq 404) { Write-Host "$l was already off #$env:ISSUE" }
                else { throw }
              }
            }
            exit 0
          }
          # An order: label is deleted from the repository, which takes it off
          # every issue as well. The one this run was for may be off already,
          # when a run before it deleted it, so it is named whatever the read
          # found.
          $drop = @((@($on) + $env:LABEL) | Select-Object -Unique)
          foreach ($l in $drop) {
            try {
              Invoke-RestMethod -Method Delete -Uri ($repo + '/labels/' + [Uri]::EscapeDataString($l)) -Headers $h | Out-Null
              Write-Host "deleted the label $l"
            } catch {
              $r = $_.Exception.Response
              if ($r -and [int]$r.StatusCode -eq 404) { Write-Host "the label $l was already deleted" }
              else { throw }
            }
          }
