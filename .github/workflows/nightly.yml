# Every night on GitHub's Windows runner (#4983): everything the pull request
# check does, and the slow half it leaves out. Patrick, 25 September: "let's
# do #1 and setup a nightly schedule to do a bunch of security, file,
# github, code checks".
#
#   security  the secret scan of the tree and of the built launcher
#   files     every PowerShell, game and bot file parses; the writing rules
#   code      all ~380 test harnesses in tests/, plus the bot and voice harnesses, the
#             launcher window check and the launcher build
#   GitHub    pull requests open more than two days and branches other than
#             main, which CONTRIBUTING.md says are merged or closed; issues
#             and comments of the last day not written plain (#3692)
#
# Every action here is named by a full length commit SHA with its tag in the
# comment, for the reason build.yml gives: a tag is a moving pointer.
#
# Any failure opens an issue on the board, or adds to the one already open,
# and the first night everything passes closes it (Nightly-Issue.ps1),
# with a link to the run; the last lines of each harness job name every
# harness that failed and the ten slowest. Runs at 03:00 Mountain (09:00
# UTC), when nobody is playing, and by hand from the Actions tab.
#
# Three jobs since #2357. On 12 Oct the one job that ran everything used 43
# of its 45 minutes, nearly all of it the harnesses (692 of them, 2,587 s
# added up), and they grow by tens a day. So the harnesses run in shares,
# one job each on a runner of its own with 45 minutes of its own
# (scripts\dev\Nightly-Harnesses.ps1 says how they are shared and why that
# is safe), the rest of the checks in a job beside them, and the board is
# told in a last job that waits for all of them and runs whether they passed
# or failed, though not when somebody cancels the run.
name: Nightly checks
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  nightly:
    name: Nightly checks
    # Main only (#3550): this job and "board" never run a branch's code. A
    # dispatch on a branch runs the harness shares and the bot harnesses
    # alone, and tells the board nothing: a branch's night is not main's, and
    # the first night that passes closes the board's issue.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Every commit and tree, no old file contents: "Build the launcher"
      # works out the launcher's number from when its sources last changed
      # (scripts\release\LauncherVersion.ps1, #5179), which a shallow checkout
      # cannot say.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Scan the tree for secrets
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # Entry 236. Every tracked file, by the rules in scripts\dev\Check-Secrets.ps1.
          # A hit names the file, the line and the rule and never the value,
          # because anybody on the repository can read this log. A known
          # non-secret goes in scripts\dev\Check-Secrets.allow.txt with its reason.
          #
          # And the engine fork's own files (issue #1326). The checkout leaves
          # engine\skymp empty, so it is fetched here at the commit this
          # repository pins, shallow (a few seconds), read with the tree, and
          # taken out again, so every step after this one sees the checkout it
          # always did. -Submodules Require: a fork that did not arrive is not
          # a pass. core.longpaths, because the fork's deepest path is 230
          # characters before the runner's folder goes in front of it. The
          # build on every pull request leaves it out and says so.
          git -c core.longpaths=true submodule update --init --depth 1 engine/skymp
          $fetched = ($LASTEXITCODE -eq 0)
          if (-not $fetched) { Write-Host '::error file=.gitmodules::engine/skymp could not be fetched at its pin, so the fork was not scanned' }
          .\scripts\dev\Check-Secrets.ps1 -Submodules Require
          $code = $LASTEXITCODE
          git -c core.longpaths=true submodule deinit -q -f engine/skymp
          if ($code -eq 0 -and -not $fetched) { $code = 1 }
          exit $code

      - name: Check the fork's Papyrus event list against its record
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # Issue #503. records\papyrus-events.json is the fork's event list,
          # both halves: what the client blocker lets through and what the
          # server sends and can load. The build on every pull request has no
          # fork, so this is where the record is read against the fork at the
          # pin: fetched shallow, read from git's objects at that commit by
          # tests\test-papyrus-event-list.js, and taken out again, the way the
          # secret scan above does it. A pin that moved over fork work which
          # leaves the list alone passes; one that changed the list fails
          # here, naming what changed and the command that writes the record
          # again. THORNSWOOD_FORK_REQUIRED: a fork that did not arrive is a
          # failure, not a skip.
          git -c core.longpaths=true submodule update --init --depth 1 engine/skymp
          $fetched = ($LASTEXITCODE -eq 0)
          if (-not $fetched) { Write-Host '::error file=.gitmodules::engine/skymp could not be fetched at its pin, so the event list was not checked' }
          $env:THORNSWOOD_FORK_REQUIRED = '1'
          node tests\test-papyrus-event-list.js
          $code = $LASTEXITCODE
          git -c core.longpaths=true submodule deinit -q -f engine/skymp
          if ($code -ne 0) { Write-Host '::error file=records/papyrus-events.json::the record is not the fork''s event list at the pin; the lines above say what changed. node scripts\dev\PapyrusEventList.js --write writes it again' }
          if ($code -eq 0 -and -not $fetched) { $code = 1 }
          exit $code

      - name: Run the fork's kept NPC harness at the pin
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # Issue #2483: tests\test-2483-kept-npcs.js runs the fork's own
          # skymp5-client\test-kept-npc-adopt.js. The harness shares below
          # never have the fork, so it failed there every night (#1273); it
          # is run here instead, with the fork fetched shallow at its pin and
          # taken out again, the way the two steps above do it, and
          # THORNSWOOD_FORK_REQUIRED makes a fork that did not arrive a
          # failure. Everywhere without the fork it says SKIP.
          git -c core.longpaths=true submodule update --init --depth 1 engine/skymp
          $fetched = ($LASTEXITCODE -eq 0)
          if (-not $fetched) { Write-Host '::error file=.gitmodules::engine/skymp could not be fetched at its pin, so the kept NPC harness did not run' }
          $env:THORNSWOOD_FORK_REQUIRED = '1'
          node tests\test-2483-kept-npcs.js
          $code = $LASTEXITCODE
          git -c core.longpaths=true submodule deinit -q -f engine/skymp
          if ($code -eq 0 -and -not $fetched) { $code = 1 }
          exit $code

      - name: Parse every PowerShell script
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path scripts, tests, installer -Filter *.ps1 -Recurse -File | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              $bad++
              Write-Host ("::error file={0},line={1}::{2}" -f $_.FullName, $e.Extent.StartLineNumber, $e.Message)
            }
          }
          if ($bad) { exit 1 }
          Write-Host "every script parses"

      - name: Check the writing rules
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # The Words section of CONTRIBUTING.md, over the files people read: no em
          # dashes, never the word player, and the owner is Patrick. Written
          # down since the start and never checked, and on 24 September eleven
          # hits had gone out in those files. Each hit is marked on its line.
          .\scripts\dev\Check-Words.ps1

      - name: Check the launcher window
        if: ${{ !cancelled() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # The launcher builds its window from ui.xaml at startup and finds
          # every control by name, so a renamed control or a window that does
          # not parse compiles clean and is found by the person using it. This
          # fails on either. Windows PowerShell on purpose: it parses with the
          # .NET Framework WPF the launcher runs on, not the newer one in pwsh.
          # -ExecutionPolicy Bypass on both, as every harness starts 5.1:
          # Windows 11 keeps 5.1 at Restricted, so on One's runners the plain
          # shell: powershell could not run this step's own script (#3861).
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\dev\Check-Controls.ps1 -NoPause
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=launcher/ui.xaml::the launcher window does not line up with the C#, see the lines above'; exit 1 }

      - name: Parse every game script
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $bad = 0
          # game\ since the reorganisation's phase 6 (issue #440): the gamemode,
          # the plugins and the overlays.
          $files = @(Get-ChildItem -Path scripts -Filter *.js -File -Recurse) + @(Get-ChildItem -Path game -Filter *.js -File) +
                   @(Get-ChildItem -Path game\plugins, game\ui -Filter *.js -File -ErrorAction SilentlyContinue)
          foreach ($f in $files) {
            & node --check $f.FullName 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $bad++
              Write-Host ("::error file={0}::does not parse" -f $f.FullName)
            }
          }
          if ($bad) { exit 1 }
          Write-Host ("{0} game script(s) parse" -f $files.Count)

      - name: Parse every bot file
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (-not (Test-Path bot)) { Write-Host 'no bot to parse'; exit 0 }
          $bad = 0
          foreach ($f in (Get-ChildItem bot -Filter *.py -Recurse -File)) {
            & python -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read(), sys.argv[1])" $f.FullName 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $bad++
              Write-Host ("::error file={0}::does not parse" -f $f.FullName)
            }
          }
          if ($bad) { exit 1 }
          Write-Host 'every bot file parses'

      - name: Count the silent catches in the launcher, the scripts, the site, voice and the bot
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # Entry 239. A catch with nothing in it leaves no line in
          # launcher.log when it fires, and there were 386 of them on 24 Sep.
          # Since #2711 the PowerShell under scripts\ and installer\ as well,
          # and since #2736 the JavaScript under site\ and voice\ and the
          # Python under bot\.
          # Red when any of those files has more than
          # scripts\dev\swallow-baseline.txt allows, and since #756 red when a
          # file has fewer and its line has not been lowered with it. The
          # script says what to do.
          .\scripts\dev\Check-Swallow.ps1

      - name: Lint the whole tree (warnings only)
        if: ${{ !cancelled() }}
        # #3185 (from #1343): a pull request's build lints only the files it
        # changed, so the report over every file is made here, once a night.
        # Warnings only: continue-on-error, and scripts\dev\Lint.ps1 always
        # ends 0. The pinned tools are kept in this runner account's own
        # folder by version, so a night fetches nothing it already has.
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          .\scripts\dev\Lint.ps1 -All
          exit 0

      - name: Build the launcher
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Thornswood'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Launcher') | Out-Null
          .\scripts\release\Build-Launcher.ps1 -Root $root -NoPause
          if (-not (Test-Path (Join-Path $root 'Launcher\Thornswood.exe'))) { Write-Host '::error::no Thornswood.exe came out of the build'; exit 1 }

      - name: Scan the built launcher for secrets
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # The secrets that shipped were in built artefacts, not in the source,
          # so what this build made is read too, byte by byte: the launcher with
          # everything Build-Launcher embeds in it, and the setup stub.
          $built = @(Join-Path $env:RUNNER_TEMP 'Thornswood\Launcher\Thornswood.exe')
          if (Test-Path out\setup-stub.exe) { $built += (Resolve-Path out\setup-stub.exe).Path }
          .\scripts\dev\Check-Secrets.ps1 -Binary $built
          exit $LASTEXITCODE

      # No artifact from this build: nothing read it, and the copies took most
      # of the account's Actions storage (#2163, 19 Oct; build.yml says more).

      # The monthly restore rehearsal check (#1046) reads RESTORING.md, which
      # is in the private ops repo since #3693; that repo's nightly runs it.

      - name: Is the source of what is inside frida-gum.lib where the notes say
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Issue #3287. SkyrimPlatformImpl.dll links frida-gum.lib, whose
          # LGPL parts go out under the GPL, so their source has to stay
          # where the note beside the file says: the Release of their
          # archives, which stays as long as the launcher ships frida-gum, and
          # the forks while records\frida-sources.json says they are up. Red
          # when the Release is gone or not whole once it is made (or not
          # made once the repository is public), when a fork's tag is not
          # its commit, or when the client files carry another Frida.
          .\scripts\release\Publish-FridaSources.ps1 -Check
          exit $LASTEXITCODE

      - name: Stray pull requests and branches
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # docs/guide/how-work-moves.md: no stray branches and no stray pull requests.
          # Every page of branches and of open pull requests, not only the
          # first hundred of each (issue #1201); tests\test-nightly-stray.ps1
          # runs it against a stand-in GitHub.
          .\scripts\dev\Nightly-Stray.ps1 -Run

      - name: Issues and comments written plain
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # docs/guide/the-board.md, "How an issue and a comment are written"
          # (#3692): every issue and comment of the last day, read through
          # the REST API; one written the old way is named and the night is
          # red until it is rewritten. tests\test-nightly-plain-issues.ps1
          # runs it against a stand-in GitHub.
          .\scripts\dev\Nightly-PlainIssues.ps1 -Run

      - name: Each GitHub App holds only what its record gives it
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The redesign's part 20 (plan line 26): the Bots' two Apps, the
          # box admin App, the watcher and the pin robot each hold exactly
          # the permissions and events records/github-apps.json gives them,
          # read from GitHub's GET /apps/<slug>. One holding more, or less,
          # is named and the night is red until Patrick changes the App or a
          # pull request changes the record. tests\test-app-permissions.js
          # runs it against a stand-in GitHub.
          node scripts/dev/Check-AppPermissions.js
          exit $LASTEXITCODE

  harnesses:
    # The test harnesses, in shares (#2357). One job for each entry under
    # shard, each on a runner of its own with 45 minutes of its own; another
    # share is one more number in the list, and Nightly-Harnesses.ps1 is told
    # how many there are. fail-fast off: one share failing must not cancel
    # the other, whose list of what failed is half the night's answer.
    name: Test harnesses (${{ matrix.shard }} of 2)
    # Each share is a build check's worth of harnesses, on a runner of its own.
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # Every commit and tree, no old file contents (about a second more than
      # a shallow one, measured 1 Nov 2026): the harnesses run the release
      # scripts on this checkout, and they work out the launcher's number
      # from when its sources last changed (scripts\release\LauncherVersion.ps1,
      # #5179), which a shallow checkout cannot say.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install the eslint the lint harness copies
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # tests\test-eslint-amp-path.ps1 (#1343, #2092) runs build.yml's
          # eslint lines offline: its npm stand-in copies eslint 9.39.5 out of
          # %TEMP%\herald-lint, and with nothing there it says SKIP and exits
          # 2. No runner had that folder, so it failed the first night it was
          # in the tree (#1273). This is the same pinned install build.yml's
          # lint step makes, into the folder the harness reads by default.
          $cache = Join-Path $env:TEMP 'herald-lint'
          npm install --prefix $cache --no-save --no-audit --no-fund --silent eslint@9.39.5
          if (-not (Test-Path -LiteralPath (Join-Path $cache 'node_modules\eslint\bin\eslint.js'))) {
            Write-Host '::error file=tests/test-eslint-amp-path.ps1::could not install eslint 9.39.5, so the lint harness has nothing to copy'
            exit 1
          }
          Write-Host ('eslint 9.39.5 is in ' + $cache)

      - name: Run the test harnesses
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # Written to be run by hand, and until 25 September never run
          # anywhere else. A harness that reads this machine's game folder
          # says SKIP for the parts it cannot measure on a runner and still
          # checks the rest. One at a time within the share, each on its
          # clock, each printed the moment it ends, and the step ends with
          # the ten slowest and every one that failed: the header of
          # scripts\dev\Nightly-Harnesses.ps1 says why each of those is so.
          # 2400 of the job's 45 minutes: a harness starts only when its
          # whole clock still fits, so the list of what failed is printed
          # before the job could be cancelled.
          # One report (#5295): each share keeps a test case for every check,
          # and the job "Harness report" merges both shares' into one.
          .\scripts\dev\Nightly-Harnesses.ps1 -Shard ${{ matrix.shard }} -Of 2 -BudgetSeconds 2400 -Report (Join-Path $env:RUNNER_TEMP 'harness-report\share.xml')

      - name: Keep this share's report for the harness report
        if: ${{ !cancelled() }}
        # The share's verdict is its harnesses'. When this upload fails, the
        # report job names this share as having left no report and is red,
        # so the failure is said where the report is read.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/harness-report/share.xml
          if-no-files-found: ignore
          # Read by the report job of this run, minutes later, and by
          # nothing after it.
          retention-days: 1

  harness-report:
    # The night's checks in one report (#5295): both shares' merged, kept
    # with the run, and every failing check named by harness on the run's
    # page. A share that left no report is named and turns this red.
    name: Harness report
    needs: harnesses
    if: ${{ !cancelled() && needs.harnesses.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/dev/Merge-HarnessReports.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: harness-report-*
          path: ${{ runner.temp }}/harness-reports
      - name: Merge the shares' reports into one
        shell: pwsh
        run: |
          $in = Join-Path $env:RUNNER_TEMP 'harness-reports'
          New-Item -ItemType Directory -Path $in -Force | Out-Null
          .\scripts\dev\Merge-HarnessReports.ps1 -Path $in -Expect 2 -Out (Join-Path $env:RUNNER_TEMP 'harness-report.xml') -Title 'Nightly harnesses'
          exit $LASTEXITCODE
      - name: Keep the merged report with the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-report
          path: ${{ runner.temp }}/harness-report.xml
          if-no-files-found: ignore
          retention-days: 14

  bot:
    # The bot harnesses install discord.py from pypi. While the repository
    # was private they ran on a box runner that reached the package feeds
    # (#4914): the signing runner, runner 3, reached GitHub and the signing
    # service only, and on 30 Oct pip got WinError 10013 there for every
    # connection (run 41030383899). Since the flip (#4013) no box runner is
    # registered here, the box signs nothing, and GitHub's runner reaches
    # pypi, so they run there and records/check-runners.json is gone (#4033).
    name: Bot harnesses
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run the bot harnesses
        shell: pwsh
        run: |
          # The two Python ones import bot.py for real, so they need the
          # library the bot runs on. They were written to be run by hand and,
          # like every harness above before this file existed, had never run
          # anywhere: nothing was checking the bot's startup on a pull request.
          #
          # An install that fails must fail the step (#1344). A soft pass here
          # made a green nightly that never ran the bot harnesses. A harness
          # that fails is red, and so is a missing venv or a pip that could
          # not install what the bot runs on.
          #
          # From requirements.txt, the file Install-Bot.ps1 installs on the
          # VPS, so the versions tested here are the versions the bot runs.
          #
          # Into a venv of this run's own, never the machine's Python.
          $venv = Join-Path $env:RUNNER_TEMP 'bot-venv'
          python -m venv $venv
          $py = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path $py)) {
            Write-Host '::error::could not make a venv for the bot harnesses, so they did not run'
            exit 1
          }
          & $py -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary :all: -r bot\requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::could not install discord.py from the hash-pinned bot\requirements.txt (a hash that does not match stops it, #2190), so the bot harnesses did not run'
            exit 1
          }
          #
          # Each on a clock, as in the step above: 300 seconds, then it and
          # everything it started are killed and it is named, and the rest
          # still run. Their output comes straight through as it is written.
          #
          # In UTF-8, as the bot itself runs (BotService.cs, Install-Bot.ps1)
          # and as tests\bot-python.js runs it: the output goes to a pipe
          # here, and Windows Python writes a pipe in the ANSI code page, so a
          # harness that printed a channel name with an emoji in it died on
          # the print (test-post-rules, test-wipe-channels, 23 Oct).
          $env:PYTHONIOENCODING = 'utf-8'
          $env:DISCORD_TOKEN = 'not-a-real-token'
          $PER_HARNESS = 300
          $bad = 0
          foreach ($t in (Get-ChildItem bot -Filter 'test-*.py' -File | Sort-Object Name)) {
            Write-Host ("--- {0}" -f $t.Name)
            $p = Start-Process -FilePath $py -ArgumentList ('"' + $t.FullName + '"') -NoNewWindow -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit($PER_HARNESS * 1000)) {
              & taskkill.exe /T /F /PID $p.Id 2>&1 | Out-Null
              $bad++; Write-Host ("::error file={0}::harness timed out after {1}s and was killed" -f $t.FullName, $PER_HARNESS)
            }
            elseif ($p.ExitCode -ne 0) { $bad++; Write-Host ("::error file={0}::harness failed (exit {1})" -f $t.FullName, $p.ExitCode) }
          }
          if ($bad) { exit 1 }
          Write-Host 'every bot harness passed'

  board:
    # Told last, once every job above has ended, passed or failed (#2357).
    # !cancelled() rather than always(): a run somebody cancels is not a
    # failed night, and always() still ran this after a cancel on 12 Oct
    # (run 38311224396), queued to post a failure, until the run was
    # force-cancelled. Whether a job stopped at its 45 minutes counts as a
    # cancel here is not measured; on 28 Sep (run 36401223346) such a run
    # ended cancelled. So the failed list does not depend on it: each
    # harness share stops starting harnesses inside its own budget and
    # prints the list itself.
    name: Put the night on the board
    needs: [nightly, harnesses, harness-report, bot]
    # Main only, as "nightly" above says (#3550).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Put a failure on the board
        if: ${{ needs.nightly.result != 'success' || needs.harnesses.result != 'success' || needs.harness-report.result != 'success' || needs.bot.result != 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One "Nightly checks failed" issue, never two: added to when one is
          # open (every page read, the oldest kept, any duplicate closed
          # pointing to it), opened when none is. Issues #905 and #1120.
          Write-Host ('checks: ${{ needs.nightly.result }}, harnesses: ${{ needs.harnesses.result }}, harness report: ${{ needs.harness-report.result }}, bot: ${{ needs.bot.result }}')
          .\scripts\dev\Nightly-Issue.ps1 -Result failure

      - name: Close the failure when every check passed
        if: ${{ needs.nightly.result == 'success' && needs.harnesses.result == 'success' && needs.harness-report.result == 'success' && needs.bot.result == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The first night every job above passes, the open "Nightly checks
          # failed" issue is closed with a line naming this run, so a fixed
          # nightly does not stay on the board as a failure.
          .\scripts\dev\Nightly-Issue.ps1 -Result success
