# Reads the whole board, every card's Status and Order, into a file a cloud
# session can download (#3192).
#
# WHY. The board is a Projects board, read here through GraphQL. It was a
# board of Patrick's own account until #5185 moved it to the ThornswoodRP
# organization. A cloud Claude thread is refused GraphQL and the projectsV2
# routes, a user's (403, measured again 22 Oct 2026) and the organization's
# (1 Nov 2026), and on 22 Oct only 2 of the 242 open issues carried a board:
# label, so nothing a cloud thread could read said which column an issue was
# in. Nothing a thread does moves a card (board.yml does, from the facts), and
# this is how one sees them. Patrick, 22 Oct, asked
# for the whole board to be reviewed from the cloud: "we make it so the cloud
# can".
#
# HOW. A cloud thread runs
#
#   pwsh scripts/ops/Read-Board.ps1
#
# which starts this workflow on main, waits for the run, reads board.json
# back out of the run's log and writes it where it says. The run changes
# nothing on the board: every call it makes is a GraphQL query.
#
# THE HAND-BACK IS THE LOG, NOT AN ARTIFACT (#3410). Until 25 Oct 2026 the
# file was the run's artifact "board". Artifact storage is capped at 500 MB
# for the whole repository, and that day it was full: three board reads in a
# row (runs 40210248299, 40211493452, 40231207157) read all 712 cards and
# could not hand them back. A run's log takes no room in that storage. So the
# read step prints board.json, gzipped and in base64, between a BOARD-JSON
# begin line (its length and sha256) and a BOARD-JSON end line, 4000
# characters a line, and Read-Board.ps1 reads the job's log, puts it back
# together and holds it to that length and sha256. GitHub keeps a log 90
# days.
#
# WHAT board.json HOLDS. When it was read, the board's title and address, its
# Status options in board order, its built-in workflows and whether each is
# on, and one entry per card: the repository, number, kind (Issue,
# PullRequest or DraftIssue), title, state (OPEN, CLOSED or MERGED), Status,
# Order and whether the card is archived. A card with no Status or Order has
# null there.
#
# THE TOKEN. The board App's (board.yml's header says what it is), minted
# for the job from its key in the "board" environment, which only main may
# use, with the organization's Projects to read and nothing else. The run's
# own token is given no permissions at all.
#
# WHERE IT RUNS. On GitHub's ubuntu-latest. The read is a few GraphQL pages.
# Its one action, the token's, is pinned by a full commit.
name: Read the board
run-name: Board read by ${{ github.actor }}
on:
  workflow_dispatch:
permissions: {}
jobs:
  read:
    name: Read every card
    runs-on: ubuntu-latest
    environment: board
    # A dozen calls to GitHub. Past this it is stuck, not slow.
    timeout-minutes: 5
    steps:
      - name: The board App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOARD_APP_KEY }}
          permission-organization-projects: read

      - name: Read the board into board.json
        id: read
        shell: pwsh
        env:
          BOARD_TOKEN: ${{ steps.app.outputs.token }}
          BOARD_OWNER: ${{ github.repository_owner }}
          BOARD_NUMBER: ${{ vars.BOARD_NUMBER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:BOARD_TOKEN) { throw 'BOARD_TOKEN is not set: the board App gave no token, so nothing can reach the board (#5185 says how it is made)' }
          if ($env:BOARD_NUMBER -notmatch '^\d+$') { throw 'BOARD_NUMBER, the board environment''s variable, is not the board''s number (#5185)' }
          function Board([string]$query, [hashtable]$vars) {
            $h = @{ Authorization = "Bearer $env:BOARD_TOKEN"; 'Content-Type' = 'application/json' }
            $body = @{ query = $query; variables = $vars } | ConvertTo-Json -Depth 6 -Compress
            $r = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/graphql' -Headers $h -Body $body
            if ($r.PSObject.Properties['errors'] -and $r.errors) { throw ('the board answered: ' + (@($r.errors | ForEach-Object { $_.message }) -join '; ')) }
            return $r.data
          }
          function Has($o, [string]$name) { return ($null -ne $o -and $o.PSObject.Properties[$name] -and $null -ne $o.$name) }

          $who = @{ o = $env:BOARD_OWNER; n = [int]$env:BOARD_NUMBER }
          $d = Board 'query($o:String!,$n:Int!){organization(login:$o){projectV2(number:$n){title url status:field(name:"Status"){... on ProjectV2SingleSelectField{options{name}}} workflows(first:50){nodes{name enabled}}}}}' $who
          $project = $d.organization.projectV2
          if (-not $project) { throw "board $env:BOARD_NUMBER of $env:BOARD_OWNER is not there, or the token cannot see it" }
          if (-not (Has $project 'status') -or -not (Has $project.status 'options')) { throw 'the board has no single-select field named Status' }

          $items = New-Object System.Collections.Generic.List[object]
          $after = $null
          do {
            $vars = $who.Clone(); $vars.c = $after
            $page = (Board 'query($o:String!,$n:Int!,$c:String){organization(login:$o){projectV2(number:$n){items(first:100,after:$c){pageInfo{hasNextPage endCursor} nodes{isArchived status:fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{name}} order:fieldValueByName(name:"Order"){... on ProjectV2ItemFieldNumberValue{number}} content{__typename ... on Issue{number title state repository{nameWithOwner}} ... on PullRequest{number title state repository{nameWithOwner}} ... on DraftIssue{title}}}}}}}' $vars).organization.projectV2.items
            foreach ($n in @($page.nodes)) {
              $c = $n.content
              $items.Add([ordered]@{
                repo     = $(if ((Has $c 'repository')) { $c.repository.nameWithOwner } else { $null })
                number   = $(if ((Has $c 'number')) { [int]$c.number } else { $null })
                kind     = $(if ((Has $c '__typename')) { $c.__typename } else { $null })
                title    = $(if ((Has $c 'title')) { $c.title } else { $null })
                state    = $(if ((Has $c 'state')) { $c.state } else { $null })
                status   = $(if ((Has $n 'status') -and (Has $n.status 'name')) { $n.status.name } else { $null })
                order    = $(if ((Has $n 'order') -and (Has $n.order 'number')) { [double]$n.order.number } else { $null })
                archived = [bool]$n.isArchived
              })
            }
            $after = $page.pageInfo.endCursor
          } while ($page.pageInfo.hasNextPage)

          $out = [ordered]@{
            read_at   = [DateTime]::UtcNow.ToString('o')
            board     = [ordered]@{ owner = $env:BOARD_OWNER; number = [int]$env:BOARD_NUMBER; title = $project.title; url = $project.url }
            statuses  = @($project.status.options | ForEach-Object { $_.name })
            workflows = @(@($project.workflows.nodes) | ForEach-Object { [ordered]@{ name = $_.name; enabled = [bool]$_.enabled } })
            items     = $items.ToArray()
          }
          $dir = Join-Path $env:RUNNER_TEMP 'board-read'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir 'board.json'
          [IO.File]::WriteAllText($file, ($out | ConvertTo-Json -Depth 6), (New-Object System.Text.UTF8Encoding $false))
          Write-Host ("read {0} cards from {1}" -f $items.Count, $project.url)
          foreach ($g in @($items | Group-Object { if ($_.status) { $_.status } else { '(no Status)' } } | Sort-Object Name)) { Write-Host ("  {0}: {1}" -f $g.Name, $g.Count) }
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # The hand-back (header, THE HAND-BACK IS THE LOG). The marker is
          # put together here so the script's own text, which the log shows
          # first, never holds it.
          $mark = 'BOARD' + '-JSON'
          $bytes = [IO.File]::ReadAllBytes($file)
          $sha = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          $packed = New-Object IO.MemoryStream
          $zip = New-Object IO.Compression.GZipStream($packed, [IO.Compression.CompressionLevel]::Optimal)
          $zip.Write($bytes, 0, $bytes.Length)
          $zip.Dispose()
          $b64 = [Convert]::ToBase64String($packed.ToArray())
          Write-Host ("{0} begin {1} {2}" -f $mark, $bytes.Length, $sha)
          for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Host ("{0} {1}" -f $mark, $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
          Write-Host ("{0} end" -f $mark)

      # The file is in the log now; the runner keeps nothing of it.
      - name: Remove board.json from the runner
        if: always()
        shell: pwsh
        env:
          READ_DIR: ${{ steps.read.outputs.dir }}
        run: |
          if ($env:READ_DIR -and (Test-Path -LiteralPath $env:READ_DIR)) { Remove-Item -LiteralPath $env:READ_DIR -Recurse -Force }
