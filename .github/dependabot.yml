# What this repository depends on, watched rather than remembered.
#
# TWO ECOSYSTEMS, because two manifests exist here, and the engine submodule
# is watched another way (below).
#
# github-actions: every workflow pins actions by full length commit SHA (see
# build.yml), and a pinned action still goes stale quietly when the tag it
# was taken from moves. Dependabot opens a pull request that updates the SHA
# and the tag comment together.
#
# pip: bot\requirements.txt names the three libraries the bot and its
# harnesses install (discord.py, pillow, certifi). Nightly installs from that
# file into a per-run venv; Install-Bot.ps1 installs the same file on the VPS.
# Watching /bot keeps those versions from going stale without a hand check.
#
# NOT npm: there is no package.json anywhere in this repository. The site and
# the voice service are deliberately written against node's own library and
# depend on nothing. Pointing dependabot at a folder with no manifest gives
# an error on the Dependabot tab that reads like a fault and watches nothing,
# which is worse than not configuring it.
#
# NOT gitsubmodule, for engine/skymp (issue #1348). Dependabot's bump would
# move the pin alone, and a pin is merged only with a client build and a
# server build of the same commit, recorded in records\client-build.json and
# records\server-build.json on a machine that builds the engine (engine\README.md,
# "One engine"). tests\test-one-engine.js turns every such pull request red,
# so each would sit open until closed by hand. The bump itself is already
# watched: tests\test-engine-at-fork-head.js runs every night (nightly.yml)
# and is red, naming the commits, as soon as the head of
# thornswood/engine-changes has a change the pin does not, and a red night
# opens an issue on the board. Upstream skyrim-multiplayer/skymp reaches us
# only through that branch, so a submodule entry here would not see it.
#
# The launcher is C# built by MSBuild from launcher/app/Thornswood.csproj with
# no package manager at all, by design: WebView2 is vendored in launcher/lib
# and referenced by path (#498), so there is nothing here for it.
#
# Weekly rather than daily: this is a two person project, and a pull request a
# day from a robot is a pull request nobody reads.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /bot
    schedule:
      interval: weekly
    commit-message:
      prefix: "bot"
